<script>
/* Build Your Practice: the business that sits above every journey.
 *
 * Every day costs money (your living costs plus rent). Clients in your book pay a
 * little every day, but only while they are happy: satisfaction slips unless you
 * spend days servicing them. Prospects wait in your pipeline, go cold, and can be
 * taken by rivals. Practice upgrades (workspace, a partner, recruits, systems
 * earned on the trail) change the math.
 *
 * Levels compare daily income with daily costs:
 *   Unemployed  savings below zero (career over)
 *   Survivable  income below costs
 *   Sustainable income covers costs
 *   Profitable  income covers twice your costs (the goal)
 */
(function (PP) {
  const P = (PP.content.practice = {
    levels: [
      { id: 'unemployed', label: 'Unemployed', blurb: 'Savings ran out.' },
      { id: 'survivable', label: 'Survivable', blurb: 'Living off savings. Income is below costs.' },
      { id: 'sustainable', label: 'Sustainable', blurb: 'Your income covers your costs.' },
      { id: 'profitable', label: 'Profitable', blurb: 'Your income covers twice your costs.' }
    ],
    clawback: 2000,
    // What each journey outcome pays. now = commission; perDay = ongoing income while the client stays happy.
    payout(s, destId, fit) {
      const trust = s.res.trust;
      if (destId === 'not_now') return trust >= 6
        ? { now: 0, perDay: 0, sat: 7, status: 'door', note: 'No sale today, but the door is open. They may come back.' }
        : { now: 0, perDay: 0, sat: 0, status: 'lost', note: 'They walked away. No sale, no relationship.' };
      if (destId === 'grand_plan' && fit === 'poor') return { now: 3000, perDay: 0, sat: 4, status: 'at-risk', note: 'Big commission now. But it was not the right fit, and they might cancel.' };
      if (fit === 'appropriate') return { now: 1500, perDay: trust >= 4 ? 50 : 30, sat: trust >= 7 ? 9 : 8, status: 'life', referral: trust >= 7, note: trust >= 7 ? 'A client for life, and they want to refer a friend.' : 'A client for life.' };
      if (fit === 'acceptable') return { now: 1000, perDay: 25, sat: 7, status: 'steady', note: 'A solid client. Not perfect, but steady.' };
      return { now: 500, perDay: 0, sat: 4, status: 'at-risk', note: 'A small sale that does not fit. It may not last.' };
    },
    workspaces: {
      kitchen: { name: 'Kitchen table', rent: 0, trust: 0, walkIn: 0, blurb: 'Free. Clients meet you at coffee shops. Nobody walks in.' },
      desk: { name: 'Shared desk at the Harbor Co-op', rent: 25, trust: 1, walkIn: 0.04, blurb: 'Looks professional (+1 starting Trust). The odd walk-in prospect.' },
      office: { name: 'Your own office on Harbor Street', rent: 70, trust: 1, walkIn: 0.12, blurb: 'A sign on the door brings regular walk-ins. Needed before you can recruit agents.' }
    },
    partners: [
      { id: 'avery', name: 'Avery Chen', blurb: 'Detail-oriented and great at follow-up. Quiet at events.', referral: 0.06, cover: 0.4 },
      { id: 'riley', name: 'Riley Park', blurb: 'Great with people, brings in leads, a little chaotic with paperwork.', referral: 0.12, cover: 0.65 }
    ],
    partnerTerms: 'You split rent 50/50 and each keep 75% of new commissions (25% goes to the partner). They look after your clients while you are on the trail, and pass you leads.',
    partnerNeeds: 2,
    recruits: [
      { id: 'devon', name: 'Devon', blurb: 'Career changer. Eager, needs structure.', override: 25, quit: 0.06 },
      { id: 'mei', name: 'Mei', blurb: 'Recent grad. Sharp, a little impatient.', override: 35, quit: 0.12 }
    ],
    recruitNeeds: 3, hireCost: 500, trainDays: 3, mentorEvery: 30,
    /* Systems are earned on the trail: handle a landmark well to earn its Mark,
     * then build the matching system back at Port Prospect. */
    systems: {
      discovery: { name: 'Discovery guide', mark: 'meadows', cost: 500, blurb: 'A proven set of first-meeting questions. Check-ins never stall for lack of Curiosity.' },
      notes: { name: 'Note-taking system', mark: 'fog', cost: 400, blurb: 'Never lose a detail again. A new option in the Fog of Forgotten Info.' },
      crm: { name: 'Client database (CRM)', mark: 'loop', cost: 900, blurb: 'Enter it once. The Loop of Endless Data Entry trails take a day less, with a clean way out.', shortens: 'loop' },
      planning: { name: 'Planning software', mark: 'swamp', cost: 1200, blurb: 'Builds a boardwalk across Spreadsheet Swamp: its trails take a day less, with a better option inside.', shortens: 'swamp' },
      focus: { name: 'Focus routine', mark: 'sands', cost: 300, blurb: 'A simple rule for weighing every incentive against what the client actually needs. New options in the Shifting Sands of Incentives.' },
      specialist: { name: 'Specialist partnership', mark: 'summit', cost: 800, blurb: 'A standing relationship with the Summit. Its trails take a day less; handoffs go smoothly.', shortens: 'summit' },
      tech: { name: 'Tech setup', mark: 'isles', cost: 600, blurb: 'Logins, portals and e-signatures that just work. New options in the Login Isles.' },
      review: { name: 'Review process', mark: 'toll', cost: 600, blurb: 'Files always current. Sail through the Annual Review Toll Bridge.' }
    },
    names: {
      taylor: ['Taylor', 'Jamie', 'Alex', 'Robin', 'Casey', 'Drew', 'Kai', 'Jesse'],
      morgan: ['Morgan', 'Sam', 'Dana', 'Quinn', 'Reese', 'Harper', 'Elliot', 'Blair'],
      rosa: ['Rosa', 'Lena', 'Marisol', 'Bea', 'Nadia', 'Ines', 'Carmen', 'Opal'],
      evelyn: ['Evelyn', 'Marguerite', 'Dolores', 'Imelda', 'Hiroko', 'Agnes', 'Winifred', 'Odette'],
      walter: ['Walter', 'Gerald', 'Lionel', 'Raymond', 'Desmond', 'Arturo', 'Clifford', 'Ignatius'],
      mateo: ['Mateo', 'Jaylen', 'Arjun', 'Tobias', 'Nico', 'Malik', 'Soren', 'Emeka'],
      lorraine: ['Lorraine', 'Denise', 'Yolanda', 'Shirin', 'Colleen', 'Patrice', 'Mona', 'Theresa'],
      zoe: ['Zoe', 'Wren', 'Juniper', 'Sasha', 'Ari', 'Ellis', 'Noor', 'Indigo'],
      darnell: ['Darnell', 'Julian', 'Tomas', 'Andre', 'Felix', 'Ravi', 'Curtis', 'Owen'],
      ingrid: ['Ingrid', 'Celeste', 'Margo', 'Anouk', 'Tamsin', 'Freya', 'Leila', 'Vivian'],
      rafael: ['Rafael', 'Santiago', 'Dmitri', 'Kwame', 'Lorenzo', 'Bastian', 'Hamid', 'Ezra'],
      maxine: ['Maxine', 'Maureen', 'Adaeze', 'Philippa', 'Consuelo', 'Annette', 'Bridget', 'Lourdes']
    },
    life: { hot: 24, warm: 15, cold: 9 }
  });

  PP.newCareer = function (agentId) {
    const a = PP.content.agentTypes.find((x) => x.id === agentId) || PP.content.agentTypes[0];
    const skills = Object.assign({ curiosity: 0, preparation: 0, communication: 0, navigation: 0, resourcefulness: 0, judgment: 0 }, a.skills);
    return {
      agent: a.id, savings: a.savings, living: a.living, market: a.market,
      days: 0, journeys: 0,
      book: [], pipeline: [], inbox: [], history: [],
      skills, contacts: [], met: {}, quests: {},
      workspace: 'kitchen', partner: null, recruits: [], systems: {},
      marks: a.id === 'insider' ? { swamp: true } : {},
      known: { port: true },
      lastService: 0, usedNames: {}, over: false, bestLevel: 'survivable'
    };
  };

  const C = (PP.career = {
    agent(c) { return PP.content.agentTypes.find((x) => x.id === c.agent) || PP.content.agentTypes[0]; },
    rent(c) { return P.workspaces[c.workspace].rent * (c.partner ? 0.5 : 1); },
    costs(c) { return c.living + C.rent(c); },
    bookIncome(c) { return c.book.reduce((a, b) => a + (b.status === 'life' || b.status === 'steady' ? b.perDay : 0), 0); },
    overrides(c) { return c.recruits.reduce((a, r) => a + (r.trained ? r.override : 0), 0); },
    income(c) { return C.bookIncome(c) + C.overrides(c); },
    level(c) {
      if (c.savings < 0) return 'unemployed';
      const inc = C.income(c), cost = C.costs(c);
      if (inc >= cost * 2) return 'profitable';
      if (inc >= cost) return 'sustainable';
      return 'survivable';
    },
    levelInfo(c) { const id = C.level(c); return P.levels.find((l) => l.id === id); },
    runway(c) { const net = C.costs(c) - C.income(c); return net <= 0 ? Infinity : Math.max(0, Math.floor(c.savings / net)); },
    hasSystem(c, id) { return !!(c && c.systems && c.systems[id]); },
    money(n) { const v = Math.round(n); return (v < 0 ? '−$' : '$') + Math.abs(v).toLocaleString('en-US'); },
    save(c) { PP.store.set('career2', c); },
    load() { const c = PP.store.get('career2', null); return c && !c.over ? c : null; },
    clear() { PP.store.set('career2', null); },

    /* Prospects */
    newName(c, arch) {
      const list = P.names[arch] || (PP.content.clients[arch] && PP.content.clients[arch].names) || [PP.content.clients[arch].name];
      const used = c.usedNames[arch] || 0;
      c.usedNames[arch] = used + 1;
      return list[used % list.length] + (used >= list.length ? ' ' + String.fromCharCode(65 + Math.floor(used / list.length) - 1) + '.' : '');
    },
    addProspect(c, opts) {
      // Every archetype can show up. A bias (by archetype id or by segment) makes some likelier.
      const bias = Object.assign({}, opts.bias || {});
      if (c.agent === 'insider') bias.numbers = (bias.numbers || 0) + 1;
      const weights = {};
      Object.values(PP.content.clients).forEach((cl) => { weights[cl.id] = 1 + (bias[cl.id] || 0) * 1.5 + (bias[cl.segment] || 0) * 1.5; });
      // Gently favour archetypes this career hasn't met much yet, so runs feel fresh.
      Object.keys(weights).forEach((k) => { weights[k] /= 1 + 0.6 * (c.usedNames[k] || 0); });
      let arch = opts.archetype;
      if (!arch) { const tot = Object.values(weights).reduce((a, b) => a + b, 0); let r = Math.random() * tot; for (const k in weights) { r -= weights[k]; if (r <= 0) { arch = k; break; } } arch = arch || Object.keys(weights)[0]; }
      let temp = opts.temp || 'warm';
      if (temp === 'cold' && c.agent === 'connector' && opts.event) temp = 'warm';
      const p = { id: PP.uid('p'), archetype: arch, name: C.newName(c, arch), temp, source: opts.source || 'met somewhere', expires: c.days + P.life[temp] };
      c.pipeline.push(p);
      return p;
    },
    /* Build a playable client from a prospect: the archetype with a new name. */
    makeClient(p) {
      const base = PP.content.clients[p.archetype];
      const json = JSON.stringify(base).split(base.name).join(p.name);
      const cl = JSON.parse(json);
      cl.id = p.archetype;
      cl.prospectId = p.id;
      cl.temp = p.temp;
      cl.source = p.source;
      return cl;
    },

    /* One day passes. away = on the trail. Returns notes for the player. */
    tickDay(c, away) {
      const notes = [];
      const note = (text, kind, mail) => { notes.push({ text, kind }); if (mail) c.inbox.push({ text, kind, mail }); };
      c.savings += C.income(c) - C.costs(c);
      c.days++;
      // Clients
      const decay = 0.2 * (away && c.partner ? 1 - P.partners.find((x) => x.id === c.partner).cover : 1);
      c.book.forEach((b) => {
        if (b.status === 'cancelled' || b.status === 'lost') return;
        b.sat = Math.max(0, (b.sat == null ? 7 : b.sat) - decay);
        const active = b.status === 'life' || b.status === 'steady' || b.status === 'at-risk';
        if (active && ((b.sat < 3.5 && PP.chance(0.06)) || (b.status === 'at-risk' && PP.chance(0.02)))) {
          const claw = b.status === 'at-risk';
          b.status = 'cancelled'; b.perDay = 0;
          if (claw) c.savings -= P.clawback;
          note(`${b.name} cancelled. ${claw ? `It was never the right fit. ${C.money(-P.clawback)} clawed back.` : 'They had not heard from you in a long time.'}`, 'bad', 'cancel');
        } else if (b.status === 'door' && PP.chance(0.02)) {
          b.status = 'life'; b.perDay = 50; b.sat = 8; c.savings += 1000;
          note(`${b.name}, who said "not yet," is ready now and wants to work with you. +${C.money(1000)}, and they join your book.`, 'good', 'return');
        }
      });
      // Life changes: existing clients call you back, which starts a follow-up journey.
      c.followUps = (c.followUps || []).filter((f) => {
        const b = c.book.find((x) => x.id === f.bookId);
        if (!b || b.status === 'cancelled') return false;
        if (c.days > f.expires) { b.sat = Math.max(0, b.sat - 2); note(`${b.name} waited for you to follow up about "${f.title.toLowerCase()}" and stopped waiting.`, 'bad', 'followup'); return false; }
        return true;
      });
      c.book.forEach((b) => {
        if (!['life', 'steady'].includes(b.status) || c.followUps.some((f) => f.bookId === b.id)) return;
        if (c.days - (b.lastLap != null ? b.lastLap : (b.day || 0)) < 10 || !PP.chance(0.045)) return;
        const seg = (PP.content.clients[b.archetype] || {}).segment;
        const pool = (PP.content.lifeChanges || []).filter((lc) => (!lc.segs || lc.segs.includes(seg)) && !(b.changes || []).includes(lc.id));
        if (!pool.length) return;
        const lc = PP.pick(pool);
        c.followUps.push({ id: PP.uid('f'), bookId: b.id, change: lc.id, title: lc.title, expires: c.days + 20 });
        note(`${b.name} called: ${lc.title.toLowerCase()}. They'd like to meet. (A follow-up journey is waiting at the Trailhead.)`, 'good', 'followup');
      });
      // Pipeline
      c.pipeline = c.pipeline.filter((p) => {
        if (c.days > p.expires) { note(`${p.name} lost interest while waiting. They are off your pipeline.`, 'bad'); return false; }
        if (away && PP.chance(0.02)) { note(`A rival agent signed ${p.name} while you were on the trail.`, 'bad', 'poach'); return false; }
        return true;
      });
      // Walk-ins and partner leads
      const ws = P.workspaces[c.workspace];
      if (ws.walkIn && PP.chance(ws.walkIn)) { const p = C.addProspect(c, { temp: 'cold', source: 'walked into your office' }); note(`${p.name} walked into your ${c.workspace === 'office' ? 'office' : 'desk at the Co-op'} asking for help.`, 'good'); }
      if (c.partner) { const pt = P.partners.find((x) => x.id === c.partner); if (PP.chance(pt.referral)) { const p = C.addProspect(c, { temp: 'warm', source: `referral from ${pt.name}` }); note(`${pt.name} passed you a lead: ${p.name}.`, 'good'); } }
      // Recruits
      c.recruits = c.recruits.filter((r) => {
        if (!r.trained) return true;
        if (c.days - r.lastMentor > P.mentorEvery && PP.chance(r.quit)) { note(`${r.name} quit. They felt nobody was mentoring them.`, 'bad', 'quit'); return false; }
        return true;
      });
      return notes;
    }
  });

  /* News by carrier pigeon, delivered on the trail. */
  PP.content.mailEvent = function (s, item) {
    const choices = [{ label: 'Tuck the note away and keep going', kind: 'through', eff: {}, result: 'Back to the trail.' }];
    if (item.mail === 'cancel') choices.unshift({ label: 'Write back to ask what went wrong', kind: 'prepare', eff: { energy: -1, insight: 1 }, result: 'The reply is kind, and honest: "We never felt looked after." Lesson noted.' });
    if (item.mail === 'return') choices.unshift({ label: 'Write back and welcome them', kind: 'prepare', eff: { trust: 1 }, result: 'Your client notices you smiling.' });
    return { id: 'mail_' + PP.uid('m'), title: 'A carrier pigeon lands on your pack', at: ['travel'], cut: 'mail', text: 'There is a note tied to its leg. ' + item.text, choices };
  };
})(window.PP);

<script>
/* Prospecting at Port Prospect. Each activity takes a day and fills your pipeline.
 * Mini-game activities return result.prospects = [{ temp, bias, source }].
 * Simple activities resolve instantly through runSimpleProspecting.
 * Optional on any activity: requires(c) -> bool and requiresText, so the UI can
 * disable the button with a reason (runSimpleProspecting also checks and refunds). */
(function (PP) {
  const activeClients = (c) => c.book.filter((b) => ['life', 'steady', 'at-risk'].includes(b.status));

  PP.content.prospecting = [
    { id: 'warm', name: 'Call your natural market', cost: 0, blurb: 'Friends, family, old colleagues. Warm, easy, and it runs out.', simple: true },
    { id: 'callathon', name: 'Call-a-thon', cost: 0, minigame: 'callathon', blurb: 'One phone, a list of strangers, and every objection in the book. Handle them fast.' },
    { id: 'mixer', name: 'Chamber of Commerce mixer', cost: 60, minigame: 'mixer', blurb: 'Name tags and warm white wine. Find the business owners. Avoid the essential oils.' },
    { id: 'market', name: 'Farmers market tent', cost: 120, minigame: 'market', blurb: 'A folding table, a raffle fishbowl, and a rival with an inflatable tube man.' },
    { id: 'seminar', name: 'Host a lunch & learn', cost: 400, blurb: 'Sandwiches for twenty. Whoever shows up, shows up. Better with Communication.', simple: true },
    { id: 'referrals', name: 'Ask happy clients for referrals', cost: 0, blurb: 'The best leads come from people who already trust you. Needs happy clients.', simple: true,
      requires: (c) => c.book.some((b) => (b.status === 'life' || b.status === 'steady') && b.sat >= 7), requiresText: 'Needs at least one happy client.' },
    { id: 'fair', name: 'Booth at the school fair', cost: 80, blurb: 'A folding table between the bake sale and the dunk tank. Parents, grandparents, and a lot of sticky hands.', simple: true },
    { id: 'library', name: 'Free workshop at the library', cost: 30, blurb: 'Room B, Tuesday night, Connie\'s rule: teach, don\'t sell. Handouts cost a little. Better with Communication.', simple: true },
    { id: 'stripmall', name: 'Cold-walk the strip mall', cost: 0, blurb: 'Nine doors, nine owners, at least four "No soliciting" signs. Business owners, mostly cold.', simple: true },
    { id: 'neighbors', name: 'Post in the neighborhood group', cost: 0, blurb: 'Between the lost cats and the leaf-blower wars, a short, friendly hello. Free, and anything can happen.', simple: true },
    { id: 'littleleague', name: 'Sponsor a Little League team', cost: 250, blurb: 'Your name on fourteen small shirts and a day in the bleachers. Families and local business owners.', simple: true },
    { id: 'appreciation', name: 'Throw a client appreciation evening', cost: 200, blurb: 'Thank your clients and tell them to bring a friend. Clients feel looked after; some friends become prospects. Needs clients.', simple: true,
      requires: (c) => activeClients(c).length > 0, requiresText: 'Needs at least one client in your book.' }
  ];

  /* ---- Random outcome tables for the newer simple activities ----
   * Each outcome: w (weight, number or fn(c)), n (count or [min,max]),
   * temp ('warm' | 'cold' | 'hot' | 'mix'), bias (extra bias), text(names, n, c). */
  const list = (ps) => {
    const n = ps.map((p) => p.name);
    return n.length <= 1 ? n.join('') : n.slice(0, -1).join(', ') + ' and ' + n[n.length - 1];
  };
  const OUT = {
    fair: { event: true, source: 'the school fair', bias: { family: 2, caregiver: 1 }, outcomes: [
      { w: 3, n: 2, temp: 'warm', text: (x) => `You share a corner with the bake sale. Parents come for the brownies and stay to talk. ${x} want to hear more.` },
      { w: 3, n: 1, temp: 'warm', text: (x) => `The dunk tank is right next to you. Mostly you hear splashing. Then a damp parent, ${x}, dries off and asks a genuinely good question about "doing this properly before the kids get older."` },
      { w: 2, n: 0, text: () => 'A gang of nine-year-olds takes every pen, every sticker and one of your chairs. No prospects, but you are now famous with the third grade.' },
      { w: 2, n: 3, temp: 'mix', text: (x) => `Your "Guess the jelly beans" jar is a hit: sixty slips and three real conversations. ${x} all leave their numbers. The winner guessed 412. It was 411.` },
      { w: 2, n: 1, temp: 'cold', text: (x) => `The PTA moves you next to the bouncy castle. You shout an entire conversation with ${x} over the generator. They seem to have heard most of it.` },
      { w: 2, n: 2, temp: 'warm', bias: { caregiver: 2 }, text: (x) => `A grandmother collecting two kids tells you about her mother, her kids and her kids' kids, all at once. She sends over ${x}. "They need you more than I do, dear."` }
    ] },
    library: { event: true, source: 'your library workshop', bias: { early: 1, retiree: 1, changes: 1, windfall: 1 }, outcomes: [
      { w: 3, n: 2, temp: 'warm', text: (x) => `Twelve chairs, nine people, no selling. You teach one idea properly instead of six badly. Afterwards ${x} hang back to ask if you do one-on-ones.` },
      { w: 2, n: 1, temp: 'warm', text: (x) => `Three people come. One is asleep. One is Connie. The third, ${x}, fills a whole page with notes and asks for your card "for when I'm ready."` },
      { w: (c) => (c.skills.communication ? 1 : 3), n: 0, text: () => 'The projector refuses to talk to your laptop. You do the whole thing on a whiteboard with a dying marker. Nobody follows up, but Connie says you were "very nearly clear."' },
      { w: 2, n: 2, temp: 'mix', text: (x) => `One question turns into a twenty-minute story about an uncle and a timeshare. You let it, because everyone is nodding. ${x} email you that night.` },
      { w: (c) => 1 + (c.skills.communication || 0) * 2, n: 3, temp: 'warm', text: (x) => `You skip the slides and just answer questions. It is the best hour you have had all month. ${x} all want to keep the conversation going.` },
      { w: 1, n: 1, temp: 'hot', text: (x) => `A woman in the front row has clearly been waiting years for someone to explain this without making her feel silly. ${x} books a meeting before you have packed up.` }
    ] },
    stripmall: { source: 'cold-walking the strip mall', bias: { owner: 3 }, outcomes: [
      { w: 3, n: 1, temp: 'cold', text: (x) => `Nail salon, vape shop, dentist, sandwich place. The sandwich place owner, ${x}, talks to you between orders and admits nobody has ever asked how the business is actually doing.` },
      { w: 3, n: 0, text: () => 'Every door says "No soliciting." One says "No soliciting. Yes, you." You buy a sandwich out of respect and go home.' },
      { w: 2, n: 2, temp: 'cold', text: (x) => `You stop pitching after the second door and start asking "what's your busiest month?" instead. People open up. ${x} take your card and actually read it.` },
      { w: 2, n: 1, temp: 'warm', text: (x) => `The dry cleaner recognizes you from the farmers market. "You're the one who didn't have a tube man!" ${x} has questions and twenty minutes.` },
      { w: 2, n: 1, temp: 'cold', text: (x) => `The tattoo parlor owner, ${x}, hears you out with great seriousness. "Come back Tuesday. It's dead on Tuesdays. We'll talk properly."` },
      { w: 1, n: 0, text: () => 'You get as far as the pet groomer, where a very large dog leans on you for forty minutes. You are not allowed to leave. Nobody signs anything. You feel great.' }
    ] },
    neighbors: { source: 'your post in the neighborhood group', bias: { family: 1, changes: 1, caregiver: 1, early: 1 }, outcomes: [
      { w: 3, n: 0, text: () => 'Your post lands between a lost cat and a forty-comment fight about leaf blowers. It gets two likes. One is your aunt.' },
      { w: 3, n: 1, temp: 'cold', text: (x) => `${x} sends you a private message: "Saw your post. Not sure if this is your kind of thing, but..." It is exactly your kind of thing.` },
      { w: 2, n: 2, temp: 'warm', text: (x) => `Someone asks the group "does anyone know someone who explains money stuff without being weird about it?" Three people tag you. ${x} get in touch.` },
      { w: 2, n: 1, temp: 'warm', text: (x) => `Your post gets reported as spam. The moderator, who turns out to live next door to one of your clients, restores it with a note: "This one's alright." ${x} reaches out the same day.` },
      { w: 2, n: 0, text: () => 'A man replies "scam" with no further explanation. Eleven people like his comment. You decide not to argue with a stranger online, which is the most professional thing you do all week.' },
      { w: 1, n: 2, temp: 'mix', text: (x) => `You reply to a question about something else entirely with a helpful, plain answer and no pitch. It gets more attention than your post did. ${x} want to talk.` }
    ] },
    littleleague: { event: true, source: 'the Little League bleachers', bias: { family: 2, owner: 1 }, outcomes: [
      { w: 3, n: 2, temp: 'warm', text: (x) => `Your name is on the back of fourteen shirts. The Harbor Hawks lose 14-2, but in the bleachers ${x} want to know who you are and what you do.` },
      { w: 2, n: 1, temp: 'warm', text: (x) => `The jerseys arrive with your name misspelled. One parent, ${x}, thinks it is the funniest thing they have ever seen and insists on buying you a hot dog and hearing all about it.` },
      { w: 2, n: 3, temp: 'warm', text: (x) => `The Hawks win. Nobody can explain how. At the pizza party ${x} all thank "the sponsor" and ask for your card.` },
      { w: 2, n: 1, temp: 'warm', bias: { owner: 3 }, text: (x) => `The coach, ${x}, runs a landscaping business and spends three innings telling you about the slow season. "Can we talk properly? Not here, Tyler is about to bat."` },
      { w: 2, n: 0, text: () => 'It rains. The game is cancelled. You eat orange slices alone in your car and look at the banner, which does look great.' },
      { w: 1, n: 2, temp: 'mix', text: (x) => `You get roped into running the scoreboard and get the score wrong twice. Parents forgive you. ${x} even ask for a meeting, "as long as you're better with numbers than with the scoreboard."` }
    ] }
  };

  function rollOutcome(c, id) {
    const def = OUT[id];
    const weights = def.outcomes.map((o) => Math.max(0, PP.val(o.w, c)));
    let r = Math.random() * weights.reduce((a, b) => a + b, 0), o = def.outcomes[0];
    for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) { o = def.outcomes[i]; break; } }
    let n = Array.isArray(o.n) ? o.n[0] + Math.floor(Math.random() * (o.n[1] - o.n[0] + 1)) : o.n;
    if (n && id === 'littleleague' && c.agent === 'connector') n++; // coaches know coaches
    const bias = Object.assign({}, def.bias);
    Object.entries(o.bias || {}).forEach(([k, v]) => (bias[k] = (bias[k] || 0) + v));
    const out = [];
    for (let i = 0; i < n; i++) {
      const temp = o.temp === 'mix' ? PP.pick(['warm', 'warm', 'cold']) : o.temp || 'warm';
      out.push(PP.career.addProspect(c, { temp, source: def.source, bias, event: !!def.event }));
    }
    return { text: o.text(list(out), n, c), prospects: out };
  }

  /* Simple activities resolve instantly. Returns { text, prospects: [...] }. */
  PP.content.runSimpleProspecting = function (c, id) {
    const out = [];
    const C = PP.career;
    const act = PP.content.prospecting.find((a) => a.id === id);
    if (act && act.requires && !act.requires(c)) {
      c.savings += act.cost || 0; // the UI charged up front; nothing happened, so give it back
      if (id === 'appreciation') return { text: 'You draft a lovely invitation, then realize you have nobody to send it to yet. Land a client or two first.', prospects: [] };
    }
    if (id === 'warm') {
      if (c.market <= 0) return { text: 'You scroll through your contacts. You have already called everyone who would pick up. Time for other ways to meet people.', prospects: [] };
      const n = c.agent === 'changer' ? 2 : PP.chance(0.6) ? 1 : 2;
      for (let i = 0; i < n && c.market > 0; i++) { c.market--; out.push(C.addProspect(c, { temp: 'warm', source: 'your natural market' })); }
      return { text: `You spend the day calling people you know. ${out.map((p) => p.name).join(' and ')} would love to talk. (${c.market} warm contacts left.)`, prospects: out };
    }
    if (id === 'seminar') {
      const comm = c.skills.communication || 0;
      const n = 1 + (PP.chance(0.5 + comm * 0.2) ? 1 : 0) + (comm >= 2 ? 1 : 0) + (c.workspace === 'office' ? 1 : 0);
      for (let i = 0; i < n; i++) out.push(C.addProspect(c, { temp: PP.chance(0.5) ? 'warm' : 'cold', source: 'your lunch & learn', bias: { numbers: 2, family: 1, owner: 1 } }));
      return { text: `Twenty sandwiches, eleven attendees, ${n} real conversation${n > 1 ? 's' : ''} afterwards: ${out.map((p) => p.name).join(', ')}.`, prospects: out };
    }
    if (id === 'referrals') {
      const happy = c.book.filter((b) => (b.status === 'life' || b.status === 'steady') && b.sat >= 7);
      if (!happy.length) return { text: 'You do not have any happy clients to ask yet. Service the ones you have, or land some good ones.', prospects: [] };
      happy.forEach((b) => {
        b.sat = Math.max(0, b.sat - 0.5);
        if (PP.chance(c.agent === 'connector' ? 0.7 : 0.5)) out.push(C.addProspect(c, { temp: 'hot', source: `referral from ${b.name}` }));
      });
      return { text: out.length ? `You ask ${happy.length} happy client${happy.length > 1 ? 's' : ''}. ${out.map((p) => p.name).join(' and ')} ${out.length > 1 ? 'are' : 'is'} keen to meet you.` : 'Everyone says they will think of someone. Nobody does, this time.', prospects: out };
    }
    if (OUT[id]) return rollOutcome(c, id);
    if (id === 'appreciation') {
      const clients = activeClients(c);
      const venue = PP.pick([
        'You book the back room of the bakery and buy far too many little tarts.',
        'You rent two lanes at the bowling alley. Nobody bowls well. Everybody has a wonderful time.',
        'You set up a picnic by the harbor and pray for no rain. It holds, mostly.',
        'You host a trivia night. Your clients form a team called "Asked Good Questions" and win.',
        'You organize a cheese tasting. Nobody understands the cheese. The conversation is excellent.',
        'You take over the patio at the taco place. Bernie shows up uninvited with a coffee urn. It works.'
      ]);
      clients.forEach((b) => {
        b.sat = Math.min(10, b.sat + 1);
        if (PP.chance(b.sat >= 7 ? 0.45 : 0.25)) out.push(C.addProspect(c, { temp: b.sat >= 8 ? 'hot' : 'warm', source: `a friend ${b.name} brought along` }));
      });
      const tail = out.length >= 2 ? `By the end of the night ${list(out)} have asked if they can come and see you properly.`
        : out.length ? `${out[0].name}, who came as somebody's plus-one, asks for your card on the way out.`
          : 'Everyone came alone this time, but they left feeling looked after, and that counts for a lot.';
      return { text: `${venue} ${clients.length} client${clients.length > 1 ? 's' : ''} come${clients.length > 1 ? '' : 's'} (satisfaction +1 each). ${tail}`, prospects: out };
    }
    return { text: '', prospects: out };
  };
})(window.PP);

</script>
<script>

 * Port Prospect. Each one is
 *   { id, text, when?: (career) => bool, choices: [{ label, eff?, result }] }
 * Career effects (eff) use only these keys, applied by PP.content.applyPortDay:
 *   savings     number, can be negative
 *   prospect    { temp, source, bias } (or an array of them): adds to the pipeline
 *   sat         number added to every active client's satisfaction (0-10)
 *   skill       { skillId: n } (skills cap at 2)
 *   energyNext  number: stored on career.energyNext, applied as Energy at the start of the next journey
 *   market      number: change to natural-market contacts (never below 0)
 *   day         true: this choice costs the day (the day passes)
 * Use PP.content.pickPortDay(career) to draw one that fits and has not been seen lately.
 */

  const nActive = (c) => active(c).length;

  PP.content.portDays = [
    /* ---- The coffee cart and the harbor ---- */

        { label: 'Give him your card and a wave', eff: { prospect: { temp: 'cold', source: 'a fisherman on the pier', bias: { retiree: 2 } } }, result: 'He tucks the card into his hat band. It will either be there in six months or in the harbor.' }
      ]
    },
    {
      id: 'dog',
      text: 'A golden retriever wanders in, sits on your foot, and refuses to move. The tag says "BISCUIT. If found, he is fine, he does this."',

        { label: 'Let him stay until someone comes', eff: { energyNext: 1 }, result: 'His owner arrives two hours later. You have never felt calmer. You are considering a dog.' }

    },
    {
      id: 'coat_pocket',
      text: 'You put on your winter coat for the first time this year and find forty dollars, a cough drop and a business card from your first week, with a note in your handwriting: "CALL BACK."',
      choices: [
        { label: 'Call them back, finally', eff: { savings: 40, prospect: { temp: 'cold', source: 'a card in your coat pocket' } }, result: 'They remember you. They are a little amused it took this long. They would still like to talk.' },

    },

      text: 'The church on the corner is having a bake sale. A small, very determined child is standing outside your door with a tray of lemon bars.',

    /* ---- People at the port ---- */
    {

      text: 'A reporter from the Harbor Gazette pokes her head in. "We\'re doing a piece on how families are coping with prices this year. Could I get a quote from a local agent?"',
      choices: [
        { label: 'Give a careful, plain-language quote', eff: { prospect: { temp: 'cold', source: 'your quote in the Harbor Gazette', bias: { family: 2, caregiver: 1 } } }, result: 'You say something true and kind about making a plan that fits real life. It runs on page six. Somebody cuts it out and calls you.' },
        { label: 'Say something punchy and quotable', eff: { prospect: { temp: 'cold', source: 'your quote in the Harbor Gazette' }, sat: -0.5 }, result: 'It runs as a headline. Your clients read it and wonder if you meant them. One new caller, a few raised eyebrows.' },

    },
    {

      text: 'There is someone waiting outside when you arrive, holding a folder. "Hi. Sorry. My neighbor said you were the person to talk to, and I\'ve been putting this off for a year, and if I go home I\'ll put it off for another one."',
      choices: [

      text: 'Your phone rings. "Is this the plumber? There is water coming out of a place where water should not come out."',

        { label: 'Help them find a plumber', eff: { prospect: { temp: 'cold', source: 'a wrong-number caller', bias: { owner: 1, family: 1 } } }, result: 'You find them a plumber in four minutes. They are so grateful they ask what you actually do. "Huh. I might need that too, once I\'m dry."' },
        { label: 'Politely explain it is the wrong number', result: 'They hang up mid-sentence. Somewhere, water continues to come out of a place it should not.' }

    },
    {

      when: (c) => c.market <= 3,
      text: 'An old colleague you have not spoken to in years emails out of nowhere: "Moved back to the area! Heard you went out on your own. Coffee?"',
      choices: [
        { label: 'Absolutely, coffee', eff: { market: 2 }, result: 'An hour turns into three. They know half the town already and start listing people you should call.' },

        { label: 'Say yes and bring piggy banks', eff: { day: true, prospect: { temp: 'warm', source: 'a parent at career day', bias: { family: 3 } } }, result: 'The firefighter brought the truck. You brought piggy banks. A surprising number of kids ask about compound interest. One parent asks for your card.' },

  /* Apply a port-day effect to the career. Returns notes [{ text, kind }] in the
   * same shape as PP.career.tickDay, ready for the port's flash panel.
   * eff.day ticks the day here (with the usual day notes) unless opts.noTick is
   * set, in which case it only reports it (use that if the caller ticks the day itself). */
  PP.content.applyPortDay = function (c, eff, opts) {
    const notes = [];
    if (!c || !eff) return notes;
    eff = PP.val(eff, c);
    const money = (n) => (PP.career ? PP.career.money(n) : '$' + n);
    if (eff.savings) {
      c.savings += eff.savings;
      notes.push({ text: `${eff.savings > 0 ? '+' : ''}${money(eff.savings)} savings.`, kind: eff.savings > 0 ? 'good' : 'bad' });
    }
    if (eff.prospect && PP.career) {
      [].concat(eff.prospect).forEach((pr) => {
        const p = PP.career.addProspect(c, Object.assign({ temp: 'warm', source: 'something that happened at the port' }, pr));
        notes.push({ text: `${p.name} (${p.temp}) joins your pipeline.`, kind: 'good' });
      });
    }
    if (eff.sat) {
      const list = active(c);
      list.forEach((b) => { b.sat = Math.round(PP.clamp((b.sat == null ? 7 : b.sat) + eff.sat, 0, 10) * 10) / 10; });
      if (list.length) notes.push({ text: `Client satisfaction ${eff.sat > 0 ? '+' : ''}${eff.sat} for everyone in your book.`, kind: eff.sat > 0 ? 'good' : 'bad' });
    }
    if (eff.skill) {
      c.skills = c.skills || {};
      Object.entries(eff.skill).forEach(([k, n]) => {
        const before = c.skills[k] || 0;
        c.skills[k] = PP.clamp(before + n, 0, 2);
        const sk = (PP.SKILLS || []).find((x) => x.id === k);
        const label = sk ? sk.label : k;
        if (c.skills[k] !== before) notes.push({ text: `${n > 0 ? '+' : ''}${c.skills[k] - before} ${label}.`, kind: n > 0 ? 'good' : 'bad' });
        else if (n > 0) notes.push({ text: `${label} is already as good as it gets.`, kind: 'info' });
      });
    }
    if (eff.energyNext) {
      c.energyNext = (c.energyNext || 0) + eff.energyNext;
      notes.push({ text: `${eff.energyNext > 0 ? '+' : ''}${eff.energyNext} Energy at the start of your next journey.`, kind: eff.energyNext > 0 ? 'good' : 'bad' });
    }
    if (eff.market) {
      const before = c.market || 0;
      c.market = Math.max(0, before + eff.market);
      const d = c.market - before;
      if (d) notes.push({ text: `${d > 0 ? '+' : ''}${d} warm contact${Math.abs(d) === 1 ? '' : 's'} in your natural market.`, kind: d > 0 ? 'good' : 'bad' });
    }
    if (eff.day) {
      if (opts && opts.noTick) notes.push({ text: 'That took the whole day.', kind: 'info' });
      else {
        notes.push({ text: 'That took the whole day.', kind: 'info' });
        if (PP.career) { const dayNotes = PP.career.tickDay(c, false); c.inbox = []; notes.push(...dayNotes); }
      }
    }
    return notes;
  };

  /* Draw one happening that fits this career, avoiding the last dozen seen.
   * Records the pick in career.portDaysSeen. Returns null if nothing fits. */
  PP.content.pickPortDay = function (c) {
    const seen = (c.portDaysSeen = c.portDaysSeen || []);
    const fits = PP.content.portDays.filter((d) => { try { return !d.when || d.when(c); } catch (e) { return false; } });
    let pool = fits.filter((d) => !seen.includes(d.id));
    if (!pool.length) pool = fits;
    if (!pool.length) return null;
    const d = PP.pick(pool);
    seen.push(d.id);
    while (seen.length > 12) seen.shift();
    return d;
  };
})(window.PP);

</script>

<script>
/* Shared pieces for mini-games.
 * Every mini-game exposes the same contract, so the journey, the port quests
 * and the Element Lab can all run them:
 *
 *   PP.minigames.x = { title, risk, blurb, start(root, ctx, done) -> { stop() } }
 *   ctx  = { state, client, prep (Preparation level), practice (bool: full feedback) }
 *   done({ score, max, passed, eff, lines })   eff is applied by the caller via PP.apply
 */
(function (PP) {
  const h = PP.h;
  PP.mg = {};

  /* Countdown with a draining bar. Returns controls. */
  PP.mg.timer = function (bar, seconds, onEnd) {
    let left = seconds * 1000, last = performance.now(), raf = 0, paused = false, dead = false;
    const total = seconds * 1000;
    function tick(now) {
      if (dead) return;
      if (!paused) left -= now - last;
      last = now;
      const pct = Math.max(0, left / total);
      bar.style.transform = `scaleX(${pct})`;
      bar.classList.toggle('low', pct < 0.25);
      if (left <= 0) { dead = true; onEnd(); return; }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return {
      add(sec) { left = Math.min(total, left + sec * 1000); },
      sub(sec) { left -= sec * 1000; },
      left() { return Math.max(0, left / 1000); },
      pause(p) { paused = p; },
      stop() { dead = true; cancelAnimationFrame(raf); }
    };
  };

  PP.mg.shell = function (root, title, risk) {
    root.innerHTML = '';
    const bar = h('div', { class: 'mg-timer-fill' });
    const status = h('div', { class: 'mg-status' });
    const body = h('div', { class: 'mg-body' });
    const feedback = h('div', { class: 'mg-feedback', 'aria-live': 'polite' });
    const hud = h('div', { class: 'mg-hud' });
    const wrap = h('div', { class: 'mg' },
      h('div', { class: 'mg-head' },
        h('div', null, h('div', { class: 'eyebrow' }, 'Mini-game · ' + risk), h('h3', { class: 'mg-title' }, title)),
        h('div', { class: 'mg-head-right' }, status, PP.fx ? PP.fx.soundToggle() : null)),
      h('div', { class: 'mg-timer' }, bar),
      hud, body, feedback);
    root.appendChild(wrap);
    return { wrap, bar, status, body, feedback, hud };
  };

  /* End screen: score, line-by-line review, effect chips, continue. */
  PP.mg.summary = function (root, title, result, done) {
    root.innerHTML = '';
    const chips = PP.ui.effectChips ? PP.ui.effectChips(result.eff, { hideDebt: !result.showDebt }) : null;
    root.appendChild(h('div', { class: 'mg mg-summary' },
      h('div', { class: 'eyebrow' }, 'Mini-game complete'),
      h('h3', { class: 'mg-title' }, title),
      h('p', { class: 'mg-score' }, h('strong', null, String(result.score)), ` / ${result.max}`, result.passed != null ? h('span', { class: 'pill ' + (result.passed ? 'good' : 'bad') }, result.passed ? 'Passed' : 'Not yet') : null),
      result.headline ? h('p', { class: 'mg-headline' }, result.headline) : null,
      h('ul', { class: 'mg-review' }, result.lines.map((l) => h('li', { class: 'q-' + (l.q || 'ok') }, h('span', { class: 'q-mark', 'aria-hidden': 'true' }, l.q === 'good' ? '+' : l.q === 'bad' ? '!' : '~'), h('span', null, l.text)))),
      chips ? h('div', { class: 'mg-effects' }, h('span', { class: 'eyebrow' }, 'Effect on the journey'), chips) : null,
      h('button', { class: 'btn primary', onclick: () => done(result), autofocus: true }, 'Continue')));
  };

  PP.mg.fill = (str, client) => {
    const name = client ? client.name : 'the client';
    return str.replace(/\{c\}/g, name).replace(/\{lc\}/g, name.toLowerCase().replace(/[^a-z]/g, '')).replace(/\{s\}/g, (client && client.shortStake) || 'their partner');
  };
})(window.PP);

</script>
<script>
/* Game feel for mini-games: instant visual and audio feedback.
 *   PP.fx.pop(box, x, y, text, kind)       floating "+1" style text
 *   PP.fx.popOn(box, el, text, kind)       same, centered on an element
 *   PP.fx.burst(box, x, y, kind, n)        sparkle particles
 *   PP.fx.shake(el) / PP.fx.glow(el, kind) element reactions
 *   PP.fx.stamp(box, text, kind)           big stamp across the play area
 *   PP.fx.fly(el, target, box, done)       a copy of el flies into target
 *   PP.fx.meter(label, kind)               live meter {el, set(v, max)}
 *   PP.fx.counter(label)                   live number {el, set(n)} with a bump
 *   PP.fx.sfx(name)                        tiny synthesized sounds (mutable)
 * And simple character art:
 *   PP.art.face({ mood, hue, hair, surprised })   SVG string, mood -2..2
 *   PP.art.figure(kind, opts)                    SVG string, a full person with props
 */
(function (PP) {
  const h = PP.h;
  const fx = (PP.fx = { sound: PP.store.get('sound', true) });

  function rel(box, el) {
    const b = box.getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: r.left - b.left + r.width / 2, y: r.top - b.top + r.height / 2, w: r.width, h: r.height };
  }
  fx.rel = rel;

  fx.pop = (box, x, y, text, kind) => {
    const el = h('div', { class: 'fx-pop k-' + (kind || 'good'), style: { left: x + 'px', top: y + 'px' } }, text);
    box.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  };
  fx.popOn = (box, target, text, kind) => { const p = rel(box, target); fx.pop(box, p.x, p.y - p.h / 3, text, kind); };

  fx.burst = (box, x, y, kind, n = 12) => {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.4, d = 30 + Math.random() * 40;
      const el = h('i', { class: 'fx-spark k-' + (kind || 'good'), style: { left: x + 'px', top: y + 'px', '--dx': Math.cos(a) * d + 'px', '--dy': Math.sin(a) * d + 'px' } });
      box.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }
  };
  fx.burstOn = (box, target, kind, n) => { const p = rel(box, target); fx.burst(box, p.x, p.y, kind, n); };

  const retrigger = (el, cls, ms) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };
  fx.shake = (el) => retrigger(el, 'fx-shake', 450);
  fx.glow = (el, kind) => retrigger(el, 'fx-glow-' + (kind || 'good'), 600);
  fx.bump = (el) => retrigger(el, 'fx-bump', 350);

  fx.stamp = (box, text, kind) => {
    const el = h('div', { class: 'fx-stamp k-' + (kind || 'good') }, text);
    box.appendChild(el);
    setTimeout(() => el.remove(), 900);
  };

  fx.fly = (el, target, box, done) => {
    const a = rel(box, el), b = rel(box, target);
    const ghost = el.cloneNode(true);
    ghost.classList.add('fx-ghost');
    Object.assign(ghost.style, { left: a.x - a.w / 2 + 'px', top: a.y - a.h / 2 + 'px', width: a.w + 'px', height: a.h + 'px' });
    box.appendChild(ghost);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      ghost.style.transform = `translate(${b.x - a.x}px, ${b.y - a.y}px) scale(0.25) rotate(${Math.random() * 30 - 15}deg)`;
      ghost.style.opacity = '0.2';
    }));
    setTimeout(() => { ghost.remove(); done && done(); }, 480);
  };

  fx.meter = (label, kind) => {
    const fill = h('div', { class: 'fx-meter-fill k-' + (kind || 'good') });
    const num = h('span', { class: 'fx-meter-num' });
    const el = h('div', { class: 'fx-meter' }, h('span', { class: 'fx-meter-label' }, label), h('div', { class: 'fx-meter-track' }, fill), num);
    let last = null;
    return {
      el,
      set(v, max = 10, text) {
        fill.style.width = Math.max(0, Math.min(1, v / max)) * 100 + '%';
        num.textContent = text != null ? text : Math.round(v) + '/' + max;
        if (last != null && v !== last) fx.bump(num);
        last = v;
      }
    };
  };
  fx.counter = (label) => {
    const num = h('strong', null, '0');
    const el = h('div', { class: 'fx-counter' }, h('span', null, label), num);
    let last = 0;
    return { el, set(n) { num.textContent = String(n); if (n !== last) fx.bump(num); last = n; } };
  };

  /* Sounds: tiny oscillator sequences. [freq, start, duration, type, volume] */
  const SFX = {
    click: [[520, 0, 0.04, 'square', 0.03]],
    good: [[660, 0, 0.09, 'triangle', 0.12], [990, 0.08, 0.14, 'triangle', 0.12]],
    great: [[660, 0, 0.08, 'triangle', 0.12], [880, 0.07, 0.08, 'triangle', 0.12], [1320, 0.14, 0.18, 'triangle', 0.12]],
    bad: [[200, 0, 0.12, 'sawtooth', 0.07], [150, 0.1, 0.18, 'sawtooth', 0.07]],
    meh: [[440, 0, 0.1, 'sine', 0.08], [392, 0.09, 0.12, 'sine', 0.08]],
    coin: [[988, 0, 0.06, 'square', 0.05], [1319, 0.06, 0.2, 'square', 0.05]],
    ring: [[1200, 0, 0.06, 'sine', 0.05], [950, 0.07, 0.06, 'sine', 0.05], [1200, 0.14, 0.06, 'sine', 0.05], [950, 0.21, 0.06, 'sine', 0.05]],
    ding: [[1568, 0, 0.25, 'sine', 0.07]],
    thump: [[110, 0, 0.12, 'sine', 0.25]],
    whoosh: [[300, 0, 0.15, 'triangle', 0.05], [600, 0.04, 0.12, 'triangle', 0.04]]
  };
  /* ---------- Sound engine ----------
   * Effects and music must share ONE mixer: on iPhone, starting a second <audio>
   * element can pause the first, which is why taps silenced the music.
   * So the primary engine is Web Audio, started inside the first real tap (the only
   * moment iOS allows it). If the browser refuses, effects fall back to <audio> elements.
   * Every sound is synthesized here, nothing is downloaded. */
  const RATE = 22050, GAIN = 2.2;
  function synth(seq) {
    const len = Math.ceil((Math.max(...seq.map(([, st, d]) => st + d)) + 0.04) * RATE);
    const buf = new Float32Array(len);
    seq.forEach(([f, st, d, type, vol]) => {

  const tick = (o, t, v, r) => noiseBurst(o, t, 0.012, v, true, r);
  const typing = (o, t, n, v, r) => { for (let k = 0; k < n; k++) tick(o, t + k * (0.07 + r() * 0.08), v, r); };
  const step = (o, t, v) => tone(o, t, 0.07, (u) => 90 - 40 * u, v, 'sine', 0.002, 1.5);
  const cricket = (o, t, v) => { for (let k = 0; k < 3; k++) tone(o, t + k * 0.05, 0.03, 4400, v, 'sine', 0.002, 1); };
  const frog = (o, t, v, r) => { const f = 130 + r() * 70; for (let k = 0; k < 3; k++) tone(o, t + k * 0.07, 0.05, f, v, 'square', 0.004, 1); };
  const drip = (o, t, v, r) => tone(o, t, 0.18, (u) => (900 + r() * 500) * (1 + u * 0.6), v, 'sine', 0.001, 1.6);
  const bubble = (o, t, v, r) => tone(o, t, 0.05, (u) => (500 + r() * 700) * (1 + u), v, 'sine', 0.002, 1.2);
  const ring = (o, t, v) => { for (let k = 0; k < 6; k++) tone(o, t + k * 0.06, 0.05, k % 2 ? 950 : 1200, v, 'sine', 0.003, 1); };
  /* Distant voices: little pitch contours like speech, too far away to make out. */
  const voices = (o, v, r, density = 1) => { for (let t = 0; t < 15; t += (0.25 + r() * 0.5) / density) { const f = 150 + r() * 140; tone(o, t, 0.18 + r() * 0.25, (u) => f * (1 + 0.25 * Math.sin(u * 6 + r())), v, 'tri', 0.04, 1.2); } };
  /* A little tune: notes = MIDI numbers, step = seconds per note. */
  const tune = (o, t0, notes, stepS, v, type, len = 0.9) => notes.forEach((n, i) => n && tone(o, t0 + i * stepS, stepS * len, note(n), v, type, 0.01, 1.6));
  const AMB = {
    docks(o, r) { noiseBed(o, 0.5, 0.02, 1 / 6, 0.75, r, true); for (let t = 1; t < 15; t += 3 + r() * 3) gull(o, t, 0.05); bell(o, 0.4, 392, 0.12, 2.8); bell(o, 8.4, 392, 0.1, 2.8); },
    trailhead(o, r) { for (let t = 0.3; t < 15; t += 0.7 + r() * 1.6) chirp(o, t, 0.04, r); for (let t = 0; t < 15; t += 0.55) step(o, t, 0.07); for (let t = 0.2; t < 15; t += 0.9 + r() * 0.6) cricket(o, t, 0.012); },
    square(o, r) { voices(o, 0.025, r, 1.4); for (let t = 0.5; t < 15; t += 1.4 + r() * 2.5) clink(o, t, 0.05); // a busker on the corner
      tune(o, 0.5, [67, 71, 74, 72, 71, 69, 67, 0, 69, 71, 72, 74, 72, 71, 69, 0, 67, 71, 74, 76, 74, 72, 71, 69, 67], 0.45, 0.05, 'tri'); },
    chamber(o, r) { voices(o, 0.02, r, 1.8); for (let t = 0.3; t < 15; t += 0.8 + r() * 1.8) clink(o, t, 0.06); // a piano in the corner
      [[60, 64, 67, 71], [57, 60, 64, 67], [62, 65, 69, 72], [55, 59, 62, 65]].forEach((ch, i) => ch.forEach((n, k) => tone(o, i * 3.75 + k * 0.12, 3.4, note(n), 0.035, 'sine', 0.01, 0.8))); },
    office(o, r) { for (let t = 0.2; t < 15; t += 1.2 + r() * 2.2) typing(o, t, 4 + Math.floor(r() * 9), 0.14, r); for (let t = 0; t < 15; t += 1) tick(o, t, 0.05, r); ring(o, 9, 0.03); tone(o, 4, 0.08, 1320, 0.03, 'sine', 0.002, 1); tone(o, 4.1, 0.08, 1760, 0.03, 'sine', 0.002, 1); },
    street(o, r) { for (let t = 0; t < 15; t += 0.42 + r() * 0.1) step(o, t, 0.06); voices(o, 0.015, r, 0.6); sweep(o, 5.5, 0.4, 440, 435, 0.04, 'square'); bell(o, 11, 2200, 0.05, 0.6); bell(o, 11.15, 2200, 0.05, 0.6); },
    homes(o, r) { for (let t = 0.3; t < 15; t += 0.6 + r() * 1.4) chirp(o, t, 0.04, r); [72, 76, 79, 84].forEach((n, i) => bell(o, 3 + i * 0.35 + r() * 0.2, note(n), 0.05, 2.5)); [79, 84, 76].forEach((n, i) => bell(o, 10 + i * 0.4, note(n), 0.04, 2.5)); sweep(o, 7.2, 0.15, 500, 380, 0.05, 'saw'); sweep(o, 7.45, 0.15, 520, 400, 0.05, 'saw'); },
    school(o, r) { bell(o, 0.3, 988, 0.07, 1.5); bell(o, 0.65, 988, 0.06, 1.5); voices(o, 0.012, r, 0.8); for (let t = 3; t < 15; t += 0.25 + r() * 0.2) if (r() < 0.5) tick(o, t, 0.06, r); // chalk, and a piano lesson down the hall
      tune(o, 5, [60, 62, 64, 65, 67, 69, 71, 72, 71, 69, 67, 65, 64, 62, 60], 0.3, 0.035, 'sine'); },
    library(o, r) { for (let t = 0; t < 15; t += 1) tick(o, t, 0.04, r); for (let t = 2.5; t < 15; t += 4 + r() * 3) noiseBurst(o, t, 0.25, 0.012, true, r, 0.25); noiseBurst(o, 8, 0.6, 0.008, true, r, 0.9); tone(o, 12, 0.25, 140, 0.02, 'sine', 0.05, 1); },
    field(o, r) { noiseBurst(o, 1.5, 0.03, 0.2, true, r); voices(o, 0.02, r, 1.5); tune(o, 3, [60, 64, 67, 72, 0, 67, 72], 0.22, 0.06, 'square', 0.8); bell(o, 9, 3000, 0.04, 0.3); },
    meadows(o, r) { for (let t = 0.3; t < 15; t += 0.5 + r() * 1.3) chirp(o, t, 0.04, r); for (let t = 0.1; t < 15; t += 0.7 + r() * 0.5) cricket(o, t, 0.012); },
    sea(o, r) { noiseBed(o, 0.5, 0.02, 1 / 5, 0.8, r, true); for (let t = 2; t < 15; t += 4 + r() * 4) gull(o, t, 0.04); },
    fog(o, r) { sweep(o, 1, 3.2, 98, 96, 0.22, 'saw'); sweep(o, 1, 3.2, 147, 145, 0.12, 'saw'); sweep(o, 9, 2.5, 98, 96, 0.16, 'saw'); for (let t = 4.5; t < 15; t += 1.1 + r()) drip(o, t, 0.04, r); },
    swamp(o, r) { for (let t = 0.2; t < 15; t += 0.5 + r() * 1.1) frog(o, t, 0.1, r); for (let t = 0.1; t < 15; t += 0.4 + r() * 0.4) cricket(o, t, 0.015); },
    summit(o, r) { for (let t = 0; t < 15; t += 3.75) sweep(o, t, 3.6, 300 + r() * 80, 520 + r() * 100, 0.03, 'sine', 0.01); sweep(o, 6, 0.9, 1500, 1100, 0.05, 'tri', 0.03); },
    caves(o, r) { for (let t = 0.5; t < 15; t += 0.9 + r() * 1.8) drip(o, t, 0.08, r); tone(o, 0, 15, 55, 0.03, 'sine', 2, 0.1); echo(o, 0.23, 0.35); },
    sands(o, r) { // the incentive fair: a game-show jingle, a cash register, a crowd
      voices(o, 0.015, r, 1.2); tune(o, 0.4, [72, 76, 79, 84, 0, 79, 84], 0.16, 0.06, 'square', 0.8); for (const t of [4, 9.5, 13]) { bell(o, t, 2093, 0.05, 0.4); bell(o, t + 0.08, 2637, 0.05, 0.5); } tune(o, 7, [67, 0, 67, 72], 0.18, 0.05, 'square', 0.8); },
    isles(o, r) { noiseBed(o, 0.2, 0.02, 1 / 5, 0.8, r, true); for (let t = 1; t < 15; t += 2.5 + r() * 2) { tone(o, t, 0.08, 1760, 0.05, 'square', 0.002, 1); tone(o, t + 0.12, 0.08, 1320, 0.05, 'square', 0.002, 1); } },
    snakepit(o, r) { for (let t = 0.5; t < 15; t += 1.4 + r() * 2) ring(o, t, 0.05); tone(o, 6, 0.4, 425, 0.03, 'sine', 0.01, 0.5); },
    loop(o, r) { for (let t = 0.2; t < 15; t += 1 + r() * 1.5) typing(o, t, 5 + Math.floor(r() * 8), 0.14, r); for (const t of [4, 9, 13]) { tone(o, t, 0.15, 220, 0.05, 'square', 0.002, 1); tone(o, t + 0.17, 0.2, 196, 0.05, 'square', 0.002, 1); } },
    toll(o, r) { for (let t = 0; t < 15; t += 0.12 + r() * 0.2) bubble(o, t, 0.02, r); for (const t of [2, 7, 12]) sweep(o, t, 0.6, 180, 120, 0.04, 'saw'); },
    clients(o, r) { [72, 76, 79, 84, 88].forEach((n, i) => { bell(o, 0.5 + i * 0.4, note(n), 0.06, 3); bell(o, 7.5 + i * 0.4, note(n - 5), 0.05, 3); }); for (let t = 0.3; t < 15; t += 0.8 + r() * 1.5) chirp(o, t, 0.03, r); }
  };
  const AMB_ALIAS = { port: 'docks', lighthouse: 'sea', wreck: 'sea', meadow: 'meadows', cliffs: 'summit' };

  /* ---------- music ---------- */
  const MOODS = {
    title: { bpm: 88, root: 60, scale: [0, 2, 4, 7, 9], prog: [0, 5, 3, 4], lead: 'tri', drums: 0, bars: 8, vol: 0.9 },
    calm: { bpm: 96, root: 62, scale: [0, 2, 4, 7, 9], prog: [0, 4, 5, 3], lead: 'tri', drums: 1, bars: 8, vol: 1 },
    bright: { bpm: 112, root: 67, scale: [0, 2, 4, 7, 9], prog: [0, 3, 4, 0], lead: 'square', drums: 2, bars: 8, vol: 0.85 },
    tense: { bpm: 84, root: 57, scale: [0, 2, 3, 7, 8], prog: [0, 5, 3, 4], minor: true, lead: 'tri', drums: 3, bars: 8, vol: 1 },
    urgent: { bpm: 136, root: 62, scale: [0, 3, 5, 7, 10], prog: [0, 0, 5, 6], minor: true, lead: 'square', drums: 4, bars: 8, vol: 0.85 },
    night: { bpm: 70, root: 57, scale: [0, 2, 4, 7, 9], prog: [0, 5, 3, 4], lead: 'sine', drums: 0, bars: 8, vol: 0.9 },
    triumph: { bpm: 120, root: 65, scale: [0, 2, 4, 7, 9], prog: [0, 3, 4, 0], lead: 'square', drums: 2, bars: 4, vol: 0.9, fanfare: true }
  };
  // Chord roots as scale-ish semitone offsets for degrees I..VII (major) or i..VII (minor)
  const DEG = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10] };
  function renderMusic(m, seed) {
    const r = rnd(seed);
    const beat = 60 / m.bpm, bar = beat * 4, len = bar * m.bars;
    const o = buf(len);
    const degs = m.minor ? DEG.minor : DEG.major;
    const triad = (d) => [0, 2, 4].map((k) => { const i = d + k; return degs[i % 7] + 12 * Math.floor(i / 7); });
    let pos = 2; // melody position on the scale
    for (let b = 0; b < m.bars; b++) {
      const d = m.prog[b % m.prog.length], t0 = b * bar, chord = triad(d);
      // pad: soft chord, slow attack
      chord.forEach((c) => tone(o, t0, bar * 1.02, note(m.root - 12 + c), 0.05 * m.vol, 'sine', 0.35, 0.25));
      // bass
      for (let k = 0; k < 4; k++) {
        if (m.drums >= 4 || k % 2 === 0 || m.drums >= 2) tone(o, t0 + k * beat, beat * 0.9, note(m.root - 24 + chord[0] + (k === 3 && m.drums >= 2 ? 7 : 0)), 0.16 * m.vol, m.drums >= 4 ? 'saw' : 'sine', 0.01, 2);
      }
      // melody: a random walk on the scale, landing on chord tones on the beat
      const steps = m.drums >= 4 ? 8 : m.bpm < 80 ? 2 : 4;
      for (let k = 0; k < steps; k++) {
        if (r() < (m.drums === 0 ? 0.35 : 0.2)) continue; // rests keep it breathing
        pos = Math.max(0, Math.min(9, pos + Math.round((r() - 0.5) * 3)));
        let semi = m.scale[pos % m.scale.length] + 12 * Math.floor(pos / m.scale.length);
        if (k % (steps / 2) === 0) { const ct = chord.map((c) => c % 12); if (!ct.includes(semi % 12)) semi = ct[Math.floor(r() * ct.length)] + 12 * Math.floor(pos / m.scale.length); }
        const dur = (bar / steps) * (r() < 0.3 ? 1.8 : 0.9);
        tone(o, t0 + k * (bar / steps), dur, note(m.root + 12 + semi), 0.09 * m.vol, m.lead, 0.008, 2.2);
      }
      // drums
      for (let k = 0; k < 8 && m.drums; k++) {
        const t = t0 + k * (beat / 2);
        if (k % 4 === 0 || (m.drums >= 4 && k % 2 === 0)) tone(o, t, 0.18, (u) => 120 - 70 * u, (m.drums === 3 ? 0.35 : 0.3) * m.vol, 'sine', 0.002, 1.5);
        if (m.drums >= 2 && k % 4 === 2) noiseBurst(o, t, 0.12, 0.12 * m.vol, true, r, 0.5);
        if (m.drums !== 3) noiseBurst(o, t, 0.035, (k % 2 ? 0.05 : 0.03) * m.vol, true, r);
        if (m.drums === 3 && k % 4 === 1) tone(o, t, 0.15, (u) => 100 - 50 * u, 0.22 * m.vol, 'sine', 0.002, 1.5); // heartbeat
      }
    }
    if (m.fanfare) [0, 4, 7, 12].forEach((s, i) => tone(o, i * beat * 0.5, beat * (i === 3 ? 3 : 0.5), note(m.root + 12 + s), 0.14 * m.vol, 'square', 0.005, 1.4));
    return o;
  }

  function render(key) {
    if (cache[key]) return cache[key];
    const [kind, name] = key.split(':');
    let o;
    if (kind === 'music') o = renderMusic(MOODS[name] || MOODS.calm, name.length * 97 + 13);
    else { o = buf(15); const fn = AMB[AMB_ALIAS[name] || name] || AMB.meadows; fn(o, rnd(name.length * 131 + 7)); }
    // Even out loudness: music sits a little above ambience, both well under the effects.
    let sum = 0; for (let i = 0; i < o.length; i++) sum += o[i] * o[i];
    let peak = 0; for (let i = 0; i < o.length; i++) peak = Math.max(peak, Math.abs(o[i]));
    const rms = Math.sqrt(sum / o.length) || 1;
    const k = Math.min(kind === 'music' ? 25 : 6, (kind === 'music' ? 0.1 : 0.05) / rms, 0.8 / (peak || 1));
    for (let i = 0; i < o.length; i++) o[i] *= k;
    return (cache[key] = o);
  }
  const urls = {};
  const urlFor = (key) => urls[key] || (urls[key] = toWav(render(key)));

  /* ---------- players ----------
   * Web Audio path (preferred): a looping buffer source into the shared master, so
   * music, ambience and effects all mix. Fallback: two reusable <audio> elements. */
  const FX = () => PP.fx || {};
  let webSrc = null, webKey = null;
  const webBufs = {};
  function stopWeb() { if (webSrc) { try { webSrc.stop(); } catch (e) { /* already stopped */ } webSrc.disconnect(); webSrc = null; webKey = null; } }
  function playWeb(key) {
    if (webKey === key && webSrc) return;
    stopWeb();
    const f = FX();
    const src = f.ac.createBufferSource();
    src.buffer = webBufs[key] || (webBufs[key] = f.toBuffer(render(key)));
    src.loop = true;
    const g = f.ac.createGain(); g.gain.setValueAtTime(0.0001, f.ac.currentTime); g.gain.exponentialRampToValueAtTime(1, f.ac.currentTime + 0.6);
    src.connect(g).connect(f.master); src.start();
    webSrc = src; webKey = key;
  }

  const players = [new Audio(), new Audio()];
  players.forEach((p) => { p.loop = true; p.preload = 'auto'; p.setAttribute('playsinline', ''); });
  let cur = 0;
  function stopHtml() { players.forEach((p) => { p._live = false; p.pause(); }); }
  function playHtml(key) {
    const same = players.find((x) => x._key === key);
    const p = same || players[(cur = 1 - cur)];
    players.forEach((x) => { if (x !== p) { x._live = false; x.pause(); } });
    if (!same) { p.src = urlFor(key); p._key = key; }
    p._live = true;
    const pr = p.play();
    if (pr && pr.catch) pr.catch((e) => { if (e && e.name === 'AbortError') return; A.err = String(e && e.name || e); p._live = false; });
  }

  function apply(key) {
    const want = key && A.music && !A.held;
    const f = FX();
    if (!want) { stopWeb(); stopHtml(); return; }
    if (!f.audio || !f.audio.unlocked) return; // nothing can play before the first tap
    try {
      if (f.web && f.web()) { stopHtml(); playWeb(key); A.engine = 'web'; }
      else { stopWeb(); playHtml(key); A.engine = 'html'; }
    } catch (e) { A.err = String(e && e.message || e); }
  }
  // The first tap starts the engine; whenever the engine state changes, (re)start the right loop.
  document.addEventListener('pp-audio', () => apply(A.key));
  let warmed = false;
  document.addEventListener('pp-audio', () => {
    if (warmed) return; warmed = true;
    ['music:calm', 'town:docks', 'town:office', 'town:square', 'music:tense', 'music:bright'].forEach((k, i) => setTimeout(() => render(k), 1500 + i * 900));
  });
  // On every tap: if music should be playing but isn't (iOS can stop it), start it right there.
  ['touchend', 'click'].forEach((t) => document.addEventListener(t, () => {
    const f = FX();
    if (!A.key || !A.music || A.held) return;
    if (f.web && f.web()) { if (!webSrc) apply(A.key); }
    else if (!players.some((p) => p._live && !p.paused)) apply(A.key);
  }));

  A.bed = (key) => { if (key === A.key) return; A.key = key; apply(key); };
  A.hold = (on) => { A.held = on; apply(A.key); };
  A.toggle = () => {
    A.music = !A.music; PP.store.set('music', A.music);
    document.querySelectorAll('.fx-music').forEach((x) => { x.setAttribute('aria-pressed', String(A.music)); x.textContent = A.music ? 'Music on' : 'Music off'; });
    apply(A.key);
  };
  A.button = () => PP.h('button', { class: 'fx-sound fx-music', 'aria-pressed': String(A.music), title: 'Music and ambience', onclick: A.toggle }, A.music ? 'Music on' : 'Music off');
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stopWeb(); stopHtml(); } else apply(A.key); });

  /* Mood of the trail right now, from the journey state. */
  A.trailMood = (s) => {
    if (!s) return 'calm';
    if (s.pace === 'breakneck') return 'urgent';
    const debt = (s.debt || []).length;
    if (s.res.energy <= 3 || s.res.trust <= 3 || debt >= 3) return 'tense';
    if (s.res.trust >= 7 && s.res.momentum >= 6) return 'bright';
    return 'calm';
  };
  A.render = render; // for testing
  A.status = () => { const f = PP.fx || {}; const p = players.find((x) => x._live); const playing = f.web && f.web() ? !!webSrc : !!(p && !p.paused); return `Music ${A.music ? 'on' : 'off'} · ${A.key || 'nothing queued'} · ${playing ? 'playing' : 'not playing'} · engine ${f.web && f.web() ? 'web audio' : 'audio elements'}${f.ac ? ' (' + f.ac.state + ')' : ''}` + (A.err ? ` · ${A.err}` : ''); };
})(window.PP);

</script>
<script>
/* The Conversation — the risk: hearing facts without noticing what matters.
 * Statements arrive one at a time. Choose: Ask a follow-up, Challenge, Explain, or Keep listening.
 * A tempting "Pitch" button shows up at the worst moments. Doing nothing counts as listening.
 */
(function (PP) {
  const h = PP.h;

  const ACTIONS = [
    { id: 'ask', label: 'Ask a follow-up', key: '1' },
    { id: 'challenge', label: 'Challenge', key: '2' },
    { id: 'explain', label: 'Explain', key: '3' },
    { id: 'listen', label: 'Keep listening', key: '4' }
  ];

  const WHY = {
    emotion: { listen: 'They needed to be heard, and you let them.', ask: 'Fine, but they mostly needed space.', explain: 'You answered a feeling with information.', challenge: 'You argued with a feeling.' },
    question: { explain: 'They asked; you answered clearly.', ask: 'Clarifying is fine.', listen: 'They asked a question and got silence.', challenge: 'They asked a question and got pushback.' },
    misconception: { challenge: 'You gently corrected something important.', explain: 'You explained without making it a fight.', ask: 'Understanding first is good.', listen: 'A misconception went unchallenged.' },
    tangent: { listen: 'Rapport, at the cost of time.', explain: 'You steered back to the point.', ask: 'Down the rabbit hole you go.', challenge: 'Abrupt.' },
    fact: { ask: 'You followed the thread.', listen: 'You let them keep talking.', explain: 'You talked over something important.', challenge: 'You challenged them right as they opened up.' }
  };

  function judge(st, action, ctx, localTrust) {
    const cur = PP.skill(ctx.state, 'curiosity');
    const comm = PP.skill(ctx.state, 'communication');
    const out = { q: 'ok', d: {}, reveal: false, debt: null };
    switch (st.tag) {
      case 'emotion':
        if (action === 'listen') { out.q = 'good'; out.d.trust = 1; }
        else if (action === 'ask') out.q = 'ok';
        else { out.q = 'bad'; out.d.trust = action === 'challenge' ? -2 : -1; }
        break;
      case 'question':
        if (action === 'explain') { out.q = 'good'; out.d.trust = 1; out.d.insight = 0.5; }
        else if (action === 'ask') out.q = 'ok';
        else { out.q = 'bad'; out.d.trust = -1; }
        break;
      case 'misconception':
        if (action === 'challenge') { out.q = comm ? 'good' : 'ok'; out.d.insight = 1; out.d.trust = comm ? 0 : -0.5; }
        else if (action === 'explain') { out.q = 'good'; out.d.insight = 1; }
        else if (action === 'ask') { out.q = cur ? 'good' : 'ok'; out.d.insight = cur ? 1 : 0.5; out.d.trust = cur ? 0.5 : 0; }
        else { out.q = 'bad'; out.debt = { tag: 'unchallenged_assumption', sev: 1 }; }
        break;
      case 'tangent':
        if (action === 'listen') { out.q = 'ok'; out.d.momentum = -0.5; out.d.trust = 0.5; }
        else if (action === 'explain') { out.q = 'good'; out.d.momentum = 0.5; }
        else if (action === 'ask') { out.q = 'bad'; out.d.momentum = -1; out.d.trust = 0.5; }
        else { out.q = 'bad'; out.d.trust = -1; }
        break;
      case 'fact':
        if (action === 'ask') {
          if (!st.subtle || cur > 0 || PP.chance(0.5)) { out.q = 'good'; out.reveal = true; out.d.insight = 1; }
          else { out.q = 'ok'; out.note = 'Your follow-up was a bit generic. They shrug it off.'; }
        } else if (action === 'listen') {
          if (!st.subtle || localTrust >= 7) { out.q = 'good'; out.reveal = true; out.d.insight = 1; }
          else { out.q = 'ok'; out.note = 'They move on before saying more.'; }
        } else { out.q = 'bad'; out.d.trust = action === 'challenge' ? -1 : 0; }
        break;
    }
    return out;
  }

  const REACT = {
    good: ['{c} relaxes a little.', '{c} brightens.', '{c} leans in.', '"Exactly," says {c}.'],
    ok: ['{c} nods.', '{c} carries on.', '"Mm-hm," says {c}.'],
    bad: ["{c}'s smile tightens.", '{c} goes a bit quiet.', '{c} glances at the clock.', '"...Right," says {c}.']
  };

  const ICON = {
    ask: '<path d="M8,9 q0,-5 5,-5 q5,0 5,5 q0,3 -4,4.5 q-1,.5 -1,3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="13" cy="21" r="1.8" fill="currentColor"/>',
    challenge: '<path d="M13,4 v11" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><circle cx="13" cy="21" r="2" fill="currentColor"/>',
    explain: '<path d="M13,3 a7,7 0 0 1 4,12.7 v2.3 h-8 v-2.3 a7,7 0 0 1 4,-12.7z" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M10,21 h6 M11,24 h4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>',
    listen: '<path d="M9,10 a6,6 0 1 1 10,4.5 c-2,1.5 -2,3 -3,5 a3,3 0 0 1 -5,-1" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M12,10 a2.5,2.5 0 1 1 4,2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>'
  };
  const TAGNAME = { emotion: 'a feeling', question: 'a question', misconception: 'a misconception', tangent: 'a tangent', fact: 'something important' };

  /* Where the meeting happens. Purely framing: a label and one or two small interruptions
   * that pause the clock. seg limits a setting to clients it suits. */
  const SETTINGS = [
    { id: 'coffee', name: 'A corner table at the coffee shop', bits: ['"Oat latte for... Steve?" The barista waits. Nobody is Steve.', 'The espresso machine shrieks. You both pause.', 'Someone asks if the chair next to you is taken.'] },
    { id: 'kitchen', name: 'Their kitchen table', bits: ['The dog wants out. Then in. Then out again.', 'A timer goes off. "That\'s the oven. One second."', 'A kid wanders in looking for the scissors.'] },
    { id: 'video', name: 'A video call that keeps freezing', freeze: true, bits: ['Their video freezes mid-word. You wait.', '"You\'re on mute," you say. "No, you\'re on mute," they say.', 'The picture goes blocky. "Can you hear me now?"'] },
    { id: 'park', name: 'A walk in the park', bits: ['A goose eyes you both. You give it room.', 'A frisbee lands at your feet. You throw it back. Badly.', 'You stop to let a line of ducklings cross.'] },
    { id: 'office', name: 'The small meeting room at your office', bits: ['Your phone buzzes. You flip it face down.', 'Someone opens the door: "Oh, sorry. Wrong room."'] },
    { id: 'shop', name: 'Behind the counter of their shop', seg: ['owner'], bits: ['A customer walks in. "Be right with you!"', 'The delivery truck arrives. Signatures, please.'] },
    { id: 'cafeteria', name: 'The hospital cafeteria, during visiting hours', seg: ['caregiver'], bits: ['A page goes out over the speaker. They check their phone, just in case.'] },
    { id: 'porch', name: 'Their front porch, with lemonade', seg: ['retiree', 'changes', 'family'], bits: ['A neighbour waves and shouts hello. You wave back.', 'The wind chimes get very enthusiastic.'] }
  ];

  PP.minigames.conversation = {
    title: 'The Conversation',
    risk: 'missing what actually matters',
    blurb: 'Your client talks; you respond. Ask, challenge, explain, or keep listening. Watch their face, and catch what matters before it slips past.',
    start(root, ctx, done) {
      const F = PP.fx;
      const client = ctx.client;
      const script = client.conversation;
      const practice = !!ctx.practice;
      const prep = ctx.prep || 0;
      const per = 9 + prep * 2;
      const ui = PP.mg.shell(root, this.title, this.risk);
      const setting = PP.pick(SETTINGS.filter((x) => !x.seg || x.seg.includes(client.segment)));
      ui.wrap.insertBefore(h('div', { class: 'mg-scene' }, h('b', null, setting.name)), ui.hud);
      // One or two small interruptions, never on the first line.
      const bits = PP.shuffle(setting.bits);
      const interruptAt = {};
      PP.shuffle(script.map((_, k) => k).slice(1)).slice(0, script.length > 4 && PP.chance(0.45) ? 2 : 1).forEach((k, n) => (interruptAt[k] = bits[n % bits.length]));
      let localTrust = ctx.state.res.trust;
      const trustM = F.meter('Trust', 'good'); trustM.set(localTrust, 10);
      const insightC = F.counter('Insights');
      ui.hud.append(trustM.el, insightC.el);

      const face = h('div', { class: 'cv-face' });
      const notebook = h('div', { class: 'cv-notebook', title: 'What you have learned' }, h('span', null, 'Notebook'), h('b', null, '0'));
      const speech = h('div', { class: 'cv-speech' });
      const tagChip = h('div', { class: 'cv-tag' });
      const stage = h('div', { class: 'mg-stage-area cv-stage cv-set-' + setting.id },
        h('div', { class: 'cv-portrait' }, face, h('strong', null, client.name), h('span', { class: 'small' }, client.title)),
        h('div', { class: 'cv-right' }, speech, tagChip), notebook);
      const acts = h('div', { class: 'cv-acts' });
      const pitchBtn = h('button', { class: 'btn pitch', hidden: true, onclick: () => pitch() }, 'Pitch the Grand Plan!');
      ACTIONS.forEach((a) => acts.appendChild(h('button', { class: 'cv-act a-' + a.id, onclick: () => respond(a.id) },
        h('span', { class: 'dd-icon', html: `<svg viewBox="0 0 26 26" aria-hidden="true">${ICON[a.id]}</svg>` }), h('span', null, a.label), h('kbd', null, a.key))));
      ui.body.append(stage, h('div', { class: 'pitch-row' }, pitchBtn), acts);
      const onKey = (e) => { const a = ACTIONS.find((x) => x.key === e.key); if (a) { e.preventDefault(); respond(a.id); } };
      document.addEventListener('keydown', onKey);

      let i = -1, timer = null, finished = false, locked = false, typeT = null, pitched = false, intT = null, intEl = null;
      const acc = { trust: 0, momentum: 0, insight: 0 };
      const facts = [], missed = [], debts = [], lines = [];
      const baseMood = () => Math.max(-2, Math.min(2, Math.round((localTrust - 5) / 2)));
      const setFace = (m, surprised) => { face.innerHTML = PP.art.face({ mood: m, hue: client.hue, surprised }); };
      setFace(baseMood());

      function type(text) {
        clearInterval(typeT);
        speech.textContent = '';
        let k = 0;
        typeT = setInterval(() => { k += 2; speech.textContent = text.slice(0, k); if (k >= text.length) clearInterval(typeT); }, 18);
      }
      function next() {
        i++;
        if (i >= script.length) return finish();
        ui.status.textContent = `${i + 1} of ${script.length}`;
        const st = script[i];
        tagChip.textContent = '';
        speech.className = 'cv-speech enter';
        type(PP.mg.fill(st.text, client));
        setFace(baseMood());
        pitchBtn.hidden = !st.pitch || pitched;
        locked = false;
        acts.querySelectorAll('button').forEach((b) => (b.disabled = false));
        if (timer) timer.stop();
        timer = PP.mg.timer(ui.bar, per, () => respond('listen', true));
        if (interruptAt[i]) { const text = interruptAt[i]; intT = setTimeout(() => interrupt(text), 1400); }
      }
      function clearInterrupt() {
        clearTimeout(intT);
        if (intEl) { intEl.remove(); intEl = null; }
        stage.classList.remove('frozen');
      }
      function interrupt(text) {
        if (finished || locked) return;
        timer && timer.pause(true);
        intEl = h('div', { class: 'cv-interrupt' }, text, h('small', null, 'Clock paused'));
        stage.appendChild(intEl);
        if (setting.freeze) stage.classList.add('frozen');
        F.sfx('ding');
        intT = setTimeout(() => { clearInterrupt(); if (!locked && timer) timer.pause(false); }, 2200);
      }
      function respond(action, timedOut) {
        if (finished || locked || i < 0 || i >= script.length) return;
        locked = true;
        clearInterval(typeT);
        clearInterrupt();
        timer && timer.stop();
        acts.querySelectorAll('button').forEach((b) => (b.disabled = true));
        const st = script[i];
        const r = judge(st, action, ctx, localTrust);
        for (const k in r.d) acc[k] += r.d[k];
        const dT = r.d.trust || 0;
        localTrust = PP.clamp(localTrust + dT, 0, 10);
        trustM.set(localTrust, 10);
        if (r.debt) debts.push(r.debt);
        const btn = acts.querySelector('.a-' + action);
        if (btn) F.glow(btn, r.q === 'bad' ? 'bad' : 'good');
        // The face reacts right away
        setFace(r.q === 'good' ? 2 : r.q === 'bad' ? -2 : 0);
        if (dT) F.popOn(stage, face, (dT > 0 ? '+' : '') + dT + ' Trust', dT > 0 ? 'good' : 'bad');
        else F.popOn(stage, face, r.q === 'good' ? 'Nice' : r.q === 'bad' ? 'Hmm.' : timedOut ? '(you listen)' : 'Okay', r.q === 'good' ? 'good' : r.q === 'bad' ? 'bad' : 'meh');
        F.sfx(r.q === 'good' ? 'good' : r.q === 'bad' ? 'bad' : 'meh');
        if (r.q === 'bad') F.shake(face);
        tagChip.textContent = 'That was ' + TAGNAME[st.tag] + '.' + (practice ? ' ' + WHY[st.tag][action] : '');
        let fb = r.note || PP.mg.fill(PP.pick(REACT[r.q]), client);
        if (st.tag === 'fact') {
          const f = client.facts[st.fact];
          if (r.reveal && !facts.includes(st.fact)) {
            facts.push(st.fact);
            insightC.set(facts.length);
            notebook.querySelector('b').textContent = String(facts.length);
            const card = h('div', { class: 'cv-fact' }, f.label);
            stage.appendChild(card);
            setTimeout(() => { F.fly(card, notebook, stage, () => { F.bump(notebook); F.burstOn(stage, notebook, 'great', 12); }); card.remove(); F.sfx('coin'); }, 550);
            fb = 'You learned: ' + f.label + '.';
          } else if (!r.reveal && !facts.includes(st.fact) && !missed.includes(st.fact)) { missed.push(st.fact); F.popOn(stage, speech, 'Something slipped past…', 'bad'); }
        }
        ui.feedback.textContent = fb;
        ui.feedback.className = 'mg-feedback q-' + r.q;
        const label = ACTIONS.find((a) => a.id === action).label;
        lines.push({ q: r.q, text: `"${PP.mg.fill(st.text, client).replace(/^"|"$/g, '').slice(0, 70)}${st.text.length > 72 ? '…' : ''}" → ${timedOut ? 'kept listening' : label} (${TAGNAME[st.tag]})` });
        setTimeout(next, 1300);
      }
      function pitch() {
        if (finished || locked) return;
        pitched = true;
        pitchBtn.hidden = true;
        acc.momentum += 1; acc.trust -= 2;
        localTrust = PP.clamp(localTrust - 2, 0, 10); trustM.set(localTrust, 10);
        debts.push({ tag: 'premature_pitch', sev: 2 });
        setFace(-1, true); F.popOn(stage, face, '−2 Trust', 'bad'); F.sfx('bad'); F.shake(face);
        ui.feedback.textContent = PP.mg.fill('{c} blinks. "Oh. Um. Maybe?"', client);
        ui.feedback.className = 'mg-feedback q-bad';
        lines.push({ q: 'bad', text: 'Pitched the Grand Plan mid-conversation.' });
      }
      function finish() {
        if (finished) return;
        finished = true;
        timer && timer.stop(); clearInterval(typeT); clearInterrupt();
        document.removeEventListener('keydown', onKey);
        const remaining = missed.filter((f) => !facts.includes(f));
        const score = lines.reduce((a, l) => a + (l.q === 'good' ? 1 : l.q === 'ok' ? 0.5 : 0), 0);
        const eff = { energy: -1, trust: PP.clamp(Math.round(acc.trust), -3, 3), momentum: PP.clamp(Math.round(acc.momentum), -2, 2), insight: Math.round(acc.insight), fact: facts };
        if (remaining.length) eff.missed = remaining[0];
        if (debts.length) eff.debt = debts;
        const result = {
          score: Math.round(score * 10) / 10, max: script.length, eff, lines, showDebt: practice,
          passed: ctx.pass != null ? score >= ctx.pass : null,
          headline: setting.name + '. ' + (facts.length ? 'You picked up on: ' + facts.map((f) => client.facts[f].label.toLowerCase()).join('; ') + '.' : 'You came away with the facts, but not much underneath them.')
        };
        if (remaining.length) result.lines.push({ q: 'bad', text: 'Slipped past you: ' + remaining.map((f) => client.facts[f].label.toLowerCase()).join('; ') + '.' });
        PP.mg.summary(root, PP.minigames.conversation.title, result, done);
      }
      next();
      return { stop() { finished = true; timer && timer.stop(); clearInterval(typeT); clearInterrupt(); document.removeEventListener('keydown', onKey); } };
    }
  };
})(window.PP);

</script>

    }
