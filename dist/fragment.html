<title>Build Your Practice</title>
<meta name="description" content="Build Your Practice: a light adventure game about growing a client practice, one trail at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Kalam:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Ccircle cx=%2220%22 cy=%2220%22 r=%2218%22 fill=%22%23f5ddbb%22 stroke=%22%23000a62%22 stroke-width=%223%22/%3E%3Cpath d=%22M20,4 L24,18 L20,21 L16,18z%22 fill=%22%23f39c12%22/%3E%3Cpath d=%22M20,36 L24,22 L20,19 L16,22z%22 fill=%22%23000a62%22/%3E%3C/svg%3E">
<style>
/* Build Your Practice — styled after the original concept map.
   Navy table; every view is one framed parchment sheet. Flat pastel fills,
   thin dark-brown linework, dotted navy routes, orange accents.
   Labels in a clean humanist sans; notes in italics or a light handwritten face. */
:root {
  --navy: #000a62;
  --navy-2: #0c1772;
  --navy-line: #2a3590;
  --route: #0b1470;
  --parch: #f5ddbb;
  --parch-2: #eed3ad;
  --parch-3: #e3c6a0;
  --paper: #fbf1e1;
  --fog: #fcf6ee;
  --edge: #c8925a;
  --ink: #4a2c12;
  --ink-2: #7a5a3a;
  --ink-3: #a3876a;
  --orange: #f39c12;
  --orange-2: #fbd28a;
  --green: #3f7a2f;
  --meadow: #dce6bc;
  --swamp: #c9ddb8;
  --water: #cfe3f7;
  --river: #9cc2e6;
  --blue: #2f5a9c;
  --tan: #b0763c;
  --red: #a3321c;
  --rose: #e9a7a0;
  --trust: #c4586f;
  --momentum: #e08a1e;
  --energy: #5c9a46;
  --insight: #3d6fb6;
  --sans: "Open Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --hand: "Kalam", "Segoe Print", "Bradley Hand", cursive;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--navy); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: 0.85em; background: var(--parch-2); padding: 1px 5px; border-radius: 4px; }
:focus-visible { outline: 2.5px solid var(--orange); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--sans); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; color: var(--ink); letter-spacing: -0.01em; }
h3 { font-size: 1.25rem; }
h4 { font-size: 1.05rem; margin-bottom: 6px; }
p { margin: 0; }

.app { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }

/* ---------- Top bar (on the navy table) ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--parch); font-weight: 600; font-size: 1.25rem; }
.brand-mark { width: 32px; height: 32px; flex: none; display: block; }
.tagline { font-style: italic; font-weight: 400; font-size: 0.95rem; color: #aeb6e6; }
.tabs { display: flex; gap: 2px; }
.tabs button { background: none; border: 0; padding: 6px 14px; border-radius: 999px; cursor: pointer; color: #c9cff2; font-weight: 600; font-size: 0.95rem; }
.tabs button[aria-current="page"] { background: var(--parch); color: var(--navy); }
.tabs button:hover:not([aria-current="page"]) { color: #fff; }

/* ---------- The parchment sheet ---------- */
.view { position: relative; background: var(--parch); border: 3px solid var(--edge); border-radius: 3px; padding: 30px 30px 34px; box-shadow: 0 20px 40px -24px #000; }
.view::before { content: ""; position: absolute; inset: 10px; border: 1.5px solid rgba(74, 44, 18, 0.28); pointer-events: none; border-radius: 1px; }

/* ---------- Type helpers ---------- */
.eyebrow { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--tan); }
.display { font-size: clamp(2.4rem, 6vw, 4.2rem); font-weight: 700; letter-spacing: -0.03em; color: var(--navy); margin-block: 2px 10px; }
.display-sm { font-size: clamp(1.7rem, 3.6vw, 2.4rem); font-weight: 700; letter-spacing: -0.02em; color: var(--navy); margin-top: 2px; }
.lede { font-size: 1.08rem; max-width: 62ch; color: var(--ink); }
.muted { color: var(--ink-2); }
.small { font-size: 0.85rem; }
.note { font-family: var(--hand); color: var(--ink-2); }
.good-text { color: var(--green); }
.warn { color: var(--red); }
.mt { margin-top: 10px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row.tight { gap: 10px; flex-wrap: nowrap; }
.row.between { justify-content: space-between; align-items: flex-start; }
.row.wrap { flex-wrap: wrap; align-items: flex-end; }
.stack { display: grid; gap: 8px; }
.plain { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }

/* ---------- Buttons: flat, thin outline, navy primary ---------- */
.btn { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); padding: 7px 14px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 0.92rem; line-height: 1.2; display: inline-flex; align-items: center; gap: 8px; transition: background .12s, border-color .12s, transform .06s; }
.btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.45); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: var(--parch); }
.btn.primary:hover:not(:disabled) { background: var(--route); box-shadow: 0 0 0 3px var(--orange-2); }
.btn.accent { border-color: var(--green); color: var(--green); }
.btn.ghost { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }
.btn.small { padding: 3px 10px; font-size: 0.82rem; }
.btn.big { padding: 11px 22px; font-size: 1.05rem; }
.intro .btn.ghost, .ending-head .btn.ghost { border-color: var(--ink); text-decoration: none; }
kbd { font-family: var(--mono); font-size: 0.68rem; border: 1px solid currentColor; opacity: .55; border-radius: 3px; padding: 0 4px; }
.pill { display: inline-block; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--ink-3); color: var(--ink-2); }
.pill.good, .pill.fit-appropriate, .pill.o-harmless { color: var(--green); border-color: var(--green); }
.pill.bad, .pill.fit-poor, .pill.o-costly { color: var(--red); border-color: var(--red); }
.pill.fit-acceptable, .pill.o-inconvenient { color: var(--tan); border-color: var(--tan); }

/* ---------- Surfaces: flat fills, no heavy boxes ---------- */
.panel, .npc, .prospect, .phase, .pack-item { background: var(--parch-2); border-radius: 10px; color: var(--ink); }
.panel { padding: 16px 18px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.screen-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px 32px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 2px dotted var(--route); }
.screen-head > p { max-width: 54ch; }

/* ---------- Title ---------- */
.intro { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr); gap: 34px; align-items: center; padding-block: 8px; }
.intro-copy { display: grid; gap: 14px; justify-items: start; }
.intro-map { border-radius: 6px; overflow: hidden; }

/* ---------- Practice ladder ---------- */
.ladder { list-style: none; margin: 2px 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; position: relative; }
.ladder li { position: relative; padding: 18px 8px 4px; display: grid; gap: 2px; color: var(--ink-3); text-align: center; }
.ladder li::before { content: ""; position: absolute; top: 6px; left: 0; right: 0; border-top: 3px dotted var(--route); opacity: .5; }
.ladder li::after { content: ""; position: absolute; top: 0; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--parch); border: 2px solid var(--ink-3); }
.ladder li strong { font-weight: 600; font-size: 0.98rem; }
.ladder li.past { color: var(--ink-2); }
.ladder li.past::after { background: var(--ink-3); }
.ladder li.now { color: var(--navy); }
.ladder li.now::after { width: 22px; height: 22px; margin-left: -11px; top: -4px; background: var(--orange); border-color: var(--ink); }
.ladder li.now.l-unemployed { color: var(--red); }
.ladder li.now.l-profitable::after { background: var(--green); }
.ladder.compact li span { display: none; }
.practice { display: grid; gap: 10px; margin-bottom: 14px; }
.practice-top { display: flex; justify-content: space-between; gap: 10px 24px; flex-wrap: wrap; align-items: flex-end; }
.practice-top h3 { font-size: 1.7rem; color: var(--navy); font-weight: 700; }
.practice-nums { display: flex; gap: 10px 26px; flex-wrap: wrap; }
.stat { display: grid; }
.lk, .stat .lk { font-size: 0.66rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.stat strong { font-weight: 600; font-size: 1.3rem; font-variant-numeric: tabular-nums; color: var(--ink); }
.stat.warn strong { color: var(--red); }
.book summary { cursor: pointer; font-weight: 600; }
.book ul { margin: 6px 0 0; padding-left: 1.1em; display: grid; gap: 3px; font-size: 0.9rem; }
.payday { display: grid; gap: 10px; margin-bottom: 14px; }

/* ---------- Port ---------- */
.flash { display: grid; gap: 3px; background: var(--meadow); border-radius: 8px; padding: 9px 14px; margin-bottom: 12px; }
.flash p.fl-bad { color: var(--red); }
.flash p.fl-good { color: var(--green); font-weight: 600; }
.coach { padding: 4px 0 12px; margin-bottom: 4px; font-size: 1rem; }
.coach .eyebrow { color: var(--orange); margin-right: 6px; }
.port-tabs { display: flex; gap: 4px 18px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1.5px solid rgba(74, 44, 18, .25); }
.port-tabs button { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 8px 2px; font-weight: 600; font-size: 0.98rem; color: var(--ink-2); cursor: pointer; }
.port-tabs button[aria-current="true"] { color: var(--navy); border-bottom-color: var(--orange); }
.activity-grid, .pipeline-grid, .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.activity, .prospect-card, .client-row { display: grid; gap: 8px; align-content: start; }
.activity h3, .prospect-card h3, .agent-card h3 { color: var(--navy); }
.activity .row.between { align-items: center; margin-top: auto; }
.prospect-card .btn { justify-self: start; }
.prospect-card.t-hot { box-shadow: inset 0 0 0 2px var(--orange); }
.pill.temp-hot { color: #a14a00; border-color: var(--orange); background: var(--orange-2); }
.pill.temp-warm { color: var(--green); border-color: var(--green); }
.pill.temp-cold { color: var(--blue); border-color: var(--blue); }
.client-row.b-cancelled { opacity: .55; }
.sat { display: grid; gap: 3px; }
.build-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.build-grid h3 { color: var(--navy); margin-bottom: 4px; }
.option-list { display: grid; gap: 6px; margin-top: 8px; }
.option { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; background: var(--parch); }
.option > div { min-width: 0; }
.option .btn, .option .pill { flex: none; }
.option.current { background: var(--meadow); }
.option.locked { opacity: .6; }
.prospect { padding: 14px 16px; margin-bottom: 14px; display: grid; gap: 6px; justify-items: start; }
.port-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.npc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.npc { padding: 14px; display: grid; gap: 8px; align-content: start; }
.npc-head { display: flex; gap: 10px; align-items: center; }
.npc-head h3 { font-size: 1.1rem; }
.npc-mark { width: 38px; height: 38px; border-radius: 50%; background: var(--navy); color: var(--parch); display: grid; place-items: center; font-weight: 700; flex: none; }
.npc-greet { font-style: italic; color: var(--ink-2); }
.npc-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.npc-ability { border-top: 1px dashed var(--ink-3); padding-top: 8px; }
.port-side { display: grid; gap: 12px; position: sticky; top: 16px; }
.contact-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.contact-list li { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.skill-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 7px; }
.skill-list li { display: flex; gap: 10px; align-items: baseline; color: var(--ink-3); }
.skill-list li.has { color: var(--ink); }
.pips { display: inline-flex; gap: 3px; flex: none; }
.pips i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink-3); display: block; }
.pips i.on { background: var(--orange); border-color: var(--ink); }

/* ---------- Agent choice ---------- */
.agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.agent-card { display: grid; gap: 8px; align-content: start; }
.agent-card h3 { font-size: 1.35rem; }
.agent-tag { font-style: italic; color: var(--ink-2); }
.agent-card .btn { justify-self: start; margin-top: 4px; }

/* ---------- Pack ---------- */
.pack-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-bottom: 20px; }
.pack-item { text-align: left; padding: 14px; display: grid; gap: 4px; cursor: pointer; border: 0; }
.pack-item strong { font-weight: 600; }
.pack-item[aria-pressed="true"] { background: var(--orange-2); box-shadow: inset 0 0 0 2px var(--orange); }

/* ---------- Journey ---------- */
.trail { display: grid; gap: 14px; }
.stage { border-radius: 8px; overflow: hidden; background: var(--parch); box-shadow: inset 0 0 0 1.5px rgba(74, 44, 18, .3); }
.trail-canvas { display: block; width: 100%; aspect-ratio: 3 / 1; height: auto; cursor: pointer; }
.ledger { display: flex; flex-wrap: wrap; gap: 8px 26px; padding: 4px 2px 12px; align-items: flex-end; border-bottom: 2px dotted var(--route); }
.ledger-cell { display: grid; min-width: 0; }
.ledger-cell strong { font-weight: 600; font-size: 1.1rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.ledger-cell.wide { flex: 1 1 170px; }
.ledger-cell.weather span:last-child { font-family: var(--hand); line-height: 1.2; color: var(--ink-2); }
.ledger-cell.money .small { color: var(--ink-2); }
.ledger-cell.money.lvl-survivable strong { color: var(--red); }
.ledger-cell.money.lvl-profitable strong { color: var(--green); }
.ledger .gauges { flex: 2 1 380px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.trail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 18px; align-items: start; }
.journal { min-height: 320px; display: grid; gap: 12px; align-content: start; }
.goal { font-size: 0.9rem; padding-bottom: 10px; display: grid; gap: 3px; color: var(--ink-2); border-bottom: 1px dashed var(--ink-3); }
.goal .eyebrow { color: var(--orange); margin-right: 4px; }
.narr { display: grid; gap: 6px; }
.narr p { color: var(--ink-2); }
.narr p.latest { color: var(--ink); font-size: 1.04rem; }
.narr p.reply, .travel-log p.reply { font-style: italic; color: var(--blue); font-size: 1.05rem; }
.narr p.you { font-style: italic; }
.narr p.bad, .travel-log p.bad { color: var(--red); }
.narr p.arrive { font-weight: 600; color: var(--green); }
.learned { background: var(--meadow); border-radius: 6px; padding: 7px 12px; font-weight: 600; color: var(--green); }
.you-may { font-weight: 600; color: var(--navy); font-size: 1.05rem; }
.menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
/* Choices look like what they are: big tappable cards with a number badge and a chevron. */
.menu-item, .choice { width: 100%; text-align: left; background: var(--fog); border: 1.5px solid var(--ink); border-radius: 12px; padding: 11px 38px 11px 12px; min-height: 52px; cursor: pointer; display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; gap: 2px 10px; color: var(--ink); position: relative; box-shadow: 0 3px 0 rgba(74, 44, 18, .25); transition: transform .08s, box-shadow .08s, background .12s; -webkit-tap-highlight-color: transparent; }
.menu-item .num { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: var(--parch); font-weight: 700; font-size: 0.85rem; display: grid; place-items: center; grid-row: span 2; align-self: center; }
.menu-item .mi-label { font-weight: 600; font-size: 1.02rem; }
.menu-item .mi-note { grid-column: 2; font-size: 0.85rem; color: var(--ink-2); }
.chev { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 1.6rem; line-height: 1; color: var(--navy); font-weight: 600; }
.menu-item:hover:not(:disabled), .menu-item:focus-visible, .choice:hover, .choice:focus-visible { background: #fff; outline: none; box-shadow: 0 3px 0 var(--orange); }
.menu-item:active:not(:disabled), .choice:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(74, 44, 18, .25); }
.menu-item.primary { background: var(--navy); border-color: var(--navy); color: var(--parch); }
.menu-item.primary .num { background: var(--orange); color: var(--ink); }
.menu-item.primary .mi-note { color: #c9cff2; }
.menu-item.primary .chev { color: var(--orange); }
.menu-item.primary:hover:not(:disabled), .menu-item.primary:focus-visible { background: #0b1a8a; }
.menu-item:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
.pick-prompt, .you-may { font-weight: 700; color: var(--navy); font-size: 1rem; margin: 6px 0 2px; }
.pick-prompt::before, .you-may::before { content: "→ "; color: var(--orange); }
.travel-log { display: grid; gap: 4px; font-size: 0.9rem; min-height: 6em; color: var(--ink-2); }
.travel-log p:last-child { color: var(--ink); }
.checkin-head { display: flex; gap: 12px; align-items: center; }
.trail-side { display: grid; gap: 12px; position: sticky; top: 16px; }
.map-thumb { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: 4px; overflow: hidden; }
.map-panel { padding: 12px; }
.home-panel { display: grid; gap: 4px; }
.map-overlay .map-card { width: min(1200px, 100%); background: var(--navy); border-radius: 10px; padding: 14px; display: grid; gap: 10px; color: var(--parch); }
.map-overlay .map-card h3 { color: var(--parch); }
.map-overlay .map-card .btn { color: var(--parch); border-color: var(--parch); }
.map-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; color: var(--parch); }
.lg { display: inline-block; width: 32px; height: 0; border-top: 4px dotted var(--parch); vertical-align: middle; }
.lg.dash { border-top: 3px dashed var(--edge); }
.lg.road { border-top: 4px double var(--edge); }
.lg.walked { border-top: 4px solid var(--orange); }
.said { font-style: italic; color: var(--ink-2); }

/* ---------- Gauges ---------- */
.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gauge { color: var(--ink); }
.gauge-top { display: flex; justify-content: space-between; align-items: baseline; }
.gauge-label { font-size: 0.66rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); }
.gauge-num { font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; align-items: baseline; }
.gauge-delta { font-size: 0.75rem; animation: pop 1.6s ease-out both; }
.gauge-delta.up { color: var(--green); }
.gauge-delta.down { color: var(--red); }
@keyframes pop { 0% { opacity: 0; transform: translateY(4px); } 15% { opacity: 1; transform: none; } 100% { opacity: .7; } }
.gauge-track { height: 7px; border-radius: 4px; background: var(--parch-3); margin-top: 3px; position: relative; overflow: hidden; }
.gauge-fill { height: 100%; border-radius: 4px; transition: width .6s ease; }
.tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(245, 221, 187, .7); }
.g-trust .gauge-fill { background: var(--trust); }
.g-momentum .gauge-fill { background: var(--momentum); }
.g-energy .gauge-fill { background: var(--energy); }
.g-insight .gauge-fill { background: var(--insight); }
.gut { background: #f2cfc4; border-radius: 8px; padding: 9px 12px; display: grid; gap: 2px; font-size: 0.92rem; }
.gut .eyebrow { color: var(--red); }
.client-card { display: grid; gap: 6px; }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; background: hsl(var(--h) 45% 78%); color: var(--ink); font-weight: 700; flex: none; border: 1.5px solid var(--ink); }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 0.92rem; }
.facts li { padding-left: 16px; position: relative; }
.facts li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 7px; height: 7px; border-radius: 50%; background: var(--insight); }
.facts li.key::before { background: var(--orange); box-shadow: 0 0 0 2px var(--orange-2); }
.facts li.key { font-weight: 600; }
.facts li.surface { color: var(--ink-2); font-style: italic; }
.facts li.surface::before { background: var(--ink-3); }
.log summary { cursor: pointer; font-weight: 600; }
.log ol { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: 0.84rem; color: var(--ink-2); max-height: 240px; overflow: auto; }

/* ---------- Event scenes ---------- */
.scene { background: var(--paper); color: var(--ink); border-radius: 10px; padding: 18px; display: grid; gap: 10px; animation: rise .3s ease-out; }
.journal .scene { background: transparent; padding: 0; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.scene-title { font-size: 1.5rem; font-weight: 700; color: var(--navy); }
.scene-text { font-size: 1.04rem; max-width: 64ch; }
.scene-sub { font-size: 0.86rem; color: var(--ink-2); font-style: italic; }
.scene-debt .scene-sub { color: var(--red); }
.scene-debt .scene-title { color: var(--red); }
.skeptic-note { background: var(--ink); color: var(--parch); padding: 8px 12px; border-radius: 6px; font-size: 0.92rem; }
.choices { display: grid; gap: 8px; counter-reset: ch; }
.choice { counter-increment: ch; grid-template-columns: 28px minmax(0, 1fr); }
.choice::before { content: counter(ch); width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: var(--parch); font-weight: 700; font-size: 0.85rem; display: grid; place-items: center; grid-row: span 4; align-self: center; }
.choice > * { grid-column: 2; }
.choice .kind { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; justify-self: start; }
.choice-label { font-weight: 600; font-size: 1.02rem; }
.choice .hint { font-size: 0.85rem; color: var(--ink-2); font-style: italic; }
.choice .hint.show { font-style: normal; }
.choice .tag { font-size: 0.66rem; font-weight: 600; margin-left: 8px; color: var(--ink-2); text-transform: uppercase; }
.k-through .kind, .kind-chip.k-through { color: var(--red); }
.k-around .kind, .kind-chip.k-around { color: var(--blue); }
.k-prepare .kind, .kind-chip.k-prepare { color: var(--green); }
.k-help .kind, .kind-chip.k-help { color: var(--tan); }
.kind-chip { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: rgba(255, 255, 255, .55); color: var(--ink-2); }
.chip.up { color: var(--green); }
.chip.down { color: var(--red); }
.chip.c-fact, .chip.c-skill { color: var(--blue); }
.chip.c-debt { color: #fff; background: var(--red); }
.chip.c-style { color: var(--tan); }
.chip.c-good { color: var(--green); }
.out-costly .scene-text { color: var(--red); }
.lab-reveal { border-top: 1px dashed var(--ink-3); padding-top: 8px; display: grid; gap: 6px; }

/* ---------- Overlay & toast ---------- */
.overlay { position: fixed; inset: 0; background: rgba(0, 6, 50, .78); display: grid; place-items: center; padding: 16px; z-index: 50; overflow: auto; }
.overlay-card { width: min(820px, 100%); }
.overlay-card > .scene { border: 3px solid var(--edge); background: var(--parch); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: var(--parch); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 60; max-width: min(560px, calc(100% - 32px)); transition: opacity .5s; }
.toast.out { opacity: 0; }

/* ---------- Map (SVG) ---------- */
.pmap { display: block; width: 100%; height: auto; }
.pmap .m-bg { fill: var(--navy); }
.small-map .pmap .m-bg, .map-thumb .pmap .m-bg, .intro-map .pmap .m-bg { fill: transparent; }
.pmap .m-paper { stroke: var(--edge); stroke-width: 5; }
.pmap .m-frame { fill: none; stroke: rgba(74, 44, 18, .35); stroke-width: 2; }
.pmap .m-water { fill: var(--water); }
.pmap .m-river { fill: none; stroke: var(--river); stroke-width: 18; stroke-linecap: round; }
.pmap .m-lore { fill: var(--blue); font: italic 400 19px var(--sans); }
.pmap .m-lore.big { font-size: 25px; }
.pmap .m-dragon { fill: none; stroke: var(--blue); stroke-width: 7; stroke-linecap: round; }
.pmap .m-compass circle { fill: none; stroke: var(--ink-2); stroke-width: 2; }
.pmap .m-compass path { fill: var(--ink); }
.pmap .m-compass path.thin { fill: var(--ink-2); }
.pmap .trail-main { fill: none; stroke: var(--route); stroke-width: 5; stroke-dasharray: 0.1 11; stroke-linecap: round; }
.pmap .trail-side { fill: none; stroke: var(--ink); stroke-width: 3; stroke-dasharray: 9 7; }
.pmap .trail-secret { fill: none; stroke: #c8a27a; stroke-width: 6; }
.pmap .trail-secret.locked { opacity: .8; }
.pmap .faint { opacity: .3; }
.pmap .trail-walked { fill: none; stroke: var(--orange); stroke-width: 9; stroke-linecap: round; opacity: .5; }
.pmap .m-secret text { fill: var(--ink); font: italic 20px var(--sans); }
.pmap .m-secret .m-sub { font: 16px var(--hand); fill: var(--ink-2); }
.pmap .waystone { fill: var(--parch); stroke: #c8a27a; stroke-width: 2.5; }
.pmap .ink { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.pmap .ink.thick { stroke-width: 4; }
.pmap .ink.thin { stroke-width: 1.5; }
.pmap .inkfill { fill: var(--ink); }
.pmap .hull { fill: #7a4a22; stroke: var(--ink); stroke-width: 2; }
.pmap .sail { fill: var(--fog); stroke: var(--ink); stroke-width: 2; }
.pmap .meadow { fill: var(--meadow); }
.pmap .grass { fill: none; stroke: var(--green); stroke-width: 2.5; }
.pmap .flower { fill: var(--orange); }
.pmap .tower { fill: #fff; stroke: var(--ink); stroke-width: 3; }
.pmap .stripe { stroke: var(--ink); stroke-width: 2.5; }
.pmap .lamp { fill: var(--orange); stroke: var(--ink); stroke-width: 2; }
.pmap .rays { stroke: var(--orange); stroke-width: 3; stroke-linecap: round; }
.pmap .cloud { fill: var(--fog); }
.pmap .fogline { fill: none; stroke: #8c9bc0; stroke-width: 2.5; }
.pmap .swamp { fill: var(--swamp); stroke: var(--ink-2); stroke-width: 2.5; }
.pmap .swampgrid { stroke: #7fa463; stroke-width: 2; }
.pmap .reeds { stroke: var(--green); stroke-width: 3; }
.pmap .pit { fill: #3a2410; }
.pmap .snake { fill: none; stroke: #6b8f3e; stroke-width: 4; stroke-linecap: round; }
.pmap .dune { fill: none; stroke: var(--tan); stroke-width: 3; }
.pmap .cave { fill: #ebcf9e; stroke: var(--ink); stroke-width: 3; }
.pmap .cavemouth { fill: var(--ink); }
.pmap .mountain { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
.pmap .ice { fill: none; stroke: #9fd3f5; stroke-linecap: round; }
.pmap .lake { fill: var(--water); stroke: var(--river); stroke-width: 3; }
.pmap .islet { fill: #f0dcb0; stroke: var(--ink); stroke-width: 2; }
.pmap .bridge { stroke: #8a5a2e; stroke-width: 10; stroke-linecap: round; }
.pmap .stonebridge { fill: #e2d5bd; stroke: var(--ink); stroke-width: 2; }
.pmap .glow { fill: #ffe7a3; opacity: .6; }
.pmap .x-back { stroke: var(--navy); stroke-width: 18; stroke-linecap: round; }
.pmap .x-front { stroke: var(--orange); stroke-width: 10; stroke-linecap: round; }
.pmap .sparkle { fill: var(--orange); }
.pmap .skull { fill: var(--ink); }
.pmap .skull + circle, .pmap .skull ~ circle { fill: var(--parch); }
.pmap .m-icon.v-uncharted { opacity: .16; }
.pmap .m-icon.v-rumored { opacity: .55; }
.pmap .m-clouds ellipse { fill: #ecd2ab; }
.pmap .m-q { font: 600 30px var(--sans); fill: var(--ink-3); text-anchor: middle; }
.pmap .m-label text { font: 400 22px var(--sans); fill: var(--ink); paint-order: stroke; stroke: var(--parch); stroke-width: 5px; stroke-linejoin: round; }
.pmap .m-label.big text { font-size: 28px; font-weight: 600; }
.pmap .m-label .m-sub { font: 16px var(--hand); fill: var(--ink-2); }
.pmap .m-label.v-rumored text:first-child { font-size: 28px; fill: var(--ink-3); }
.pmap .m-pin .pin { fill: #d9472b; stroke: var(--ink); stroke-width: 2.5; }
.pmap .m-pin .pin-dot { fill: var(--fog); }
.pmap .boardwalk { stroke: #8a5a2e; stroke-width: 10; stroke-dasharray: 6 3; }
.pmap .pennant { fill: var(--orange); stroke: var(--ink); stroke-width: 1.5; }
.pmap .pole { stroke: var(--ink); stroke-width: 2.5; }
.pmap .m-hit { fill: rgba(243, 156, 18, .25); stroke: var(--orange); stroke-width: 3; cursor: pointer; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { fill-opacity: .1; } }

/* ---------- Ending ---------- */
.ending-head { padding-bottom: 18px; margin-bottom: 16px; display: grid; gap: 8px; justify-items: start; border-bottom: 2px dotted var(--route); }
.stars { display: flex; gap: 6px; }
.stars span { width: 20px; height: 20px; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: var(--parch-3); }
.stars span.on { background: var(--orange); }
.ending-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
.ending-grid h3 { margin-bottom: 10px; color: var(--navy); }
.score-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.score-list li { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--ink-3); padding-bottom: 5px; }
.score-list strong { color: var(--navy); }
.debt-timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.debt-timeline li { border-left: 3px solid var(--ink-3); padding-left: 12px; display: grid; gap: 3px; justify-items: start; }
.debt-timeline li.o-costly { border-color: var(--red); }
.debt-timeline li.o-inconvenient { border-color: var(--orange); }
.debt-timeline li.o-harmless, .debt-timeline li.o-rescued { border-color: var(--green); }
.small-map { border-radius: 6px; overflow: hidden; }

/* ---------- Lab ---------- */
.lab-nav { display: flex; gap: 4px 18px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1.5px solid rgba(74, 44, 18, .25); }
.lab-nav button { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 8px 2px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.lab-nav button[aria-current="true"] { color: var(--navy); border-bottom-color: var(--orange); }
.lab-body { display: grid; gap: 14px; }
.lab-intro { display: grid; gap: 4px; max-width: 72ch; }
.lab-intro h3 { font-size: 1.5rem; color: var(--navy); font-weight: 700; }
.lab-intro p { color: var(--ink-2); }
.lab-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.lab-cols.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.res-buttons { display: grid; gap: 6px; margin: 10px 0; }
.field { display: grid; gap: 4px; font-size: 0.86rem; margin-bottom: 8px; min-width: 0; }
.field select { background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink-3); border-radius: 6px; padding: 6px 8px; font: inherit; max-width: 100%; }
.field.check { display: flex; gap: 8px; align-items: center; }
.field.slider input { width: 100%; accent-color: var(--orange); }
.lab-log { display: grid; gap: 6px; max-height: 260px; overflow: auto; }
.lab-line { padding: 6px 10px; border-radius: 6px; background: var(--parch); font-size: 0.92rem; }
.lab-line.o-costly { box-shadow: inset 3px 0 0 var(--red); }
.lab-line.o-inconvenient { box-shadow: inset 3px 0 0 var(--orange); }
.lab-line.o-harmless { box-shadow: inset 3px 0 0 var(--green); }
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.tbl th, .tbl td { text-align: left; padding: 7px; border-bottom: 1px dashed var(--ink-3); vertical-align: top; }
.tbl thead th { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.tbl th { font-weight: 600; }
.tbl td { font-variant-numeric: tabular-nums; }
.lab-map-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
.lab-map-grid .map-wrap { border-radius: 8px; overflow: hidden; }
.lab-stage:empty { display: none; }
.lab-stage { scroll-margin-top: 20px; }
.mg-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.mg-card { display: grid; gap: 6px; align-content: start; }
.mg-card .btn { justify-self: start; }
.event-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
.ev { display: grid; gap: 6px; align-content: start; }
.ev.dim { opacity: .6; }
.ev-choices { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 0.88rem; }
.ev-choices li.dim { opacity: .5; }
.client-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.client-grid .panel { display: grid; gap: 8px; align-content: start; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 0.9rem; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; }
.dest-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.9rem; }
.cut-buttons { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Roadmap ---------- */
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
.phase { padding: 16px; display: grid; gap: 6px; align-content: start; }
.phase h3 { color: var(--navy); }
.phase.now { box-shadow: inset 0 0 0 2px var(--orange); }
.phase-tag { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.phase.now .phase-tag { color: var(--orange); }
.phase ul { margin: 4px 0 0; padding-left: 1.1em; display: grid; gap: 4px; font-size: 0.9rem; }
.roadmap-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.roadmap-cols .panel { display: grid; gap: 8px; align-content: start; }
.roadmap-cols h3 { color: var(--navy); }

/* =========================================================
   Mini-games
   ========================================================= */
.mg { display: grid; gap: 10px; color: var(--ink); }
.mg-stage { padding: 18px; }
.mg-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.mg-head-right { display: flex; gap: 10px; align-items: center; }
.mg-title { font-size: 1.5rem; font-weight: 700; color: var(--navy); }
.mg-status { font-size: 0.85rem; color: var(--ink-2); }
.mg-timer { height: 6px; background: var(--parch-3); border-radius: 3px; overflow: hidden; }
.mg-timer-fill { height: 100%; background: var(--route); transform-origin: left; }
.mg-timer-fill.low { background: var(--red); }
.mg-body { display: grid; gap: 10px; }
.mg-instr { font-size: 0.88rem; color: var(--ink-2); font-style: italic; }
.mg-feedback { min-height: 1.5em; font-size: 0.95rem; }
.mg-feedback.q-good { color: var(--green); }
.mg-feedback.q-bad { color: var(--red); }
.mg-feedback.q-ok { color: var(--tan); }
.mg-summary { gap: 10px; }
.mg-score { font-size: 2rem; font-weight: 700; display: flex; gap: 10px; align-items: baseline; color: var(--navy); }
.mg-headline { font-weight: 600; }
.mg-review { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 0.88rem; max-height: 220px; overflow: auto; }
.mg-review li { display: grid; grid-template-columns: 1.4em minmax(0, 1fr); }
.q-mark { font-weight: 700; }
.mg-review .q-good .q-mark { color: var(--green); }
.mg-review .q-bad .q-mark { color: var(--red); }
.mg-review .q-ok .q-mark { color: var(--tan); }
.mg-effects { display: grid; gap: 6px; }
.pitch-row { display: flex; justify-content: center; }
.btn.pitch { background: var(--orange); border-color: var(--ink); animation: wiggle 1.1s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg) scale(1.04); } }
.art-face, .art-figure { display: block; width: 100%; height: 100%; overflow: visible; }

/* ---------- HUD + feedback effects ---------- */
.fx-sound { font-size: 0.72rem; font-weight: 600; background: none; border: 1px solid var(--ink-3); border-radius: 999px; padding: 2px 10px; cursor: pointer; color: var(--ink-2); }
.fx-sound[aria-pressed="true"] { color: var(--green); border-color: var(--green); }
.mg-hud { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; }
.mg-hud:empty { display: none; }
.fx-counter { display: inline-flex; align-items: baseline; gap: 6px; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); }
.fx-counter strong { font-size: 1.4rem; font-weight: 700; color: var(--navy); display: inline-block; letter-spacing: 0; }
.fx-meter { display: inline-grid; grid-template-columns: auto minmax(90px, 150px) auto; gap: 8px; align-items: center; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); }
.fx-meter-track { height: 9px; border-radius: 5px; background: var(--parch-3); overflow: hidden; }
.fx-meter-fill { height: 100%; border-radius: 5px; transition: width .45s cubic-bezier(.3, 1.4, .5, 1); }
.fx-meter-fill.k-good { background: var(--energy); }
.fx-meter-fill.k-bad { background: var(--red); }
.fx-meter-fill.k-warn { background: var(--momentum); }
.fx-meter-num { font-size: 0.95rem; font-weight: 700; color: var(--ink); text-transform: none; letter-spacing: 0; display: inline-block; min-width: 3.5em; }
.fx-bump { animation: fxbump .35s ease-out; }
@keyframes fxbump { 40% { transform: scale(1.4); } }
.mg-stage-area { position: relative; }
.fx-pop { position: absolute; transform: translate(-50%, -50%); pointer-events: none; font-weight: 700; font-size: 1.15rem; white-space: nowrap; z-index: 20; animation: fxpop 1.15s ease-out forwards; text-shadow: 0 0 3px var(--fog), 0 0 3px var(--fog), 0 0 6px var(--fog); }
.fx-pop.k-good { color: var(--green); }
.fx-pop.k-great { color: #c26a00; font-size: 1.35rem; }
.fx-pop.k-bad { color: var(--red); }
.fx-pop.k-meh { color: var(--ink-2); }
@keyframes fxpop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.12); } 30% { transform: translate(-50%, -70%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -180%); } }
.fx-spark { position: absolute; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; z-index: 19; animation: fxspark .7s ease-out forwards; }
.fx-spark.k-good { background: var(--orange); }
.fx-spark.k-great { background: var(--orange); box-shadow: 0 0 0 2px var(--orange-2); }
.fx-spark.k-bad { background: var(--red); }
@keyframes fxspark { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
.fx-shake { animation: fxshake .45s ease-in-out; }
@keyframes fxshake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.fx-glow-good { animation: fxglowg .6s ease-out; }
.fx-glow-bad { animation: fxglowb .6s ease-out; }
.fx-glow-great { animation: fxglowy .6s ease-out; }
@keyframes fxglowg { 30% { box-shadow: 0 0 0 5px rgba(63, 122, 47, .4); } }
@keyframes fxglowb { 30% { box-shadow: 0 0 0 5px rgba(163, 50, 28, .4); } }
@keyframes fxglowy { 30% { box-shadow: 0 0 0 5px rgba(243, 156, 18, .55); } }
.fx-stamp { position: absolute; left: 50%; top: 42%; z-index: 25; pointer-events: none; font: 600 1.7rem var(--sans); padding: 2px 16px; border: 3px solid currentColor; border-radius: 8px; background: rgba(252, 246, 238, .9); transform: translate(-50%, -50%) rotate(-6deg); animation: fxstamp .9s ease-out forwards; white-space: nowrap; }
.fx-stamp.k-good { color: var(--green); }
.fx-stamp.k-bad { color: var(--red); }
.fx-stamp.k-meh { color: var(--tan); }
@keyframes fxstamp { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-6deg) scale(2); } 18% { opacity: 1; transform: translate(-50%, -50%) rotate(-6deg) scale(.96); } 28% { transform: translate(-50%, -50%) rotate(-6deg) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
.fx-ghost { position: absolute !important; z-index: 30; margin: 0 !important; pointer-events: none; transition: transform .45s cubic-bezier(.5, -0.2, .6, 1), opacity .45s; }
.chip-btn { font-weight: 600; font-size: 0.85rem; background: transparent; border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 12px; cursor: pointer; color: var(--ink); }
.chip-btn:hover { background: rgba(255, 255, 255, .6); }
.chip-btn.primary { background: var(--navy); color: var(--parch); border-color: var(--navy); }
.mx-choices { display: flex; flex-wrap: wrap; gap: 6px; }
.dd-icon { display: inline-block; width: 26px; height: 26px; }
.dd-icon svg { width: 100%; height: 100%; display: block; }

/* Big icon action buttons (Conversation, Inbox) */
.cv-acts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cv-act { position: relative; display: grid; justify-items: center; gap: 4px; padding: 12px 6px 10px; border: 1.5px solid var(--ink); border-radius: 10px; background: rgba(255, 255, 255, .35); cursor: pointer; font-weight: 600; font-size: 0.92rem; color: var(--ink); transition: background .12s, transform .06s; }
.cv-act:hover:not(:disabled) { background: rgba(255, 255, 255, .75); }
.cv-act:active:not(:disabled) { transform: translateY(2px); }
.cv-act:disabled { opacity: .45; cursor: default; }
.cv-act kbd { position: absolute; left: 6px; top: 4px; }
.cv-act .dd-icon { width: 30px; height: 30px; }
.a-ask .dd-icon, .a-call .dd-icon { color: var(--blue); }
.a-challenge .dd-icon, .a-verify .dd-icon { color: var(--red); }
.a-explain .dd-icon, .a-assistant .dd-icon { color: var(--tan); }
.a-listen .dd-icon, .a-handle .dd-icon { color: var(--green); }

/* ---------- Call-a-thon ---------- */
.ct-stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; min-height: 260px; }
.ct-phone { position: relative; background: var(--fog); border-radius: 16px; padding: 18px 16px; display: grid; justify-items: center; align-content: start; gap: 6px; text-align: center; }
.ct-handset { position: absolute; left: 14px; top: 14px; width: 28px; height: 28px; color: var(--green); }
.ct-handset svg { width: 100%; height: 100%; }
.ct-phone.ringing .ct-handset { animation: ring .2s linear infinite; }
@keyframes ring { 50% { transform: rotate(-12deg); } }
.ct-face { width: 104px; height: 104px; display: grid; place-items: center; }
.ct-dialing { width: 88px; height: 88px; border-radius: 50%; border: 2px dashed var(--ink-3); display: grid; place-items: center; font-weight: 700; font-size: 1.4rem; color: var(--ink-3); }
.ct-dialing.vm { border-style: solid; font-size: 1.1rem; }
.ct-who { font-weight: 600; font-size: 1.1rem; color: var(--navy); }
.ct-state { font-size: 0.88rem; color: var(--ink-2); }
.ct-bubble { position: relative; background: var(--parch); border-radius: 12px; padding: 8px 14px; font-style: italic; font-size: 1.05rem; color: var(--ink); animation: rise .25s ease-out; }
.ct-cal { background: var(--fog); border-radius: 12px; padding: 12px; display: grid; gap: 8px; align-content: start; }
.ct-cal-head { font-weight: 600; color: var(--navy); }
.ct-slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.ct-slot { position: relative; min-height: 38px; border: 1.5px dashed var(--ink-3); border-radius: 6px; padding: 2px 6px; font-size: 0.7rem; color: var(--ink-3); }
.ct-note { position: absolute; inset: 4px; background: var(--orange-2); border-radius: 3px; font-weight: 600; font-size: 0.82rem; color: var(--ink); display: grid; place-items: center; transform: rotate(-1.5deg); animation: noteIn .35s cubic-bezier(.3, 1.6, .5, 1); }
.ct-note.flying { position: relative; inset: auto; width: 110px; height: 32px; animation: none; }
@keyframes noteIn { from { transform: scale(1.5) rotate(6deg); opacity: 0; } }
.ct-answers { display: grid; gap: 6px; min-height: 120px; align-content: start; }
.ct-answer { text-align: left; font-style: italic; font-size: 1rem; background: rgba(255, 255, 255, .45); border: 0; border-radius: 14px 14px 14px 3px; padding: 8px 14px; cursor: pointer; color: var(--ink); }
.ct-answer b { font-style: normal; font-size: 0.78rem; color: var(--navy); margin-right: 6px; }
.ct-answer:hover:not(:disabled) { background: rgba(255, 255, 255, .85); }
.ct-answer:disabled { opacity: .45; }

/* ---------- Mixer ---------- */
.mx-room { height: 400px; border-radius: 12px; overflow: hidden; background: var(--parch-2); background-image: radial-gradient(rgba(74, 44, 18, .08) 1px, transparent 1.5px); background-size: 18px 18px; }
.mx-banner { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); color: var(--navy); font-weight: 600; font-style: italic; white-space: nowrap; z-index: 2; border-bottom: 3px dotted var(--route); padding-bottom: 2px; }
.mx-table { position: absolute; width: 72px; height: 72px; border-radius: 50%; background: var(--fog); box-shadow: inset 0 0 0 2px var(--ink); }
.mx-guest { position: absolute; width: 80px; height: 132px; background: none; border: 0; padding: 0; cursor: pointer; animation: bob 2.6s ease-in-out infinite; z-index: 3; display: grid; justify-items: center; }
.mx-guest .art-figure { height: 96px; width: 64px; }
.mx-guest:hover:not(.met) .art-figure, .mx-guest:focus-visible .art-figure { filter: drop-shadow(0 0 5px var(--orange)); }
.mx-guest.talking { z-index: 6; animation: none; transform: scale(1.1); }
.mx-guest.met { opacity: .4; cursor: default; animation: none; }
.mx-tag { display: grid; background: var(--fog); border-radius: 4px; font-size: 0.64rem; line-height: 1.15; padding: 2px 5px; color: var(--ink-2); text-align: center; box-shadow: 0 0 0 1px rgba(74, 44, 18, .3); }
.mx-tag b { font-size: 0.85rem; color: var(--ink); }
@keyframes bob { 50% { transform: translateY(-3px); } }
.mx-bubble { position: absolute; z-index: 10; width: min(330px, 70%); background: var(--fog); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; box-shadow: 0 0 0 1.5px var(--ink), 0 10px 20px -12px rgba(0, 0, 0, .5); animation: rise .2s ease-out; font-size: 0.92rem; }
.mx-holder { position: absolute; right: 12px; bottom: 12px; width: 70px; height: 50px; border-radius: 6px; background: var(--ink); color: var(--parch); font-size: 0.75rem; font-weight: 600; display: grid; place-items: start center; padding-top: 2px; z-index: 4; overflow: hidden; }
.mx-card-stack { position: absolute; bottom: 4px; left: 10px; right: 10px; height: 12px; background: var(--fog); border-radius: 2px; }
.mx-card-stack:nth-of-type(2) { bottom: 9px; } .mx-card-stack:nth-of-type(3) { bottom: 14px; } .mx-card-stack:nth-of-type(4) { bottom: 19px; }
.mx-card { position: absolute; left: 10px; top: 0; width: 62px; height: 34px; background: var(--fog); border-radius: 3px; font-size: 0.72rem; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 1.5px var(--ink); }
.mx-leave { position: absolute; left: 12px; bottom: 12px; z-index: 4; }

/* ---------- Farmers market ---------- */
.mk-lane { height: 310px; border-radius: 12px; overflow: hidden; background: linear-gradient(var(--meadow) 0 36%, var(--parch-2) 36% 100%); }
.mk-path { position: absolute; left: 0; right: 0; top: 66%; border-top: 4px dotted var(--route); opacity: .35; }
.mk-tent { position: absolute; top: 0; height: 36%; display: grid; align-content: start; justify-items: center; color: var(--fog); font-weight: 600; font-size: 0.85rem; z-index: 1; }
.mk-tent span { padding-top: 6px; }
.mk-tent.mine { left: 6%; width: 34%; background: repeating-linear-gradient(90deg, var(--navy) 0 22px, #22308f 22px 44px); clip-path: polygon(0 0, 100% 0, 100% 82%, 95% 100%, 90% 82%, 85% 100%, 80% 82%, 75% 100%, 70% 82%, 65% 100%, 60% 82%, 55% 100%, 50% 82%, 45% 100%, 40% 82%, 35% 100%, 30% 82%, 25% 100%, 20% 82%, 15% 100%, 10% 82%, 5% 100%, 0 82%); }
.mk-tent.rival { right: 0; width: 22%; background: repeating-linear-gradient(90deg, var(--red) 0 22px, #c4573e 22px 44px); }
.mk-tent .tube { position: absolute; bottom: -74px; left: 46%; width: 14px; height: 74px; background: #e86fa3; border-radius: 7px; transform-origin: bottom; animation: tube .55s ease-in-out infinite alternate; }
@keyframes tube { from { transform: rotate(-25deg); } to { transform: rotate(25deg) scaleY(.85); } }
.mk-table { position: absolute; bottom: -28px; width: 70%; height: 18px; background: #8a5a2e; border-radius: 2px; }
.mk-bowl { position: absolute; left: 50%; bottom: 12px; width: 44px; height: 38px; transform: translateX(-50%); border-radius: 40% 40% 50% 50%; background: rgba(207, 227, 247, .9); box-shadow: inset 0 0 0 2px var(--ink); overflow: hidden; }
.mk-slip-in { position: absolute; width: 11px; height: 6px; background: var(--fog); box-shadow: 0 0 0 1px var(--ink-2); }
.mk-slip { position: absolute; left: 20px; top: 0; width: 16px; height: 11px; background: var(--fog); box-shadow: 0 0 0 1px var(--ink); }
.mk-clip { position: absolute; right: 24%; top: 8px; width: 66px; height: 84px; background: var(--fog); border-radius: 4px; font-size: 0.72rem; font-weight: 600; color: var(--ink); display: grid; place-items: start center; z-index: 2; box-shadow: inset 0 12px 0 #8a5a2e, 0 0 0 1.5px var(--ink); padding-top: 14px; overflow: hidden; }
.mk-clip .mx-card-stack { left: 8px; right: 8px; height: 7px; background: var(--meadow); }
.mk-clip .mx-card-stack.cold { background: var(--water); }
.mk-walker { position: absolute; width: 84px; height: 126px; background: none; border: 0; padding: 0; cursor: pointer; display: grid; justify-items: center; z-index: 3; animation: bob .5s ease-in-out infinite; }
.mk-walker .art-figure { height: 90px; width: 60px; }
.mk-label { font-size: 0.64rem; line-height: 1.1; background: var(--fog); border-radius: 4px; padding: 1px 5px; color: var(--ink); box-shadow: 0 0 0 1px rgba(74, 44, 18, .3); }
.mk-walker:hover .art-figure { filter: drop-shadow(0 0 5px var(--orange)); }
.mk-walker.stopped { animation: none; z-index: 6; }
.mk-walker.chatting .art-figure { filter: drop-shadow(0 0 7px var(--green)); }
.mk-walker.leaving { opacity: 0; transition: opacity .5s; }
.mk-walker.to-rival { transition: transform .6s, opacity .6s; transform: translateY(-60px) scale(.7); opacity: 0; }
.mk-bubble { position: absolute; top: 4%; z-index: 10; background: var(--fog); border-radius: 12px; padding: 8px 12px; display: grid; gap: 6px; box-shadow: 0 0 0 1.5px var(--ink), 0 10px 20px -12px rgba(0, 0, 0, .5); animation: rise .2s ease-out; font-size: 0.92rem; }

/* ---------- Conversation ---------- */
.cv-stage { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; align-items: start; min-height: 220px; }
.cv-portrait { display: grid; justify-items: center; gap: 2px; text-align: center; }
.cv-portrait strong { font-weight: 600; font-size: 1.1rem; color: var(--navy); }
.cv-face { width: 150px; height: 150px; }
.cv-right { display: grid; gap: 8px; padding-right: 88px; }
.cv-speech { position: relative; min-height: 96px; background: var(--fog); border-radius: 16px; padding: 14px 18px; font-size: 1.15rem; font-style: italic; line-height: 1.4; color: var(--ink); }
.cv-speech::before { content: ""; position: absolute; left: -12px; top: 30px; border: 10px solid transparent; border-right-color: var(--fog); border-left: 0; }
.cv-speech.enter { animation: rise .25s ease-out; }
.cv-tag { font-size: 0.86rem; color: var(--ink-2); min-height: 1.3em; font-style: italic; }
.cv-notebook { position: absolute; right: 0; top: -4px; width: 72px; height: 56px; background: var(--navy); color: var(--parch); border-radius: 3px 8px 8px 3px; display: grid; place-items: center; font-size: 0.72rem; font-weight: 600; box-shadow: inset 6px 0 0 #22308f; }
.cv-notebook b { font-size: 1.3rem; }
.cv-fact { position: absolute; left: 30%; top: 40%; z-index: 12; background: var(--orange-2); border-radius: 4px; padding: 8px 12px; font-weight: 600; color: var(--ink); max-width: 60%; animation: noteIn .35s cubic-bezier(.3, 1.6, .5, 1); box-shadow: 0 0 0 1.5px var(--ink); }

/* ---------- Sorting desk (Shoebox Fact Find) ---------- */
.dd-desk { height: 410px; border-radius: 12px; background: #e8cba3; background-image: repeating-linear-gradient(0deg, rgba(74, 44, 18, .05) 0 2px, transparent 2px 24px); overflow: hidden; }
.dd-inbox { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font-weight: 600; font-style: italic; color: var(--ink-2); font-size: 0.85rem; }
.dd-pile { position: absolute; left: 0; right: 0; top: 66%; border-top: 2px dashed rgba(163, 50, 28, .55); font-size: 0.72rem; color: var(--red); padding: 2px 12px; text-align: right; font-style: italic; }
.dd-card { position: absolute; left: 50%; transform: translateX(-50%); width: min(380px, 86%); display: flex; gap: 12px; align-items: flex-start; background: var(--fog); border-radius: 6px; padding: 12px 14px; cursor: grab; touch-action: none; z-index: 5; box-shadow: 0 0 0 1.5px var(--ink), 0 10px 18px -12px rgba(0, 0, 0, .5); user-select: none; }
.dd-card.dragging { cursor: grabbing; z-index: 8; }
.dd-card.scanning::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; top: 0; background: var(--insight); animation: scan .6s linear infinite; }
@keyframes scan { to { top: 100%; } }
.dd-card.dropped { transition: transform .5s, opacity .5s; transform: translateX(-50%) translateY(60px) rotate(10deg); opacity: 0; }
.doc-icon { width: 34px; height: 42px; flex: none; border-radius: 2px 10px 2px 2px; background: repeating-linear-gradient(#fff 0 7px, var(--parch-3) 7px 8px); box-shadow: 0 0 0 1.5px var(--ink); }
.doc-name { font-weight: 600; }
.doc-meta { color: var(--ink-2); font-size: 0.88rem; margin-top: 2px; }
.dd-trays { position: absolute; left: 12px; right: 12px; bottom: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.dd-tray { position: relative; height: 92px; border: 0; border-radius: 8px; background: var(--fog); cursor: pointer; display: grid; justify-items: center; align-content: center; gap: 2px; font-weight: 600; font-size: 0.92rem; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink), inset 0 -14px 0 rgba(74, 44, 18, .08); }
.dd-tray kbd { position: absolute; left: 6px; top: 4px; }
.dd-tray .dd-count { position: absolute; right: 8px; top: 3px; color: var(--ink-2); }
.dd-tray.hover { transform: translateY(-4px); box-shadow: inset 0 0 0 1.5px var(--ink), 0 0 0 4px var(--orange); }
.t-ready { color: var(--green); } .t-update { color: var(--blue); } .t-ask { color: var(--tan); } .t-skip { color: var(--ink-3); }
.dd-tray span:not(.dd-icon):not(.dd-count) { color: var(--ink); }

/* ---------- Phone inbox (Monday Morning Inbox) ---------- */
.ff-stage { display: grid; grid-template-columns: 96px minmax(0, 340px) 96px; justify-content: center; gap: 16px; align-items: center; min-height: 310px; }
.ff-phone { position: relative; height: 310px; background: #283048; border-radius: 26px; padding: 26px 10px 12px; display: grid; grid-template-rows: auto 1fr; gap: 6px; overflow: hidden; box-shadow: 0 0 0 2px var(--ink); }
.ff-notch { position: absolute; left: 50%; top: 9px; width: 66px; height: 9px; transform: translateX(-50%); border-radius: 6px; background: #111; }
.ff-top { color: #cfd6e8; font-size: 0.72rem; font-weight: 600; text-align: center; }
.ff-thread { background: var(--fog); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; overflow: hidden; }
.ff-msg { background: #fff; border-radius: 14px 14px 14px 4px; padding: 8px 10px; transition: transform .4s, opacity .4s; box-shadow: 0 0 0 1px rgba(74, 44, 18, .2); }
.ff-msg.enter { animation: slidein .3s ease-out; }
@keyframes slidein { from { transform: translateX(22px); opacity: 0; } to { transform: none; opacity: 1; } }
.ff-msg.sent { background: var(--meadow); }
.ff-msg.gone, .ff-msg.ignored { opacity: .25; }
.ff-from { font-size: 0.78rem; font-weight: 700; color: var(--ink); }
.ff-body { font-size: 0.95rem; color: var(--ink); }
.ff-verify { margin-top: 6px; background: var(--water); border-radius: 6px; padding: 4px 8px; font-size: 0.84rem; }
.ff-calling { position: absolute; inset: 26px 10px 12px; border-radius: 14px; background: rgba(0, 10, 98, .9); color: #fff; display: grid; place-items: center; font-weight: 600; z-index: 3; }
.ff-bin { height: 92px; border: 2px dashed var(--ink-3); border-radius: 12px; display: grid; place-items: center; align-content: center; gap: 2px; font-weight: 600; font-size: 0.85rem; color: var(--ink-2); text-align: center; }
.ff-bin .dd-icon { width: 30px; height: 30px; }
.ff-bin.cal { color: var(--blue); } .ff-bin.asst { color: var(--tan); }
.msg-ch { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; background: var(--navy); color: var(--parch); padding: 1px 6px; border-radius: 3px; }

/* ---------- Calendar Tetris ---------- */
.cal-stage { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 16px; align-items: start; }
.cal-grid { position: relative; display: grid; grid-template-columns: 44px repeat(5, minmax(0, 1fr)); background: var(--fog); border-radius: 12px; padding: 8px; user-select: none; }
.cal-dayhead { text-align: center; font-weight: 600; font-size: 0.82rem; color: var(--navy); padding: 4px 0 6px; }
.cal-hour { font-size: 0.7rem; color: var(--ink-3); text-align: right; padding-right: 6px; height: var(--row); line-height: var(--row); }
.cal-col { position: relative; border-left: 1px dashed rgba(74, 44, 18, .2); cursor: pointer; }
.cal-col.aim { background: rgba(243, 156, 18, .12); }
.cal-col .cal-line { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(74, 44, 18, .12); }
.cal-block { position: absolute; left: 4px; right: 4px; border-radius: 6px; padding: 3px 6px; font-size: 0.74rem; font-weight: 600; line-height: 1.15; color: var(--ink); overflow: hidden; box-shadow: 0 0 0 1.5px var(--ink); }
.cal-block small { display: block; font-weight: 400; font-size: 0.66rem; color: var(--ink-2); }
.cal-block.falling { z-index: 4; transition: left .08s; }
.cal-block.landed { animation: land .25s ease-out; }
@keyframes land { 40% { transform: scaleY(.9) translateY(3px); } }
.cal-block.b-client { background: var(--water); }
.cal-block.b-prep { background: #e3ecf8; }
.cal-block.b-prospect { background: var(--orange-2); }
.cal-block.b-review { background: var(--meadow); }
.cal-block.b-admin { background: var(--parch-3); }
.cal-block.b-family { background: #f2cfc4; }
.cal-block.b-specialist { background: #ddd2ee; }
.cal-block.missed { opacity: .4; text-decoration: line-through; }
.cal-side { display: grid; gap: 10px; align-content: start; }
.cal-next { background: var(--parch-2); border-radius: 10px; padding: 10px; display: grid; gap: 6px; }
.cal-next .cal-block { position: relative; left: auto; right: auto; }
.cal-rules { font-size: 0.8rem; color: var(--ink-2); display: grid; gap: 4px; }
.cal-controls { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Life Happens ---------- */
.lh-town { height: 380px; border-radius: 12px; overflow: hidden; background: var(--meadow); background-image: linear-gradient(90deg, transparent 0 32%, var(--parch-2) 32% 35%, transparent 35% 66%, var(--parch-2) 66% 69%, transparent 69%), linear-gradient(transparent 0 46%, var(--parch-2) 46% 52%, transparent 52%); }
.lh-house { position: absolute; width: 96px; display: grid; justify-items: center; gap: 2px; }
.lh-house svg { width: 64px; height: 56px; }
.lh-house .lh-name { font-size: 0.72rem; font-weight: 600; background: var(--fog); padding: 0 6px; border-radius: 3px; }
.lh-badge { position: absolute; bottom: 76px; left: 50%; transform: translateX(-50%); min-width: 116px; max-width: 150px; background: var(--fog); border-radius: 10px; padding: 5px 8px; font-size: 0.75rem; font-weight: 600; line-height: 1.2; text-align: center; cursor: pointer; border: 0; color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink), 0 6px 12px -8px rgba(0, 0, 0, .6); animation: badgeIn .3s cubic-bezier(.3, 1.6, .5, 1); z-index: 5; }
.lh-badge::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -6px; border: 6px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
.lh-badge .lh-life { display: block; height: 4px; margin-top: 4px; border-radius: 2px; background: var(--orange); transform-origin: left; }
.lh-badge.urgent { background: #f6d6cc; }
.lh-badge.urgent .lh-life { background: var(--red); }
@keyframes badgeIn { from { transform: translateX(-50%) scale(.3); opacity: 0; } }
.lh-pick { position: absolute; z-index: 12; background: var(--fog); border-radius: 12px; padding: 8px; display: grid; gap: 6px; box-shadow: 0 0 0 1.5px var(--ink), 0 10px 20px -12px rgba(0, 0, 0, .5); min-width: 170px; animation: rise .15s ease-out; }
.lh-pick p { font-size: 0.8rem; font-weight: 600; }

/* ---------- Responsive ---------- */
@media (max-width: 1000px) {
  .trail-grid, .port-grid, .lab-map-grid { grid-template-columns: minmax(0, 1fr); }
  .trail-side, .port-side { position: static; }
  .lab-cols, .client-grid, .roadmap-cols { grid-template-columns: minmax(0, 1fr); }
  .intro { grid-template-columns: minmax(0, 1fr); }
  .toast { bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); }
}
@media (max-width: 640px) {
  .view { padding: 22px 16px 24px; }
  .view::before { inset: 6px; }
  .ending-grid, .lab-cols.two, .build-grid { grid-template-columns: minmax(0, 1fr); }
  .ladder li span { display: none; }
  .ledger .gauges { grid-template-columns: 1fr 1fr; }
  .trail-canvas { aspect-ratio: 2.2 / 1; object-fit: cover; }
  .tagline { display: none; }
  .ct-stage, .cv-stage, .cal-stage { grid-template-columns: minmax(0, 1fr); }
  .cv-portrait { grid-template-columns: 90px auto; justify-items: start; align-items: center; text-align: left; }
  .cv-face { width: 90px; height: 90px; grid-row: span 2; }
  .cv-right { padding-right: 0; }
  .cv-speech::before { display: none; }
  .cv-acts, .dd-trays { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dd-desk { height: 480px; }

<script>
/* Port Prospect — engine core
 * State model, resource effects, risk debt, and small helpers.
 * Everything hangs off one global (window.PP) so the game runs from
 * plain <script> tags: GitHub Pages, a local double-click, or a single bundled file.
 */
window.PP = window.PP || {};
(function (PP) {
  PP.content = PP.content || {};
  PP.minigames = PP.minigames || {};
  PP.ui = PP.ui || {};

  /* ---------- Constants ---------- */
  PP.RES = [
    { id: 'trust', label: 'Trust', blurb: 'Does the client believe you understand them and are acting in their interest?' },
    { id: 'momentum', label: 'Momentum', blurb: 'Is the process moving forward, or stalled under delay and complexity?' },
    { id: 'energy', label: 'Energy', blurb: 'How much capacity you have left to keep solving problems.' },
    { id: 'insight', label: 'Insight', blurb: "How well you understand the client's real situation, priorities and constraints." }
  ];
  PP.MAX = 10;

  PP.SKILLS = [
    { id: 'curiosity', label: 'Curiosity', blurb: 'Unlocks better follow-up questions and exposes hidden motivations.' },
    { id: 'preparation', label: 'Preparation', blurb: 'More time in mini-games; softens risk-debt checks.' },
    { id: 'communication', label: 'Communication', blurb: 'Hard conversations go better; easier recovery from misunderstandings.' },
    { id: 'navigation', label: 'Navigation', blurb: 'Reveals names of nearby places through the fog.' },
    { id: 'resourcefulness', label: 'Resourcefulness', blurb: 'One extra contact slot, and each contact can help one extra time.' },
    { id: 'judgment', label: 'Judgment', blurb: 'Shows hints about likely tradeoffs, and a gut feeling about risk debt.' }
  ];

  PP.STYLE = [
    { id: 'avoid', label: 'Avoids hard questions', place: 'Fog of Forgotten Information expands' },
    { id: 'overcomplicate', label: 'Overcomplicates', place: 'Spreadsheet Swamp grows' },
    { id: 'soloist', label: 'Refuses help', place: 'Specialist Summit ices over' },
    { id: 'chase', label: 'Chases every new priority', place: 'Shifting Sands spread' }
  ];

  /* ---------- Small helpers ---------- */
  PP.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  PP.rand = () => Math.random();
  PP.chance = (p) => Math.random() < p;
  PP.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  PP.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  PP.uid = (() => { let n = 0; return (p = 'id') => p + '_' + (++n) + '_' + Math.floor(Math.random() * 1e4); })();
  PP.val = (v, ...args) => (typeof v === 'function' ? v(...args) : v);

  /* Tiny DOM builder: PP.h('div', {class:'x', onclick: fn}, 'text', childNode, [more]) */
  PP.h = function (tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'class') el.className = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'style' && typeof v === 'object') { for (const sk in v) { if (sk.startsWith('--')) el.style.setProperty(sk, v[sk]); else el.style[sk] = v[sk]; } }
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    const add = (c) => {
      if (c == null || c === false) return;
      if (Array.isArray(c)) c.forEach(add);
      else el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    };
    kids.forEach(add);
    return el;
  };

  PP.store = {
    get(k, d) { try { const v = localStorage.getItem('pp:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('pp:' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };

  /* ---------- State ---------- */
  PP.newState = function () {
    return {
      phase: 'port',               // port -> journey -> end
      res: { trust: 5, momentum: 6, energy: 8, insight: 1 },
      skills: { curiosity: 0, preparation: 0, communication: 0, navigation: 0, resourcefulness: 0, judgment: 0 },
      contacts: [],                // active contact ids (limited slots)
      contactUses: {},             // id -> uses left this journey
      met: {},                     // npc id -> true
      quests: {},                  // quest id -> 'done' | 'failed'
      pack: [],                    // item ids
      usedItems: {},
      portActions: 0,
      client: null,                // client definition (from content)
      facts: {},                   // fact id -> turn learned
      missed: {},                  // fact id -> where it slipped past
      debt: [],                    // hidden risk debt
      settled: [],                 // debts that came due, with outcome
      style: { avoid: 0, overcomplicate: 0, soloist: 0, chase: 0 },
      map: { current: 'port', visited: { port: true }, named: {}, beam: false, extraEdges: [] },
      trail: ['port'],
      skepticActive: false,
      day: 1,                      // calendar day of the journey
      pace: 'steady',              // steady | brisk | breakneck
      at: 'port',                  // landmark you are at, or null while on a trail
      seg: null,                   // { from, to, left, total } while traveling
      walked: [],                  // trails traveled, as 'a|b'
      password: PP.store.get('password', false), // Steve's password carries over between runs
      askedTopics: {},             // check-in topics already asked
      lastCheckin: 0,
      talked: {},                  // landmark people already talked to
      seenCuts: {},
      seenEvents: {},
      passageTaken: {},
      faced: {},
      turn: 0,
      log: [],
      ending: null
    };
  };

  PP.skill = (s, id) => s.skills[id] || 0;
  PP.knows = (s, fact) => !!fact && s.facts[fact] != null;
  PP.hasItem = (s, id) => s.pack.includes(id) && !s.usedItems[id];
  PP.useItem = (s, id) => { s.usedItems[id] = true; };
  PP.contactSlots = (s) => 2 + (PP.skill(s, 'resourcefulness') > 0 ? 1 : 0);
  PP.contactReady = (s, id) => s.contacts.includes(id) && (s.contactUses[id] || 0) > 0;
  PP.useContact = (s, id) => { s.contactUses[id] = Math.max(0, (s.contactUses[id] || 0) - 1); };
  PP.clientName = (s) => (s.client ? s.client.name : 'the client');

  PP.log = function (s, text, kind) {
    s.log.push({ turn: s.turn, where: s.map.current, text, kind: kind || 'note' });
  };

  /* ---------- Effects ----------
   * An effect object can carry:
   *  trust/momentum/energy/insight: number deltas
   *  debt: {tag, sev} or [..]   -> silently recorded risk debt
   *  clearDebt: tag             -> pay down a debt without a check
   *  fact: id or [ids]          -> learn about the client (ignored if the client has no such fact)
   *  missed: id                 -> a fact slipped past (can resurface later)
   *  style: {avoid:1, ...}      -> working-style counters that reshape the map
   *  skill: {curiosity:1}
   *  reveal: true               -> lift fog labels across the map
   * Returns a list of visible changes for toasts. Debt is never reported.
   */
  PP.apply = function (s, eff, source) {
    const notes = [];
    if (!eff) return notes;
    eff = PP.val(eff, s);
    PP.RES.forEach(({ id }) => {
      if (eff[id]) {
        const before = s.res[id];
        s.res[id] = PP.clamp(s.res[id] + eff[id], 0, PP.MAX);
        const d = s.res[id] - before;
        if (d) notes.push({ kind: id, delta: d });
      }
    });
    if (eff.debt) [].concat(eff.debt).forEach((d) => PP.addDebt(s, d.tag, d.sev, source));
    if (eff.clearDebt) s.debt = s.debt.filter((d) => d.tag !== eff.clearDebt);
    if (eff.fact) [].concat(eff.fact).forEach((f) => { if (PP.learn(s, f)) notes.push({ kind: 'fact', fact: f }); });
    if (eff.missed && s.client && s.client.facts[eff.missed] && !s.facts[eff.missed]) s.missed[eff.missed] = s.map.current;
    if (eff.style) for (const k in eff.style) s.style[k] = Math.max(0, (s.style[k] || 0) + eff.style[k]);
    if (eff.skill) for (const k in eff.skill) {
      s.skills[k] = PP.clamp((s.skills[k] || 0) + eff.skill[k], 0, 2);
      notes.push({ kind: 'skill', skill: k });
    }
    if (eff.reveal) { s.map.beam = true; notes.push({ kind: 'reveal' }); }
    if (eff.item && !s.pack.includes(eff.item)) { s.pack.push(eff.item); notes.push({ kind: 'item', item: eff.item }); }
    if (eff.password) { s.password = true; PP.store.set('password', true); }
    if (eff.days) { s.day += eff.days; s.turn += eff.days; if (s.career && PP.career) for (let i = 0; i < eff.days; i++) PP.career.tickDay(s.career, true); notes.push({ kind: 'days', days: eff.days }); }
    if (eff.pace) s.pace = eff.pace;
    if (eff.prospect && s.career && PP.career) { const pr = PP.career.addProspect(s.career, eff.prospect); notes.push({ kind: 'prospect', name: pr.name }); }
    if (eff.poached) s.poached = eff.poached;
    if (eff.cash && s.career) { s.career.savings += eff.cash; notes.push({ kind: 'cash', delta: eff.cash }); }
    return notes;
  };

  PP.learn = function (s, fact) {
    if (!s.client || !s.client.facts[fact] || s.facts[fact] != null) return false;
    s.facts[fact] = s.turn;
    delete s.missed[fact];
    PP.log(s, 'Learned: ' + s.client.facts[fact].label, 'fact');
    return true;
  };

  /* ---------- Risk debt ----------
   * Shortcuts add debt silently. A few turns later a check event rolls it:
   * harmless, inconvenient, or costly. Severity (1-3) shifts the odds.
   */
  PP.addDebt = function (s, tag, sev, source) {
    const existing = s.debt.find((d) => d.tag === tag);
    if (existing) { existing.sev = PP.clamp(existing.sev + 1, 1, 3); return; }
    s.debt.push({ id: PP.uid('debt'), tag, sev: PP.clamp(sev || 1, 1, 3), turn: s.turn, where: s.map.current, source: source || '' });
  };

  PP.debtOdds = function (s, d) {
    const sev = PP.clamp(d.sev - (PP.skill(s, 'preparation') >= 2 ? 1 : 0), 0, 3);
    const costly = [0.05, 0.2, 0.4, 0.6][sev];
    const incon = [0.25, 0.35, 0.35, 0.3][sev];
    return { harmless: +(1 - costly - incon).toFixed(2), inconvenient: incon, costly };
  };

  PP.rollDebt = function (s, d) {
    const o = PP.debtOdds(s, d);
    const r = Math.random();
    if (r < o.costly) return 'costly';
    if (r < o.costly + o.inconvenient) return 'inconvenient';
    return 'harmless';
  };

  /* A debt is "due" once it has aged (turns = days on the trail).
   * After DEBT_MIN_AGE it may surface each day; by DEBT_MAX_AGE it always does. */
  PP.DEBT_MIN_AGE = 3;
  PP.DEBT_MAX_AGE = 8;
  PP.DEBT_DAILY_CHANCE = 0.3;
  PP.dueDebt = function (s) {
    const due = s.debt.filter((d) => s.turn - d.turn >= PP.DEBT_MIN_AGE);
    if (!due.length) return null;
    const oldest = due.sort((a, b) => a.turn - b.turn)[0];
    const age = s.turn - oldest.turn;
    return PP.chance(age >= PP.DEBT_MAX_AGE ? 1 : PP.DEBT_DAILY_CHANCE) ? oldest : null;
  };

  PP.settleDebt = function (s, d, outcome, how) {
    s.debt = s.debt.filter((x) => x.id !== d.id);
    s.settled.push(Object.assign({}, d, { outcome, how: how || 'came due', at: s.map.current, dueTurn: s.turn }));
  };

  /* Judgment gives a vague gut feeling about how much is hidden. */
  PP.gutFeeling = function (s) {
    const j = PP.skill(s, 'judgment');
    if (!j) return null;
    const weight = s.debt.reduce((a, d) => a + d.sev, 0);
    if (j >= 2) return weight === 0 ? 'Nothing nagging you.' : `${s.debt.length} thing${s.debt.length > 1 ? 's' : ''} you glossed over. ${weight >= 5 ? 'It feels heavy.' : ''}`.trim();
    if (weight === 0) return 'Calm waters, as far as you can tell.';
    if (weight <= 2) return 'Something small is nagging you.';
    if (weight <= 5) return 'You have an uneasy feeling about earlier shortcuts.';
    return 'Your gut is shouting. Something is going to come back.';
  };
})(window.PP);
