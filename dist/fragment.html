              { label: 'Keep it light and move on', kind: 'around', eff: { trust: 1 }, result: 'They seem relieved to step back into the light.' }
            ] } },
        { label: 'Leave that tunnel for another day', kind: 'around', eff: { trust: 1, debt: { tag: 'guessed_key', sev: 1 }, style: { avoid: 1 } }, result: 'Easier today. The tunnel will still be there, and so will whatever is in it.' }
      ]
    },

    /* ================= Specialist Summit ================= */
    {
      id: 'summit_waiting', title: 'Allow 3-5 business days', at: ['summit'],
      text: (s) => `You sent your question up the mountain. It is day four. ${C(s)} has asked twice whether there is any news. A sign at base camp reads: "Your request is in the queue. Your position in the queue is: yes."`,
      choices: [
        { label: 'Send a polite follow-up', kind: 'prepare', preview: '50% it nudges things along. 50% it goes to the back of the queue.',
          eff: () => (roll('wait', 0.5) ? { days: 1, insight: 1 } : { days: 2, momentum: -1 }),
          result: () => (R.wait ? 'A reply the next morning: "Thanks for the nudge, just finishing it now."' : 'An auto-reply: "Your follow-up has been received and added to the queue." Hmm.') },
        { label: 'Make your best guess and keep moving', kind: 'through', hint: 'Fast. If you guessed right, nobody will ever know.', eff: { momentum: 2, debt: { tag: 'guessed_key', sev: 2 } }, result: 'You fill in the gap yourself. The answer, when it comes, may or may not match.' },
        { label: 'Use the wait to sit down with the client', kind: 'prepare', eff: { days: 1, trust: 1 },
          then: { text: (s) => `With nothing to do but wait, you and ${C(s)} actually talk. Not about the plan. At some point they say, "Can I ask you something I've been embarrassed to ask?"`,
            choices: [
              { label: '"Of course."', kind: 'prepare', eff: (s) => { R.sw = unknown(s); return R.sw ? { insight: 2, trust: 1, fact: R.sw } : { insight: 1, trust: 1 }; }, result: (s) => (R.sw ? `It is a simple question, and the answer matters to them. Along the way, you learn about ${label(s, R.sw)}.` : 'It is a simple question. You answer it simply. They look relieved.') },
              { label: '"Can it wait until we hear back?"', kind: 'through', eff: { momentum: 1, trust: -1 }, result: '"Sure," they say. They do not ask again.' }
            ] } },
        { label: 'Ask Dev to nudge the queue', kind: 'help', contact: 'specialist', show: ready('specialist'), eff: { momentum: 1, insight: 1 }, result: 'Dev knows someone. The answer comes down the mountain by lunch.' }
      ]
    },
    {
      id: 'summit_one_more_doc', title: 'Just one more document', at: ['summit'],
      text: (s) => `The Specialist needs one more document before they can finish. Just last year's statement. ${C(s)} sends it. Then the Specialist needs the year before. And a signed letter. And "the other thing."`,
      choices: [
        { label: 'Ask the client for each one as it comes up', kind: 'around', eff: { trust: -1, days: 1, insight: 1 }, result: (s) => `${C(s)}, on the fourth request: "Is there a list? Could there have been a list?"` },
        { label: 'Push back: ask for everything in one list', kind: 'prepare',
          then: { text: 'The Specialist pauses. "Fair. Honestly, I didn\'t know what I\'d need until I saw the first one." They send a list. It is seven items long. One of them is "explain item 3."',
            choices: [
              { label: 'Go through the list with the client in one sitting', kind: 'prepare', eff: { energy: -1, momentum: 1, trust: 1, insight: 1 }, result: 'One call, seven items, done. Item 3 turns out to be a typo.' },
              { label: 'Send the client the list and let them sort it', kind: 'through', eff: { momentum: 1, debt: { tag: 'confused_client', sev: 1 } }, result: (s) => `${C(s)} gets the list. They understand four items. They send six. Close enough?` },
              { label: 'Bring Dev in to translate the list', kind: 'help', contact: 'specialist', show: ready('specialist'), eff: { momentum: 1, insight: 2 }, result: 'Dev rewrites the list in plain words. The client sends everything in an afternoon.' }
            ] } },
        { label: 'Send everything you have, all at once', kind: 'through', eff: { momentum: 1, debt: { tag: 'bad_handoff', sev: 1 } }, result: '"Please find attached: everything." You can hear the Specialist sigh through the email.' }
      ]
    },
    {
      id: 'summit_disagree', title: 'Two experts, two answers', at: ['summit'],
      text: (s) => `Two specialists look at ${C(s)}'s situation. They disagree. Both are very sure. Both are very senior. Both are looking at you.`,
      choices: [
        { label: 'Go with the more senior one', kind: 'through', hint: 'Rank is not the same as fit.', eff: { momentum: 1, debt: { tag: 'guessed_key', sev: 1 } }, result: 'Seniority wins. The other one shrugs. "Your call."' },
        { label: 'Ask each: "What would change your mind?"', kind: 'prepare',
          then: { text: 'It turns out they are not really disagreeing. Each one is assuming something different about the client\'s life. One assumes nothing big is about to change. The other assumes something is.',
            choices: [
              { label: 'Check with the client which is true', kind: 'prepare', eff: (s) => ({ momentum: -1, insight: 2, trust: 1, fact: s.client.keyFact }), result: (s) => `You ask ${C(s)} directly. Their answer settles it: ${label(s, s.client.keyFact)}.` },
              { label: 'Pick the assumption that seems likelier', kind: 'through', eff: (s) => (K(s, s.client.keyFact) ? { momentum: 1, insight: 1 } : { momentum: 1, debt: { tag: 'guessed_key', sev: 2 } }), result: (s) => (K(s, s.client.keyFact) ? 'You already know which one is true. Settled in a sentence.' : 'You pick. It seems likely. "Seems likely" is doing a lot of work.') }
            ] } },
        { label: 'Put the client in the room with both', kind: 'around', preview: 'With Communication, 70% it clarifies things. Otherwise more likely to leave the client confused.',
          eff: (s) => (roll('dis', comm(s) ? 0.7 : 0.4) ? { trust: 1, insight: 2, energy: -1 } : { insight: 1, energy: -1, debt: { tag: 'confused_client', sev: 2 } }),
          result: (s) => (R.dis ? `${C(s)} hears both sides and asks the one question that settles it. Brilliant.` : `${C(s)} leaves the room more confused than they came in. "So... nobody knows?"`) }
      ]
    },

    /* ================= The Login Isles ================= */
    {
      id: 'isles_two_factor', title: 'The code went to the old phone', at: ['isles'],
      text: (s) => `${C(s)} needs to approve something in the portal. The security code has been sent to their old phone. Their old phone is, they explain, at the bottom of a lake.`,
      choices: [
        { label: 'Walk them through account recovery', kind: 'prepare', eff: { energy: -2, days: 1, trust: 1 }, result: 'A day of security questions, ID photos and hold music. Then: access. Real, proper, secure access.' },
        { label: '"Just read me your password and I\'ll sort it"', kind: 'through', hint: 'So much faster. So much worse.', eff: { momentum: 2, debt: { tag: 'fraud', sev: 2 } }, result: 'You have their password now. It is their pet\'s name and 123. You try not to think about that.' },
        { label: 'Switch to paper for this one', kind: 'around', eff: { days: 2, momentum: -1 }, result: 'The paper form arrives in two days. The lake keeps the phone.' },
        { label: 'Call Kenji', kind: 'help', contact: 'whisperer', show: ready('whisperer'), eff: { momentum: 1, trust: 1 }, result: 'Kenji resets it in four minutes and says, "Never again with the lake."' },
        { label: 'Your tech setup has a backup method', kind: 'help', show: (s) => hasSys(s, 'tech'), eff: { momentum: 1, trust: 1 }, result: 'A verified backup method, set up months ago for exactly this. In you go.' }

    },

        { label: 'Check it together, carefully', kind: 'prepare',

            choices: [
              { label: 'Agree on how to check it is really you', kind: 'prepare', eff: { trust: 2, energy: -1, insight: 1 }, result: 'Anything urgent gets a phone call, on the number they already have. They write it on a sticky note and look calmer.' },
              { label: 'Report it to Operations and move on', kind: 'around', eff: { momentum: -1, insight: 1 }, result: 'Operations thanks you and sends a warning memo to everyone. The memo looks a bit like a scam too.' }
            ] } },
        { label: '"Just ignore it, it\'s nothing"', kind: 'through', hint: 'Probably nothing. They may get another one.', eff: { momentum: 1, debt: { tag: 'fraud', sev: 2 } }, result: (s) => `${C(s)} deletes it. Next week there is another one, slightly more convincing.` },
        { label: 'Tell them to change every password, today', kind: 'around', eff: { days: 1, trust: -1, insight: 1 }, result: 'They change everything. Then they are locked out of everything. Safe, at least. Grumpy, definitely.' },
        { label: 'Forward it to Kenji', kind: 'help', contact: 'whisperer', show: ready('whisperer'), eff: { insight: 1, trust: 1 }, result: 'Kenji blocks the sender, finds two more, and sends your client a one-line guide: "The real one never says urgent."' }
      ]
    },
    {
      id: 'isles_portals', title: 'Fourteen portals', at: ['isles'], cut: 'isles',
      text: (s) => `${C(s)} has accounts in fourteen different places. Each has its own portal, its own password, and its own idea of what a "statement" is. They would like you to just see everything, in one place, please.`,
      choices: [
        { label: 'Have them put every login in a shared document', kind: 'through', hint: 'Convenient. Very, very convenient.', eff: { momentum: 2, debt: { tag: 'fraud', sev: 2 } }, result: 'One document. Fourteen passwords. Shared with you, and possibly their book club.' },
        { label: 'Sit together and go through each portal', kind: 'prepare', eff: (s) => { R.por = unknown(s); return { energy: -2, insight: 2, fact: R.por }; }, result: (s) => 'Fourteen logins, three password resets, and one forgotten account with money in it.' + (R.por ? ` Along the way, you learn about ${label(s, R.por)}.` : '') },
        { label: 'Ask them to download statements and send them over', kind: 'around', preview: 'They arrive in a day. Half the time, some are from the wrong year (hidden risk).',
          eff: () => (roll('port', 0.5) ? { days: 1, insight: 1 } : { days: 1, insight: 1, debt: { tag: 'stale_info', sev: 1 } }),
          result: 'A pile of files arrives, named "download (1)" through "download (14)".' },
        { label: 'Focus on the three biggest, skip the rest', kind: 'through', eff: { momentum: 1, insight: 1, debt: { tag: 'stale_info', sev: 1 } }, result: 'Three portals, done by lunch. The other eleven wait, quietly collecting surprises.' }
      ]
    },

    /* ================= Annual Review Toll Bridge ================= */
    {
      id: 'toll_initials', title: 'Initial here, here, and here', at: ['toll'],
      text: (s) => `The troll slides a stack of forms across the counter. Thirty-seven places to initial. ${C(s)} picks up the pen, then stops. "What am I actually signing?"`,
      choices: [
        { label: '"Standard stuff, don\'t worry about it"', kind: 'through', eff: { momentum: 2, debt: { tag: 'confused_client', sev: 2 } }, result: 'Thirty-seven initials in four minutes. Impressive wrist work. No idea what any of it says.' },
        { label: 'Explain every page', kind: 'prepare', eff: { energy: -2, days: 1, trust: 2 }, result: 'Every page, every initial. It takes all day. The troll follows along like it is a good film.' },
        { label: 'Explain the three pages that actually matter', kind: 'prepare', show: (s) => comm(s) || PP.skill(s, 'judgment') > 0, hint: 'Communication or Judgment: you know which three.', eff: { trust: 1, momentum: 1, insight: 1 }, result: '"These three matter. The rest are about the bridge." They read the three. They ask one good question.' },
        { label: 'Give them a day to read it all', kind: 'around', eff: (s) => ({ days: 1, momentum: -1, trust: s.client.prefers === 'email' ? 2 : 1 }), result: (s) => (s.client.prefers === 'email' ? 'They read every page, with notes. You get one email with nine excellent questions.' : 'They read some of it. They feel respected, which matters more.') }
      ]
    },
    {
      id: 'toll_anything_changed', title: '"Has anything changed?"', at: ['toll'],

      choices: [
        { label: 'Accept "nope" and move along', kind: 'through', eff: { momentum: 1, debt: { tag: 'stale_info', sev: 2 } }, result: '"Nope" goes on the form. The troll stamps it.' },
        { label: 'Ask three specific questions instead', kind: 'prepare',
          then: { text: (s) => `"Anything new at work? At home? Anyone new depending on you?" ${C(s)} pauses on the second one. "Well... apart from..." And out comes a thing they had not thought of as a change.`,
            choices: [
              { label: 'Follow it up properly', kind: 'prepare', eff: (s) => { R.chg = unknown(s); return R.chg ? { insight: 2, trust: 1, fact: R.chg, energy: -1 } : { insight: 1, trust: 1 }; }, result: (s) => (R.chg ? `It is a change. A real one: ${label(s, R.chg)}.` : 'It is a small change, and you already knew about it. Still, they feel listened to.') },
              { label: 'Note it and keep the review short', kind: 'around', eff: { insight: 1, momentum: 1 }, result: 'Noted. You will come back to it. You have written that before.' }
            ] } },
        { label: 'Mention what you already know has changed', kind: 'prepare', show: (s) => K(s, s.client.keyFact), hint: 'You did the work earlier. Now it pays.', eff: { trust: 2, momentum: 1 }, result: (s) => `"Well, there's ${label(s, s.client.keyFact)}." ${C(s)} blinks. "Oh. Right. I guess that counts." The troll looks impressed.` }
      ]
    },
    {
      id: 'toll_wrong_date', title: 'The date is wrong', at: ['toll'],
      text: 'The troll taps one page with a long fingernail. "This form is dated last month. The rules say within thirty days of today. It is thirty-four." There is a pen right there.',
      choices: [
        { label: 'Just change the date', kind: 'through', hint: 'Four days. Who would ever know?', eff: { momentum: 1, debt: { tag: 'rushed_pace', sev: 3 } }, result: 'You change it. The troll happens to be looking the other way. Somebody, someday, will not be.' },
        { label: 'Redo the form with the client', kind: 'prepare', eff: (s) => ({ days: 1, energy: -1, trust: s.res.trust >= 5 ? 1 : 0 }), result: (s) => `${C(s)} signs a fresh copy. "Thanks for doing it properly," they say, and seem to mean it.` },
        { label: 'Argue with the troll', kind: 'around', preview: '30% the troll lets it go. 70% you lose a day and look a bit silly.',
          eff: () => (roll('date', 0.3) ? { momentum: 1 } : { days: 1, trust: -1 }),
          result: () => (R.date ? '"Fine," says the troll. "Thirty-four is close to thirty. Don\'t tell anyone."' : 'The troll listens to your whole argument, then points at the rule again. Your client watched the entire thing.') },
        { label: 'Ask Olu to sort it', kind: 'help', contact: 'operator', show: ready('operator'), eff: { momentum: 1 }, result: 'Olu has a fresh copy pre-filled and on its way before you hang up.' }
      ]
    },
    {
      id: 'toll_skip_review', title: '"Do we have to?"', at: ['toll'], cut: 'bridge',
      text: (s) => `${C(s)} eyes the toll booth. "Do we really have to do the review? Nothing's changed. I'd honestly rather just go."`,
      choices: [
        { label: 'Skip it this year', kind: 'through', eff: { momentum: 2, trust: 1, debt: { tag: 'stale_info', sev: 2 } }, result: 'The troll shrugs and waves you through. "Your funeral." Charming troll.' },
        { label: 'Make it fifteen minutes and one question', kind: 'prepare',
          then: { text: (s) => `"Fifteen minutes. One question: what surprised you this year?" ${C(s)} thinks. Then laughs. "Honestly? Lots of things."`,
            choices: [
              { label: 'Ask about the biggest surprise', kind: 'prepare', eff: (s) => { R.sk = unknown(s); return R.sk ? { insight: 2, fact: R.sk, trust: 1 } : { insight: 1, trust: 1 }; }, result: (s) => (R.sk ? `Fifteen minutes becomes forty. Worth it: ${label(s, R.sk)}.` : 'Nothing you didn\'t already know. Fifteen minutes, as promised. They appreciate that.') },
              { label: 'Keep your promise: wrap up at fifteen', kind: 'around', eff: { trust: 1, momentum: 1 }, result: 'Fifteen minutes on the dot. They are amazed. Nobody has ever kept that promise to them.' }
            ] } },
        { label: 'Do the full review anyway', kind: 'around', hint: 'Thorough. They did ask not to.', eff: { energy: -2, days: 1, insight: 2, trust: -1 }, result: (s) => `Every page, every account. ${C(s)} sighs through all of it, but you leave with a file that is actually current.` }
      ]
    },

     * around obstacles (see passages.js). These moments happen between landmarks. */
    {
      id: 'backchannel_nobody_asked', title: 'Nobody asked', at: ['travel'],
      when: (s) => s.day >= 5 && !K(s, s.client.stakeholderFact),
      text: (s) => `Halfway across a quiet footbridge, ${C(s)} leans on the railing. "You know, it's funny. You never asked who else is involved in all this." They say it lightly. They do not mean it lightly.`,
      choices: [
        { label: 'Ask now', kind: 'prepare', eff: (s) => ({ momentum: -1, insight: 2, trust: 1, fact: s.client.stakeholderFact }), result: (s) => `It turns out ${s.client.stakeholder} matters a great deal. Good thing there is still time.` },
        { label: '"We\'ll get to that"', kind: 'through', eff: (s) => ({ momentum: 1, debt: { tag: 'unknown_stakeholder', sev: 2 }, missed: s.client.stakeholderFact }), result: '"Sure," they say. The river keeps moving underneath.' },
        { label: 'Stop and do a proper fact-find right here', kind: 'prepare', minigame: 'factFind', hint: 'A day lost. Everything you skipped, in one go.', eff: { days: 1 }, result: 'The paperwork comes out and gets spread along the railing. Late, but thorough.' }
      ]
    },
    {
      id: 'backchannel_cousin', title: 'Steve\'s cousin', at: ['travel'], cut: 'steve', weight: 0.7,
      when: (s) => s.password && s.day >= 3,
      text: 'A man in a cardigan is fishing off a footbridge. He looks a lot like Steve. "Steve\'s cousin," he says, without looking up. "Steve\'s back channels get you around things. Mine skips the next landmark entirely. Straight across the water."',
      choices: [
        { label: 'Take the even shorter way', kind: 'through', hint: 'You are already short on what you know.', eff: { momentum: 3, debt: [{ tag: 'rushed_pace', sev: 2 }, { tag: 'guessed_key', sev: 1 }] }, result: 'You hop across the stepping stones. Fast. Very fast. Your client is a little out of breath and a lot unsure.' },
        { label: '"What usually happens at the end of it?"', kind: 'prepare',
          then: { text: 'He reels in nothing. "People get across quick. Then the client asks them something, and they don\'t know the answer. Then they walk all the way back." He casts again. "Steve thinks that\'s funny."',
            choices: [
              { label: 'Thank him and take the proper way', kind: 'prepare', eff: (s) => (PP.skill(s, 'judgment') < 2 ? { skill: { judgment: 1 } } : { insight: 1 }), result: 'He nods. "Smart. Steve would\'ve taken it."' },
              { label: 'Take it anyway, you\'ll figure it out', kind: 'through', eff: { momentum: 2, debt: { tag: 'guessed_key', sev: 2 } }, result: 'You figure you will figure it out. That is a plan, technically.' }
            ] } },
        { label: 'Ask him for fishing tips instead', kind: 'around', eff: { energy: 1, trust: 1 }, result: (s) => `You sit with him for an hour. ${C(s)} sits too. Nobody catches anything. It is the nicest hour of the trip.` }
      ]
    },
    {
      id: 'backchannel_too_fast', title: '"Was that too fast?"', at: ['travel'],
      when: (s) => s.pace !== 'steady' && s.day >= 4,
      text: (s) => `${C(s)} stops to catch their breath and watches a stream for a while. "That was quicker than I expected. Is that... good? It feels like we skipped some things."`,
      choices: [
        { label: '"It\'s good! We\'re nearly there."', kind: 'through', eff: { momentum: 1, debt: { tag: 'unchallenged_assumption', sev: 2 } }, result: (s) => `${C(s)} nods, a little unsure. You both keep walking.` },
        { label: '"Honestly, we did. Let\'s slow down."', kind: 'prepare', eff: { trust: 2, momentum: -2, pace: 'steady', insight: 1 }, result: 'Saying it out loud is a relief for both of you. The X can wait a few days.' },
        { label: '"What do you think we skipped?"', kind: 'prepare', eff: (s) => { R.tf = open(s); return { energy: -1 }; },
          then: { text: (s) => { const w = worry(s); if (!w) return `${C(s)} counts on their fingers. "Well, you never really asked what I'm worried about."`; return `${C(s)} hesitates, then: ` + (R.tf ? w.text : (w.guarded || w.text)); },
            choices: [
              { label: 'Thank them, and really listen', kind: 'prepare', eff: (s) => { const w = worry(s); return R.tf && w && w.fact ? { trust: 1, insight: 2, fact: w.fact } : { trust: 1, insight: 1 }; }, result: () => (R.tf ? 'Everything the hurry skipped, in one honest minute. Worth slowing down for.' : 'They do not tell you everything. But now you know there is more, and they know you will ask.') },
              { label: 'Promise to cover it all at the end', kind: 'through', eff: { momentum: 1, debt: { tag: 'assumed_goal', sev: 1 } }, result: '"At the end." They nod. The end keeps getting closer.' }
            ] } }
      ]
    }
  );
})(window.PP);

</script>
<script>
/* events-road: more encounters on the trail (at: ['travel']), appended to the deck.
 *
 * Rivals, chance meetings that become prospects, mentors and peers, moments with
 * your own client, and the ordinary interruptions of an agent's life.
 * Everything about the client comes from s.client, so these work for any archetype.
 */
(function (PP) {
  const C = (s) => PP.clientName(s);
  const K = PP.knows;

  /* ---------- helpers ---------- */
  const S = (s) => (s.client && s.client.shortStake) || 'someone back home';
  const facts = (s) => (s.client && s.client.facts) || {};
  const label = (s, f) => (facts(s)[f] ? facts(s)[f].label.toLowerCase() : 'something that matters');
  const unknownFact = (s) => Object.keys(facts(s)).find((f) => !K(s, f));
  const worry = (s) => s.client && s.client.checkin && s.client.checkin.worry;
  const opens = (s) => PP.skill(s, 'curiosity') > 0 || s.res.trust >= 6;
  const comm = (s) => PP.skill(s, 'communication') > 0;
  const pipe = (s) => (s.career && s.career.pipeline) || [];
  const book = (s) => ((s.career && s.career.book) || []).filter((b) => b.status === 'life' || b.status === 'steady' || b.status === 'at-risk');
  const shakiest = (s) => book(s).slice().sort((a, b) => (a.sat == null ? 7 : a.sat) - (b.sat == null ? 7 : b.sat))[0];
  const partner = (s) => s.career && s.career.partner && PP.content.practice.partners.find((p) => p.id === s.career.partner);
  const recruit = (s) => ((s.career && s.career.recruits) || [])[0];
  const afford = (n) => (s) => !s.career || s.career.savings >= n;
  const money = (n) => (PP.career ? PP.career.money(n) : '$' + n);
  const hotFirst = { hot: 0, warm: 1, cold: 2 };
  const bestProspect = (s) => pipe(s).slice().sort((a, b) => hotFirst[a.temp] - hotFirst[b.temp])[0];
  const loseProspect = (s, p) => { if (!s.career || !p) return null; s.career.pipeline = s.career.pipeline.filter((x) => x.id !== p.id); return p; };
  const warmUp = (s, p) => { if (!s.career || !p) return; p.temp = p.temp === 'cold' ? 'warm' : 'hot'; p.expires = Math.max(p.expires, s.career.days + 12); };
  const missingSystem = (s) => ['notes', 'discovery', 'focus', 'review'].find((id) => s.career && !PP.career.hasSystem(s.career, id));
  const sysName = (id) => (PP.content.practice.systems[id] ? PP.content.practice.systems[id].name.toLowerCase() : 'system');
  // Random outcomes: eff rolls and remembers, result reads it. Every random choice has a preview,
  // so the eff runs exactly once, when picked.
  let roll = false;
  // Targets of the current event (a prospect or a client in your book), fixed when the text is shown.
  let target = null;

  PP.content.events.push(

    /* ================= RIVALS ================= */
    {
      id: 'rd_rival_brochure', title: 'The shiny brochure', at: ['travel'], weight: 1.1,
      when: (s) => s.day >= 2,
      text: (s) => `A man in loafers that have never seen a trail jogs alongside you. "Brent Haskell! Love what you're doing, love it." He presses a glossy brochure into ${C(s)}'s hands. On the cover, a silver-haired couple laughs on a sailboat at nothing in particular.`,
      choices: [
        { label: 'Let them read it, then ask what caught their eye', kind: 'prepare', hint: 'Their reaction tells you something.',
          then: { text: (s) => `${C(s)} flips through it. "It's very... confident. Page six says I'll 'never worry again.' Is that a thing?" Brent is already halfway to the next hiker.`,
            choices: [
              { label: '"What would \'never worry again\' look like for you?"', kind: 'prepare', eff: (s) => Object.assign({ insight: 1, trust: 1 }, opens(s) && unknownFact(s) ? { fact: unknownFact(s) } : {}), result: (s) => opens(s) ? `${C(s)} thinks about it for a full minute, then tells you something you had not heard yet.` : `"Not checking my balance at 2am, mostly." It's a start.` },
              { label: '"Nobody can promise that. I won\'t either."', kind: 'through', eff: (s) => ({ trust: comm(s) ? 2 : 1 }), result: (s) => `${C(s)} folds the brochure into a paper hat. "Honest. Weird, but honest."` }
            ] } },
        { label: 'Take the brochure and point out the fine print', kind: 'through', hint: 'Right, but nobody likes being told they were fooled.', eff: (s) => ({ insight: 1, trust: comm(s) ? 1 : -1 }), result: (s) => comm(s) ? 'You read the tiny print aloud in a funny voice. Everyone laughs, including Brent, a little.' : `"Okay, okay, I get it," ${C(s)} says, a bit stung.` },
        { label: 'Promise your plan will be just as exciting', kind: 'around', eff: { momentum: 2, debt: { tag: 'premature_pitch', sev: 1 } }, result: 'You describe your plan with a lot more sailboats than it actually contains.' }
      ]
    },
    {
      id: 'rd_rival_badmouth', title: 'A rival with a long memory', at: ['travel'],
      when: (s) => s.day >= 3,
      text: (s) => `At a trail junction, a woman with a perfect blowout and a clipboard leans toward ${C(s)}, not quite out of your earshot. "Corinne Vail. Just so you know, this one's brand new. First year. I'd want someone who's done this before, but that's me."`,
      choices: [
        { label: 'Own it, plainly', kind: 'prepare', hint: 'Honesty about the gap, plus what you do about it.',
          then: { text: (s) => `${C(s)} turns to you. "Is that true? Is this your first year?"`,
            choices: [
              { label: '"Yes. Which is why I ask a lot of questions and bring in help."', kind: 'prepare', eff: (s) => (s.res.trust >= 4 ? { trust: 2, insight: 1 } : { trust: 1 }), result: (s) => `${C(s)} nods. "Honestly, the questions are why I'm still here." Corinne has already gone.` },
              { label: '"Yes, and I have a mentor checking my work."', kind: 'help', eff: { trust: 1, style: { soloist: -1 } }, result: 'True, and it lands. Now you have to actually call your mentor.' }
            ] } },
        { label: 'Talk up your experience a bit', kind: 'through', hint: 'It will be remembered.', eff: { momentum: 1, debt: { tag: 'unchallenged_assumption', sev: 2 } }, result: '"I\'ve been around," you say, which is technically true of anyone over thirty.' },
        { label: 'Badmouth her right back', kind: 'around', eff: { trust: -1, energy: -1 }, result: (s) => `It feels great for nine seconds. ${C(s)} looks at you like they just learned something.` }
      ]
    },
    {
      id: 'rd_rival_recruiter', title: 'Someone wants to hire you', at: ['travel'], weight: 0.9,
      when: (s) => !!s.career && s.day >= 3,
      text: (s) => `A man in a navy fleece with a big firm's logo stitched on the chest waves you over to a rest stop. "Harlan. Recruiting. I've heard about you. Base salary, benefits, a parking spot with your name on it. You'd never have to worry about covering ${money(PP.career.costs(s.career))} a day again." ${C(s)} is pretending not to listen.`,
      choices: [
        { label: 'Hear him out', kind: 'prepare', hint: 'Information is free. Your client is watching.',
          then: { text: '"The catch?" Harlan smiles. "No catch. Well. Your clients stay with us if you leave. And there\'s a product list. And a quota. Little things."',
            choices: [
              { label: '"What happens to the people who miss quota?"', kind: 'prepare', eff: (s) => (PP.skill(s, 'judgment') < 2 ? { skill: { judgment: 1 }, trust: -1 } : { insight: 1, trust: -1 }), result: '"We prefer to call it graduating." You learn more from his pause than his pitch. Your client heard the whole thing, though.' },
              { label: 'Take his card, for later', kind: 'through', eff: { energy: -1, trust: -1, style: { chase: 1 } }, result: (s) => `The card sits in your pocket like a pebble. ${C(s)} saw you take it.` },
              { label: '"Thanks. I like building my own thing."', kind: 'around', eff: { insight: 1 }, result: 'He shrugs. "Offer\'s open." You walk back to your client feeling oddly lighter.' }
            ] } },
        { label: 'Decline on the spot', kind: 'through', eff: (s) => ({ trust: 1, momentum: 1 }), result: (s) => `"I'm with a client," you say, and walk back. ${C(s)} pretends not to smile.` },
        { label: 'Ask if he has any clients he can\'t serve', kind: 'around', hint: 'Bold. Might work.', eff: () => ((roll = PP.chance(0.4)) ? { energy: -1, prospect: { temp: 'warm', source: 'a recruiter who could not serve them', event: true } } : { energy: -1 }), preview: '40% chance of a warm prospect. Costs Energy.', result: () => roll ? 'Harlan laughs. "Cheeky." But he does know someone who is "too small for us." (New prospect in your pipeline.)' : '"Ha. No." He seems to respect it, though.' }
      ]
    },
    {
      id: 'rd_rival_split', title: '"Let\'s split this one"', at: ['travel'],
      when: (s) => s.day >= 2,
      text: (s) => `An agent in a rumpled blazer falls into step. "Gordy Mack. I've been watching you with ${C(s)}. Here's my offer: you keep the relationship, I handle the hard parts, we split it fifty-fifty. I've never lost a client." He pauses. "Recently."`,
      choices: [
        { label: 'Shake on it', kind: 'through', hint: 'Less work today. Who actually knows this client?', eff: { momentum: 2, energy: 1, debt: { tag: 'bad_handoff', sev: 2 } }, result: 'He takes your notes, glances at the first page, and says "Got it." That was fast.' },
        { label: 'Ask what he\'d actually do', kind: 'prepare',
          then: { text: (s) => `"Do? The usual. Same as every client." He hasn't asked ${C(s)}'s name yet. "Does it matter?"`,
            choices: [
              { label: 'Ask him to meet your client first', kind: 'help', eff: () => ((roll = PP.chance(0.5)) ? { insight: 2, momentum: 1, style: { soloist: -1 } } : { trust: -1, momentum: -1 }), preview: 'A coin flip: he turns out to be useful, or he pitches your client directly.', result: (s) => roll ? `Surprise: one-on-one, Gordy is sharp. He asks ${C(s)} two questions you hadn't thought of, then waves goodbye.` : `Gordy hands ${C(s)} his own card within four minutes. You take it back. Awkward.` },
              { label: 'Politely pass', kind: 'around', eff: { insight: 1 }, result: '"Your loss," he says, and starts following another hiker.' }
            ] } },
        { label: 'No, thanks. Keep walking.', kind: 'around', eff: { momentum: 1 }, result: 'He shrugs. "Offer stands." It does not.' }
      ]
    },
    {
      id: 'rd_rival_familyfriend', title: 'A family friend in the business', at: ['travel'], weight: 1.1,
      when: (s) => s.day >= 3,
      text: (s) => `A cheerful voice calls out: "${C(s)}! Is that you?" It's Ray, an old family friend who has "done a bit of this" for decades. He hugs ${C(s)}, then looks you up and down. "And who's this, then? You know I'd have helped you for free, sweetheart."`,
      choices: [
        { label: 'Invite Ray into the conversation', kind: 'help', hint: 'Generous. Slower. Might backfire, might not.',
          then: { text: (s) => `Ray settles in. "So what's the plan?" He listens to your outline, then asks pointedly: "Have you asked about ${label(s, s.client.keyFact)}?"`,
            choices: [
              { label: '"Not yet. Good catch. Let\'s ask now."', kind: 'prepare', eff: (s) => ({ momentum: -1, trust: 2, insight: 1, fact: s.client.keyFact, style: { soloist: -1 } }), result: (s) => `${C(s)} answers, a little surprised to be asked. Ray gives you a nod on his way out: "You'll do."` },
              { label: '"I\'ve got it covered."', kind: 'through', eff: (s) => (K(s, s.client.keyFact) ? { trust: 1 } : { trust: -1, debt: { tag: 'guessed_key', sev: 2 } }), result: (s) => K(s, s.client.keyFact) ? 'You do. Ray seems impressed, and a little disappointed he can\'t correct you.' : 'Ray raises an eyebrow and lets it drop. For now.' }
            ] } },
        { label: 'Make your case for yourself', kind: 'through', hint: 'Only works if the relationship is already strong.', eff: (s) => (s.res.trust >= 6 ? { trust: 1 } : (roll = PP.chance(0.35)) ? { poached: 'Ray, an old family friend in the business' } : { trust: -1 }), preview: 'Trust 6+: they stay. Below that, a 35% chance they go with Ray.', result: (s) => s.poached ? `${C(s)} looks torn, then links arms with Ray. "He's known me since I was little."` : s.res.trust >= 7 ? `${C(s)} squeezes Ray's arm. "I think I've got the right person, Ray."` : 'Ray leaves, but he will be at the next family barbecue. Your name will come up.' },
        { label: 'Step back and let them catch up', kind: 'around', eff: { energy: 1, momentum: -1 }, result: 'Forty minutes of stories about a dog named Biscuit. You eat a granola bar.' }
      ]
    },
    {
      id: 'rd_rival_app', title: 'There\'s an app for that', at: ['travel'],
      text: (s) => `A billboard at the edge of the trail: YOUR FUTURE IN FOUR TAPS. ${C(s)} has already downloaded the app. "It says I'm a 'Bold Navigator.' It made a pie chart. It took ninety seconds. What do you do in ninety seconds?"`,
      choices: [
        { label: '"Show me. Let\'s look at it together."', kind: 'prepare', hint: 'Curiosity disarms. Contempt doesn\'t.',
          then: { text: (s) => `The app asked for an age, a zip code, and whether ${C(s)} "likes roller coasters." It did not ask about ${label(s, s.client.stakeholderFact)}.`,
            choices: [
              { label: 'Point out what it couldn\'t have known', kind: 'prepare', eff: (s) => ({ insight: 1, trust: comm(s) ? 2 : 1, fact: s.client.stakeholderFact }), result: (s) => `${C(s)} goes quiet. "Huh. Yeah. It doesn't know about any of that."` },
              { label: 'Admit it\'s decent at one small piece', kind: 'help', eff: { trust: 2 }, result: '"Honestly, for that one thing, it\'s fine." Your client looks at you like you just passed a test.' }
            ] } },
        { label: 'Make fun of it', kind: 'through', eff: { trust: -1, momentum: 1 }, result: (s) => `${C(s)} laughs, then quietly does not delete the app.` },
        { label: 'Ignore it and carry on', kind: 'around', eff: { debt: { tag: 'unchallenged_assumption', sev: 1 } }, result: 'The pie chart lives on their home screen now.' }
      ]
    },
    {
      id: 'rd_rival_pipeline', title: 'She\'s meeting your prospect', at: ['travel'], weight: 1.3,
      when: (s) => pipe(s).length > 0,
      text: (s) => { target = bestProspect(s); return `A rival agent you half-know from the port, Dara Quill, waves from the other trail. "Funny thing! I'm having coffee with ${target.name} on Thursday. They said you'd gone quiet. No hard feelings, right?"`; },
      choices: [
        { label: 'Send a proper note to the prospect right now', kind: 'prepare', hint: 'Costs energy. Shows you remember them.', eff: { energy: -1 }, result: (s) => { warmUp(s, target); return target ? `You write ${target.name} a short, specific note. They reply within the hour: "Oh good, I was hoping to hear from you."` : 'You write a short note.'; } },
        { label: 'Ask your partner to call them', kind: 'help', show: (s) => !!partner(s), eff: { momentum: 1 }, result: (s) => { warmUp(s, target); return `${partner(s).name} calls ${target ? target.name : 'them'} that afternoon. Dara's coffee gets cancelled.`; } },
        { label: '"If it\'s meant to be, it\'s meant to be."', kind: 'through', eff: { momentum: 1 }, preview: '60% chance you lose that prospect.', result: (s) => { if (PP.chance(0.6) && loseProspect(s, target)) return `By Friday, ${target.name} has signed with Dara. It was meant to be, apparently. For her.`; return target ? `Dara texts on Thursday: "${target.name} cancelled. Something about waiting for you?" Lucky.` : 'Nothing happens.'; } },
        { label: 'Tell Dara to back off', kind: 'around', eff: { energy: -1, trust: -1 }, preview: 'Your client sees you snap. 40% chance you lose the prospect anyway.', result: (s) => { if (PP.chance(0.4) && loseProspect(s, target)) return `Dara smiles and signs ${target.name} anyway. Your client watched you snap.`; return 'Dara holds up her hands and leaves. Your client looks at you a little warily.'; } }
      ]
    },
    {
      id: 'rd_rival_dinner', title: 'Free steak dinner', at: ['travel'],
      text: (s) => `A flyer is stapled to a trail post: FREE STEAK DINNER! LEARN THE SECRETS OF A WORRY-FREE FUTURE! TONIGHT ONLY. ${C(s)} reads it twice. "I mean... it is free steak."`,
      choices: [
        { label: 'Go together and sit in the back', kind: 'prepare', hint: 'Know what your client is hearing.', eff: () => ((roll = PP.chance(0.5)) ? { energy: 1, insight: 1, prospect: { temp: 'warm', source: 'someone you met at a rival\'s steak dinner', bias: { retiree: 2 }, event: true } } : { energy: 1, insight: 1 }), preview: 'Energy +1, Insight +1. 50% chance you leave with a prospect.', result: (s) => roll ? `The pitch is all fear, then all smiles. Afterwards a woman at your table asks you, quietly, what you'd actually ask her. (New prospect in your pipeline.) ${C(s)} says, "You're better than him."` : `The steak is grey. The pitch is loud. ${C(s)} whispers, "He never asked anyone a single question."` },
        { label: 'Let them go alone', kind: 'through', eff: () => ((roll = PP.chance(0.5)) ? { momentum: 1, trust: -1, debt: { tag: 'unchallenged_assumption', sev: 1 } } : { momentum: 1, energy: 1 }), preview: 'A coin flip: they come back unsettled, or they come back laughing.', result: (s) => roll ? `${C(s)} comes back with a tote bag and three new worries.` : `${C(s)} comes back with a doggy bag. "That guy was a clown. I brought you some steak."` },
        { label: 'Talk them out of it', kind: 'around', eff: (s) => ({ trust: comm(s) ? 0 : -1, momentum: 1 }), result: (s) => comm(s) ? 'You suggest dinner somewhere with fewer slides. They agree.' : `${C(s)} skips it, but sulks about the steak.` }
      ]
    },
    {
      id: 'rd_rival_cheaper', title: '"She said she\'d do it for half"', at: ['travel'],
      text: (s) => `${C(s)} has been on the phone. "So, a friend's agent says she'd do all this for half of what you charge. Half! Is that... true? What do you even get paid?"`,
      choices: [
        { label: 'Explain exactly how you get paid', kind: 'prepare', hint: 'Transparency costs a little time and earns a lot.',
          then: { text: (s) => `${C(s)} listens all the way through. "Okay. That's clearer than I expected. So what am I actually getting that the half-price version doesn't?"`,
            choices: [
              { label: 'Point to what you\'ve learned about them so far', kind: 'prepare', eff: (s) => (s.res.insight >= 4 ? { trust: 2 } : { trust: 1, insight: 1 }), preview: 'Strong if you have real Insight to point to.', result: (s) => s.res.insight >= 4 ? `You list what you know about ${C(s)}'s situation. They blink. "Okay. Yeah."` : 'You don\'t have much to point to yet. You say so, and promise to earn it.' },
              { label: '"Honestly? Maybe nothing, for some people. Let\'s see if you\'re one."', kind: 'around', eff: { trust: 2, momentum: -1 }, result: 'Disarmingly honest. They decide to keep going with you.' }
            ] } },
        { label: 'Offer a discount to match', kind: 'through', show: afford(400), hint: 'Keeps the client. Sets a price on you.', eff: { cash: -400, trust: 1, momentum: 1 }, result: `You knock ${money(400)} off. They're pleased. You wonder what you just taught them.` },
        { label: 'Change the subject', kind: 'around', eff: { style: { avoid: 1 }, debt: { tag: 'unchallenged_assumption', sev: 1 } }, result: '"Look at that view!" There is no view. They notice.' }
      ]
    },
    {
      id: 'rd_rival_oldtrainer', title: 'Your old trainer', at: ['travel'],
      when: (s) => pipe(s).length > 0,
      text: (s) => { target = bestProspect(s); return `Benny Okoro, who taught your licensing class and now works for a rival shop, is eating an apple on a fence. "Kid! Proud of you. Hey, I heard you've got ${target.name} waiting. You're stretched thin out here. Want me to take them off your hands? I'll send you a referral fee."`; },
      choices: [
        { label: 'Take the fee and hand them over', kind: 'through', hint: 'Cash now. One fewer future client.', eff: { cash: 300 }, result: (s) => { loseProspect(s, target); return `Benny writes you a check for ${money(300)} on his knee. ${target ? target.name : 'They'} will be fine with him. Probably better than fine.`; } },
        { label: 'Thank him and keep them', kind: 'around', eff: { energy: -1 }, result: '"Fair enough. Don\'t let them go cold." He tosses you the apple core, for some reason.' },
        { label: 'Ask him how he\'d handle them', kind: 'prepare',

    {

    {

    {

        { label: 'Do the module now, at a picnic table', kind: 'prepare', eff: { energy: -1 },
          then: { text: 'Audit the Owl asks: "A client\'s relative calls asking to change the client\'s address. What do you do?" The answer options are A) Change it, B) Verify with the client directly, C) Owl noises.',
            choices: [
              { label: 'B, obviously', kind: 'prepare', eff: (s) => (s.debt.some((d) => d.tag === 'unverified_details' || d.tag === 'fraud') ? { insight: 1, clearDebt: s.debt.find((d) => d.tag === 'unverified_details' || d.tag === 'fraud').tag } : { insight: 1 }), result: 'Correct! Audit the Owl does a little dance. It also reminds you of something you meant to double-check.' },

        { label: 'Archive it', kind: 'through', eff: { momentum: 1, debt: { tag: 'missed_message', sev: 2 } }, result: 'Out of sight. The owl is still watching, somewhere.' }

        { label: 'Ask your partner to handle it', kind: 'help', show: (s) => !!partner(s), eff: { momentum: 0 }, result: (s) => { if (target) target.sat = Math.min(10, (target.sat == null ? 7 : target.sat) + 2); return `${partner(s).name} calls ${target ? target.name : 'them'} within the hour. A text: "Sorted. You owe me a coffee."`; } },

    {

      choices: [
        { label: 'Find a print shop and overnight it', kind: 'prepare', show: afford(60), eff: { cash: -60, energy: -1 }, result: 'A shop in the next town with a fax machine from another century. It works. Barely.' },
        { label: 'E-sign it from your phone', kind: 'help', show: (s) => PP.career && PP.career.hasSystem(s.career, 'tech'), eff: { momentum: 1 }, result: 'Tap, tap, done. Your assistant sends a celebration emoji.' },
        { label: 'Tell them to sign it for you', kind: 'through', hint: 'Easy. Very much not allowed.', eff: { momentum: 1, debt: { tag: 'defaults', sev: 3 } }, result: '"I... can\'t do that," your assistant says. "But I\'ll pretend I didn\'t hear it, and it can wait." It cannot really wait.' },
        { label: 'Ask Olu to sort it', kind: 'help', contact: 'operator', show: (s) => PP.contactReady(s, 'operator'), eff: { momentum: 1 }, result: 'Olu finds a form that makes the form unnecessary. Nobody knows how.' }
      ]
    },
    {
      id: 'rd_life_partner', title: 'Your partner calls', at: ['travel'], weight: 1.3,
      when: (s) => !!partner(s),
      text: (s) => `${partner(s).name} calls from the port. "So. Two things. A great lead walked in asking for you specifically. And I may have spilled coffee on the desk calendar. Mostly on your side."`,
      choices: [
        { label: '"Book the lead for when I\'m back. Thank you!"', kind: 'prepare', eff: (s) => ({ prospect: { temp: 'hot', source: `a walk-in ${partner(s).name} held for you` } }), result: (s) => `${partner(s).name}: "Already done. Also I bought a new calendar. It has dogs on it." (Hot prospect in your pipeline.)` },
        { label: '"Take that lead yourself. You deserve it."', kind: 'help', eff: { trust: 0, energy: 1 }, result: (s) => `A pause. "Really? ...Thanks." ${partner(s).name} sounds genuinely touched. Partnerships run on moments like this.` },
        { label: 'Spend twenty minutes reconstructing the calendar', kind: 'around', eff: { energy: -1, insight: 1, prospect: { temp: 'warm', source: 'a walk-in at your practice' } }, result: 'Together you rebuild the week. Nothing was missed, it turns out. The lead goes in your pipeline. (New prospect.)' }
      ]
    },
    {
      id: 'rd_life_recruit', title: 'Your recruit is panicking', at: ['travel'], weight: 1.4,
      when: (s) => !!recruit(s),
      text: (s) => `A text from ${recruit(s).name}: "first real client meeting in 1 hr. they have a binder. what do i do. what do i SAY."`,
      choices: [
        { label: 'Call and coach them for twenty minutes', kind: 'help', hint: 'Mentoring keeps people.', eff: { energy: -1, momentum: -1 }, result: (s) => { const r = recruit(s); if (r) r.lastMentor = s.career.days; return `"Ask about the binder. Listen. Write it down." An hour later: "IT WENT GREAT. they cried. good crying." ${r ? r.name : 'They'} will remember you picked up.`; } },
        { label: 'Send three bullet points', kind: 'around', eff: { energy: 0 }, result: '"1. Ask. 2. Listen. 3. Don\'t pitch." A thumbs up comes back. You hope it went okay.' },
        { label: '"You\'ll be fine! On the trail, ttyl"', kind: 'through', eff: { momentum: 1 }, result: 'No reply. You wonder about it, later, more than you expected.' }
      ]
    }
  );
})(window.PP);

</script>
<script>
/* Follow-up journeys: events that only happen when you walk the trail again with an existing client.
 *
 * The client already trusts you, some facts carry over from last time, and life has
 * just changed (s.followUp.title). These beats are about the relationship itself:
 * picking up where you left off, not copying last time's plan, the people around
 * the client, and "how else can I help?"
 * Everything about the client comes from s.client and s.followUp, so these work for any archetype.
 */
(function (PP) {
  const C = (s) => PP.clientName(s);
  const F = (s) => !!s.followUp;
  const K = PP.knows;
  let roll = false;

  /* ---------- helpers ---------- */
  const S = (s) => (s.client && s.client.shortStake) || 'someone close to them';
  const lap = (s) => (s.followUp && s.followUp.lap) || 2;
  const nth = (n) => ({ 2: 'second', 3: 'third', 4: 'fourth', 5: 'fifth' }[n] || n + 'th');
  const change = (s) => ((s.followUp && s.followUp.title) || 'a change').toLowerCase();
  const opens = (s) => PP.skill(s, 'curiosity') > 0 || s.res.trust >= 6;
  const comm = (s) => PP.skill(s, 'communication') > 0;
  const needKnown = (s) => K(s, 'change_need');
  const seg = (s) => (s.client && PP.content.clients[s.client.id] && PP.content.clients[s.client.id].segment) || 'family';
  const bias = (s) => ({ [seg(s)]: 2 });
  /* Facts carried over from last time (known, still true, not this lap's need). */
  const carried = (s) => Object.keys(s.facts || {}).filter((k) => k !== 'change_need' && s.client && s.client.facts[k]);
  const oldFact = (s) => { const k = carried(s)[0]; return k ? s.client.facts[k].label.toLowerCase() : null; };
  const bookEntry = (s) => s.career && s.followUp && (s.career.book || []).find((b) => b.id === s.followUp.bookId);
  const lastPlan = (s) => { const b = bookEntry(s); const h = b && s.career && (s.career.history || []).find((x) => x.journey === b.journey); return h && h.outcome && PP.content.destinations ? h.outcome : 'last time\'s plan'; };
  const hasNotes = (s) => PP.hasItem(s, 'notebook') || (s.career && PP.career && PP.career.hasSystem && PP.career.hasSystem(s.career, 'notes'));

  PP.content.events.push(

    /* ================= ON THE ROAD ================= */

    {
      id: 'fu_remembered', title: '"You remembered"', at: ['travel'], weight: 2,
      when: (s) => F(s),
      text: (s) => `Half a day out, ${C(s)} goes quiet, then says, "I wasn't sure you'd remember me." You do. ${oldFact(s) ? `You remember that ${oldFact(s)}.` : 'You remember the name of their dog, how they take their coffee, and that they hate being called "folks."'} It's lap ${lap(s)} of this relationship, and it shows.`,
      choices: [
        { label: 'Say what you remember, and ask how things are really going', kind: 'prepare', hint: 'Warm. Opens a door. Takes a little time.',
          eff: { trust: 1, momentum: -1 },
          then: { text: (s) => `${C(s)} smiles properly for the first time since the call. "Okay. Since you asked. The ${change(s)} thing is... bigger than I made it sound on the phone."`,
            choices: [
              { label: 'Ask what "bigger" means', kind: 'prepare', hint: 'They might not be ready.',
                eff: (s) => (opens(s) ? { fact: 'change_need', insight: 1 } : { insight: 1 }),
                result: (s) => (opens(s) ? `It comes out in a rush. ${C(s)} looks lighter for having said it.` : `"I'll get there. Give me a day." Fair enough. You have time.`) },
              { label: '"Whenever you\'re ready. I\'m not going anywhere."', kind: 'around', eff: { trust: 1 }, result: (s) => `${C(s)} nods. "That's why I called you and not the number on the internet."` }
            ] } },
        { label: 'Skip the catch-up: you know them, get straight to it', kind: 'through', hint: 'Efficient. Familiarity can feel like assuming.',
          eff: { momentum: 2, debt: { tag: 'assumed_goal', sev: 1 } },
          result: (s) => `You launch into what you think the ${change(s)} means for them. ${C(s)} nods along. They haven't told you anything yet, you realize later.` },
        { label: 'Flip back through your notes from last time', kind: 'help', show: hasNotes, hint: 'Past you, writing things down. Hero.',
          eff: { insight: 1, trust: 1 },
          result: (s) => `There, in the margin: a detail you'd forgotten you knew. You mention it. ${C(s)} actually gasps. "You WROTE that down?"` }
      ]
    },

    {
      id: 'fu_stake_opinions', title: 'Someone has opinions', at: ['travel'],
      when: (s) => F(s) && !!s.client.shortStake,
      text: (s) => `${C(s)}'s phone buzzes for the fourth time in an hour. "Sorry. It's ${S(s)}. They heard about the ${change(s)}. They have thoughts. A lot of thoughts. One of them is in all capitals."`,
      choices: [
        { label: `Suggest bringing them into the next conversation`, kind: 'prepare', hint: 'Slower. Everyone who matters is in the room.',
          eff: (s) => ({ momentum: -1, trust: 1, insight: 1, fact: s.client.stakeholderFact }),
          then: { text: (s) => `${S(s)} joins by video, slightly too close to the camera. "I just want to know someone's actually thinking about this properly." They look at you. "Are you?"`,
            choices: [
              { label: 'Ask what worries them most', kind: 'prepare', eff: (s) => (comm(s) || s.res.trust >= 6 ? { trust: 1, insight: 1, fact: 'change_need' } : { insight: 1 }),
                result: (s) => `${S(s)} says the thing ${C(s)} hasn't been able to. ${C(s)} doesn't argue. Sometimes the people around a client know things first.` },
              { label: 'Walk them through what you did last time', kind: 'around', eff: { trust: 1, momentum: 1 },
                result: (s) => `${S(s)} listens, arms folded, then unfolds them. "Okay. That was sensible." High praise, apparently.` }
            ] } },
        { label: 'Let the client handle them and keep moving', kind: 'through', hint: 'Fast. You will hear their opinions later, secondhand.',
          eff: (s) => ({ momentum: 1, debt: { tag: 'unknown_stakeholder', sev: 2 } }),
          result: (s) => `${C(s)} types "I've got it handled" and puts the phone face-down. It keeps buzzing, face-down.` },
        { label: 'Offer to write a short note they can forward', kind: 'help', show: comm, hint: 'Communication: one clear page beats twelve texts.',
          eff: { energy: -1, trust: 1, momentum: 1 },
          result: (s) => `Five plain sentences, no jargon. ${C(s)} forwards it. The reply: "fine. thank you. who IS this person?"` }
      ]
    },

    {
      id: 'fu_rival_noticed', title: 'A rival noticed', at: ['travel'],
      when: (s) => F(s),
      text: (s) => `${C(s)} hands you a glossy card that arrived yesterday. "CONGRATULATIONS ON YOUR NEW CHAPTER! Let's talk about your future." It's from an agent across town. "How did he even know?" ${C(s)} asks. "I only told about six people. And the internet."`,
      choices: [
        { label: 'Ask what, if anything, appealed about it', kind: 'prepare', hint: 'Humbling, maybe. Useful, definitely.',
          eff: { insight: 1, momentum: -1 },
          then: { text: (s) => `${C(s)} thinks. "Honestly? He got in touch first. I called you. He just... showed up." They don't sound accusing. They sound like they're telling you something.`,
            choices: [
              { label: 'Promise to check in before the next change, not after', kind: 'prepare', eff: { trust: 2, energy: -1 }, result: (s) => `You put a date in your calendar while ${C(s)} watches. "Huh," they say. "Okay."` },
              { label: '"Fair. That\'s on me."', kind: 'around', eff: { trust: 1 }, result: 'Owning it costs nothing and buys a lot.' }
            ] } },
        { label: 'Make a joke about the font and move on', kind: 'around', hint: 'Light. Doesn\'t address why it stung.',
          eff: { momentum: 1 }, result: (s) => `${C(s)} laughs. The card goes in your pocket, not the bin. You notice that.` },
        { label: 'Out-pitch him: lay out everything you could do right now', kind: 'through', hint: 'Fights the rival, not the problem.',
          eff: { momentum: 2, trust: -1, debt: { tag: 'premature_pitch', sev: 2 } },
          result: (s) => `It's an impressive list. ${C(s)} says, "That's a lot," which is not the same as "yes."` }
      ]
    },

    {
      id: 'fu_phone_call', title: 'The call they had to take', at: ['travel'],
      when: (s) => F(s),
      text: (s) => `${C(s)} steps away to take a call. Something about the ${change(s)}: you catch "today?" and "no, I understand" and a long silence. They come back pale and say, "Sorry. Where were we?"`,
      choices: [
        { label: 'Stop for the day. Nothing here can\'t wait until tomorrow', kind: 'prepare', hint: 'A day lost. A person looked after.',
          eff: { days: 1, trust: 2, energy: 1, momentum: -1 },
          result: (s) => `You find a bench and a terrible vending-machine tea. ${C(s)} talks for a while, not about money at all. Tomorrow they're steadier.` },
        { label: 'Ask, gently, what the call was about', kind: 'help', hint: 'Only if they want to say.',
          eff: (s) => (s.res.trust >= 6 ? { fact: 'change_need', trust: 1 } : { insight: 1 }),
          result: (s) => (s.res.trust >= 6 ? `They tell you. It's exactly the thing that matters, and they hadn't said it until now.` : `"Just... admin," ${C(s)} says. It obviously wasn't. Maybe once they trust you a bit more.`) },
        { label: 'Pick up exactly where you left off', kind: 'through', hint: 'Keeps the pace. Reads a bit cold.',
          eff: { momentum: 1, trust: -1 },
          result: (s) => `You pick up mid-sentence. ${C(s)} nods at the right moments and doesn't hear a word.` }
      ]
    },

    {
      id: 'fu_we_did_this', title: '"We already did all this"', at: ['travel'],
      when: (s) => F(s) && lap(s) >= 2,
      text: (s) => `You start on the usual questions. ${C(s)} waves a hand. "We did all this last time. Same address, same job, same everything. Well. Except the ${change(s)}, obviously."`,
      choices: [
        { label: 'Skip it. They\'d know, wouldn\'t they?', kind: 'through', hint: 'Saves a day. Things change quietly too.',
          eff: { momentum: 2, debt: { tag: 'unverified_details', sev: 2 } },
          result: 'You skip ahead. It feels like trust. It might also be a gap.' },
        { label: 'Run through it quickly anyway', kind: 'prepare', hint: 'A little tedious. A little safer.',
          eff: { energy: -1, insight: 1 },
          result: (s) => `Halfway through, ${C(s)} says, "Oh. Actually, that's changed." Of course it has.` },
        { label: 'Explain why it matters after a big change', kind: 'help', show: comm, hint: 'Communication: turns a chore into care.',
          eff: { insight: 1, trust: 1 },
          result: (s) => `"When one big thing moves, little things move with it." ${C(s)} sighs, then hands over their phone to check. Two little things had moved.` }
      ]
    },

    {
      id: 'fu_how_else', title: '"How else can I help?"', at: ['travel', 'sands', 'summit'],
      when: (s) => F(s) && s.res.trust >= 4,
      text: (s) => `It's a good day on the trail. The ${change(s)} feels a bit more manageable. ${C(s)} says, "Thanks for coming back out with me. Seriously." There's a pause where you could say "of course" and leave it there.`,
      choices: [
        { label: 'Ask, "Is there anything else going on I should know about?"', kind: 'prepare', hint: 'The best question you\'ll ask all week.',
          eff: { insight: 1 },
          then: { text: (s) => `${C(s)} hesitates. "Well... it's not about me. A friend of mine has been going through something too. I didn't know if that was a thing you... did."`,
            choices: [
              { label: '"It\'s exactly a thing I do. Would they want to talk?"', kind: 'help', eff: (s) => ({ trust: 1, prospect: { temp: 'warm', source: `a friend of ${C(s)}`, bias: bias(s), event: true } }),
                result: (s) => `${C(s)} texts them right there. A thumbs-up comes back almost immediately. (New prospect in your pipeline.)` },
              { label: 'Ask how it\'s affecting the client', kind: 'prepare', eff: (s) => (opens(s) ? { fact: 'change_need', insight: 1 } : { insight: 1, trust: 1 }),
                result: (s) => (opens(s) ? `It turns out it's tangled up with their own situation more than they'd said. That changes the picture.` : `"Not much, really." But they're glad you asked about them first.`) }
            ] } },
        { label: '"Of course." Keep walking.', kind: 'around', eff: { momentum: 1 }, result: 'A nice moment. Just a moment.' },
        { label: 'Ask straight out who else they could refer', kind: 'through', hint: 'Direct. Can feel transactional mid-crisis.',
          eff: (s) => (comm(s) ? { prospect: { temp: 'warm', source: `a referral from ${C(s)}`, bias: bias(s), event: true } } : { trust: -1, prospect: { temp: 'cold', source: `a name ${C(s)} gave you`, event: true } }),
          result: (s) => (comm(s) ? `You ask lightly, and well. ${C(s)} gives you a name without thinking twice. (New prospect in your pipeline.)` : `${C(s)} gives you a name, a little stiffly. "Right now? Okay." (New prospect in your pipeline.)`) }
      ]
    },

    {
      id: 'fu_thank_you', title: 'A thank-you for last time', at: ['travel', 'meadows'],
      when: (s) => F(s),
      text: (s) => `${C(s)} digs in their bag and hands you something wrapped in foil. "I made these. For last time. I never said thank you properly, and then the ${change(s)} happened and I thought, well, I'd better say it before I ask for more help."`,
      choices: [
        { label: 'Accept, and ask what actually helped last time', kind: 'prepare', hint: 'Feedback is a gift too. Usually less crumbly.',
          eff: { insight: 1, trust: 1 },
          result: (s) => `"Honestly? You didn't make me feel stupid." ${C(s)} shrugs. "Everything else was fine. That part I remembered."` },
        { label: '"Just doing my job."', kind: 'around', hint: 'Modest. Also a bit of a door-close.',
          eff: { momentum: 1 },
          result: (s) => `${C(s)} looks faintly disappointed, as if they'd wanted it to be more than a job. The cookies are excellent.` },
        { label: 'Share them out and make it a proper break', kind: 'help', hint: 'Slower. Good for everyone.',
          eff: { energy: 2, trust: 1, momentum: -1 },
          result: (s) => `You sit on a wall and eat cookies. ${C(s)} tells you a story about last year you'd never heard. Lap ${lap(s)}, and you're still learning things.` }
      ]
    },

    /* ================= AT LANDMARKS ================= */

    {
      id: 'fu_copy_paste_plan', title: 'Copy last time\'s plan?', at: ['loop', 'swamp'],
      when: (s) => F(s),
      text: (s) => `The trail curls back on itself. A sign reads: "RETURNING CLIENT? Simply re-use your previous plan! (Recommended.)" Below it, a button: COPY ${String(lastPlan(s)).toUpperCase()}. It would be so easy. ${C(s)}'s life has changed, but has it changed THAT much?`,
      choices: [
        { label: 'Press the button', kind: 'through', hint: 'Last time\'s answer to last time\'s life.',
          eff: { momentum: 2, debt: [{ tag: 'ignored_change', sev: 2 }, { tag: 'assumed_goal', sev: 1 }] },
          result: 'Everything fills in beautifully. Every field is green. None of them mention the change.' },
        { label: 'Go through the old plan with them, line by line', kind: 'prepare', hint: 'Slow. Shows you what still fits and what doesn\'t.',
          eff: { energy: -1, insight: 1 },
          then: { text: (s) => `Line by line, ${C(s)} reads along. Most of it still holds. Then they stop at one line and frown. "That bit was for before."`,
            choices: [
              { label: 'Ask what "before" means now', kind: 'prepare', eff: (s) => (opens(s) ? { fact: 'change_need', trust: 1 } : { insight: 1 }),
                result: (s) => (opens(s) ? `"Before the ${change(s)}. Now it's..." and they tell you what's really changed.` : `"Just... before." They're not quite ready to say. But you know where to look.`) },
              { label: 'Mark it and keep going', kind: 'around', eff: { momentum: 1 }, result: 'You circle it in red. It is very much still circled.' }
            ] } },
        { label: 'Ask Olu to pull the old file and flag what\'s out of date', kind: 'help', contact: 'operator', show: (s) => PP.contactReady(s, 'operator'), hint: 'Olu loves a diff.',
          eff: { insight: 2, momentum: 1, clearDebt: 'stale_info' },
          result: 'Olu sends back the old file with three lines highlighted in yellow and a note: "These were true once."' }
      ]
    },

    {
      id: 'fu_fog_history', title: 'They remember for you', at: ['fog'],
      when: (s) => F(s),
      text: (s) => `In the fog, you reach for a detail from last time and it isn't there. Was it their brother or their cousin? Before you can guess, ${C(s)} says, "My cousin. You were going to ask. You always tilt your head when you're about to ask." Shared history works both ways.`,
      choices: [
        { label: 'Laugh, admit it, and let them lead for a bit', kind: 'around', hint: 'Humble. Slower. Clients like being the expert on their own life.',
          eff: { trust: 1, insight: 1, momentum: -1 },
          result: (s) => `${C(s)} walks you through the fog, filling in gaps. They know the way. It's their life, after all.` },
        { label: 'Bluff through the rest of the details', kind: 'through', hint: 'You\'ll get most of it right.',
          eff: { momentum: 1, debt: { tag: 'guessed_key', sev: 2 } },
          result: 'You nod confidently through the next three details. You are confident about two of them.' },
        { label: 'Check your notes from last time', kind: 'help', show: hasNotes, hint: 'The notebook, or the notes system, if you kept one.',
          eff: { insight: 2 },
          result: (s) => `Page by page, last time comes back. ${C(s)} peers at your handwriting. "Is that a drawing of my dog?" It is.` }
      ]
    },

    {
      id: 'fu_caves_resurface', title: 'It catches up with them', at: ['caves'],
      when: (s) => F(s),
      text: (s) => `Deep in the Caves of What-Ifs, the voices echo: "but what if...?" ${C(s)} stops walking. "I've been fine about the ${change(s)}. Really fine. Totally fine." Their voice cracks on the third "fine."`,
      choices: [
        { label: 'Sit down with them and say nothing for a while', kind: 'prepare', hint: 'Costs energy. Says more than a plan would.',
          eff: (s) => ({ energy: -1, trust: 2, fact: s.res.trust >= 5 ? 'change_need' : undefined }),
          result: (s) => (needKnown(s) ? `After a long while, ${C(s)} says the real thing out loud. The cave seems smaller afterwards.` : `You sit on a cold rock together. ${C(s)} doesn't say much. But they don't let go of your sleeve either.`) },
        { label: 'Gently walk through the what-ifs one at a time', kind: 'help', hint: 'Turn fear into a list.',
          eff: { insight: 2, energy: -1 },
          then: { text: (s) => `One by one, the what-ifs get smaller when you name them. Then ${C(s)} says, "There's one I haven't said."`,
            choices: [
              { label: '"Go on."', kind: 'prepare', eff: (s) => (opens(s) ? { fact: 'change_need' } : { trust: 1 }),
                result: (s) => (opens(s) ? 'They say it. That one is the one that matters.' : `"Not yet," ${C(s)} says. "But I will."`) },
              { label: '"That\'s enough for today."', kind: 'around', eff: { trust: 1, energy: 1 }, result: 'You head for the light. Some things keep.' }
            ] } },
        { label: 'Crack a joke to lift the mood and push on', kind: 'through', hint: 'Fast. Might land. Might not.',
          eff: () => ((roll = PP.chance(0.5)) ? { momentum: 1, trust: 1 } : { momentum: 1, trust: -1 }), preview: '50%: they laugh (Trust +1). Otherwise it stings (Trust -1).',
          result: (s) => (roll ? `${C(s)} snorts. "Okay. Okay. Thank you. I needed that."` : `${C(s)} gives you a look. "I'm being serious." You were too, sort of.`) }
      ]
    },

    {
      id: 'fu_old_spreadsheet', title: 'Last time\'s spreadsheet', at: ['swamp'],
      when: (s) => F(s),
      text: (s) => `${C(s)} opens the spreadsheet you built together last time. It's lovely. It's color-coded. Every number in it assumes life before the ${change(s)}. "Can we just... change a couple of cells?"`,
      choices: [
        { label: 'Change a couple of cells', kind: 'through', hint: 'Quick. Nobody remembers what the other cells assumed.',
          eff: { momentum: 1, debt: { tag: 'spreadsheet_assumptions', sev: 2 } },
          result: 'Two cells change. Forty others quietly carry on believing in a different life.' },
        { label: 'Start fresh from what\'s true now', kind: 'prepare', hint: 'A tiring afternoon. A model that fits.',
          eff: (s) => ({ energy: -2, insight: 2, fact: opens(s) ? 'change_need' : undefined }),
          result: (s) => (needKnown(s) ? `Rebuilding row by row, the real shape of the change appears in the numbers before ${C(s)} says it out loud.` : 'A fresh sheet. Cleaner. Something is still missing from it, but at least it\'s an honest gap.') },
        { label: 'Ask Marge which numbers actually matter', kind: 'help', contact: 'veteran', show: (s) => PP.contactReady(s, 'veteran'), hint: 'The Veteran spots overcomplication from a mile away.',
          eff: { insight: 1, momentum: 1, energy: 1 },
          result: 'Marge squints at it for ten seconds. "Three numbers matter. Delete the rest." She is right, and slightly smug about it.' }
      ]
    },

    {
      id: 'fu_snakepit_calls', title: 'They called twice before', at: ['snakepit'],
      when: (s) => F(s),
      text: (s) => `Down in the pit, a phone is ringing. You recognize the number: it's ${C(s)}. From a few weeks ago. And another one before that. They called about small things before the ${change(s)}. You meant to call back.`,
      choices: [
        { label: 'Own it, out loud, to the client', kind: 'prepare', hint: 'Uncomfortable. Honest.',
          eff: { trust: 1, energy: -1 },
          result: (s) => `"I missed your calls. I'm sorry." ${C(s)} blinks. "Honestly, I'd forgotten. But thanks for saying it."` },

        { label: 'Wave the old plan through: it was fine last time', kind: 'through', hint: 'The troll will accept this. The future might not.',
          eff: { momentum: 1, debt: { tag: 'stale_info', sev: 2 } },

    {

      when: (s) => F(s),
      text: (s) => `Clients for Life looks different the ${nth(lap(s))} time. Less like a finish line, more like a front porch. ${C(s)} looks around and says, quietly, "I almost didn't call, you know. After the ${change(s)}. I thought you'd be too busy."`,
      choices: [

          eff: { trust: 2, energy: -1 },

        { label: 'Ask who else in their life might need this', kind: 'through', hint: 'The right time to ask, if the lap went well.',
          eff: (s) => (s.res.trust >= 6 ? { prospect: { temp: 'warm', source: `a referral from ${C(s)} on lap ${lap(s)}`, bias: bias(s), event: true } } : { trust: -1 }),
          result: (s) => (s.res.trust >= 6 ? `${C(s)} doesn't even hesitate. "My neighbor. She keeps asking who I talk to." (New prospect in your pipeline.)` : `${C(s)} frowns. "Let's see how this one goes first."`) }

<script>
/* Wires each contact's ready-made `assist` choice into the events where it fits.
 * Landmark ids get it on every event there; 'travel' contacts appear on a spread of encounters. */
(function (PP) {
  const contacts = PP.content.contacts || {};
  const travel = PP.content.events.filter((e) => e.at.includes('travel'));
  Object.entries(contacts).forEach(([id, ct], n) => {
    const a = ct.assist;
    if (!a) return;
    const choice = (e) => ({ label: a.label, kind: 'help', contact: id, show: (s) => PP.contactReady(s, id), eff: a.eff, result: a.result });
    (a.at || []).forEach((place) => {
      const targets = place === 'travel' ? travel.filter((e, i) => (i + n) % 4 === 0) : PP.content.events.filter((e) => e.at.includes(place));
      targets.forEach((e) => { if (!e.choices.some((c) => c.contact === id)) e.choices.push(choice(e)); });
    });
  });
})(window.PP);
